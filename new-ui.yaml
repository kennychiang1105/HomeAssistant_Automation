# V4.0-beta 1 dashboard (views regrouped so section headers stay with their cards)
button_card_templates: !include 'floorplan_v4/ios_templates.yaml'
title: 智慧家庭 橫向
views:
- title: 家
  path: home
  icon: mdi:cube-scan
  type: custom:grid-layout
  layout:
    grid-template-columns: 290px minmax(0, 1fr)
    grid-template-areas: '"nav map"'
    grid-gap: 12px
    margin: 0 auto
    mediaquery:
      '(max-width: 1150px)':
        grid-template-columns: 190px minmax(0, 1fr)
        grid-gap: 8px
  cards:
  - type: vertical-stack
    view_layout:
      grid-area: nav
    cards:
    - type: custom:floorplan-v4-sidebar
  - type: vertical-stack
    view_layout:
      grid-area: map
    cards:
    - !include 'floorplan_v4/map3d_landscape.yaml'
- title: 情境
  path: scenes
  icon: mdi:palette
  cards:
  - type: vertical-stack
    cards:
    - type: custom:button-card
      template: ios_section_header
      name: 主要情境  ›
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.google_scene_zao_an_trigger
        name: 早安
        icon: mdi:weather-sunny
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.google_scene_dao_jia_trigger
        name: 到家
        icon: mdi:home-import-outline
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.google_scene_wan_an_trigger
        name: 晚安
        icon: mdi:weather-night
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.google_scene_chu_men_trigger
        name: 出門
        icon: mdi:car-back
  - type: vertical-stack
    cards:
    - type: custom:button-card
      template: ios_section_header
      name: 頂樓情境  ›
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.ding_lou_shang_lou_qing_jing
        name: 頂樓上樓
        icon: mdi:stairs-up
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.ding_lou_xia_lou_qing_jing
        name: 頂樓下樓
        icon: mdi:stairs-down
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.ding_lou_ye_deng_qing_jing
        name: 夜燈
        icon: mdi:weather-night
      - type: custom:button-card
        template: ios_scene_card
        entity: input_boolean.ding_lou_yue_du_qing_jing
        name: 閱讀
        icon: mdi:book-open-page-variant

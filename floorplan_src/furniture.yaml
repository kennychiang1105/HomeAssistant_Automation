# 3D 家具 / 樓梯 / 鐵門 手動標註（座標 = 各樓層 2D 平面圖 SVG 座標，x 向東、y 向南）
# 由 scripts/generate_floorplan_v4.py build3d 讀取；平面圖上這些範圍內的線條不再自動拉高，改用具象模型。
# type: bed(head=N/S/E/W) desk table coffee chair(face) sofa(back) wardrobe cabinet shelf counter
#       toilet(tank) sink shower bathtub car appliance washer stove computer printer plant tv_unit
# stairs: up = 往上一層（從本層地板升到上層），down = 從本層樓板開口往下（arrow = 上樓方向，由平面圖箭頭判讀）


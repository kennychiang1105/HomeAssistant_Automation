button_card_templates:

  # ── 通用裝置卡片 ─────────────────────────────────────
  ios_device_card:
    show_state: true
    show_name: true
    show_icon: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 16px
        - padding: 14px 14px 12px 14px
        - height: 90px
        - background: "#3a3a3c"
        - box-shadow: "0 1px 4px rgba(0,0,0,0.35)"
        - transition: background 0.2s ease
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 1fr auto auto
        - justify-items: start
      icon:
        - color: "#6e6e73"
        - width: 28px
        - height: 28px
      name:
        - font-size: 13px
        - font-weight: "700"
        - color: "#ebebf5"
        - text-align: left
        - padding-top: 2px
      state:
        - font-size: 11px
        - color: "#636366"
        - text-align: left
    state:
      - value: "on"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"
      - value: "open"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"
      - value: "playing"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"
      - value: "heat"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FF6B00"
          name:
            - color: "#111111"
          state:
            - color: "#888888"

  # ── 燈光卡片（支援亮度 %）─────────────────────────────
  ios_light_card:
    template: ios_device_card
    state_display: >
      [[[
        if (!entity) return 'Off';
        if (entity.state === 'on') {
          const bri = entity.attributes.brightness;
          if (bri !== undefined) return Math.round(bri / 255 * 100) + '%';
          return 'On';
        }
        return 'Off';
      ]]]

  # ── 門鎖卡片 ─────────────────────────────────────────
  ios_lock_card:
    show_state: true
    show_name: true
    show_icon: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 16px
        - padding: 14px 14px 12px 14px
        - height: 90px
        - background: "#3a3a3c"
        - box-shadow: "0 1px 4px rgba(0,0,0,0.35)"
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 1fr auto auto
        - justify-items: start
      icon:
        - color: "#6e6e73"
        - width: 28px
        - height: 28px
      name:
        - font-size: 13px
        - font-weight: "700"
        - color: "#ebebf5"
        - text-align: left
        - padding-top: 2px
      state:
        - font-size: 11px
        - color: "#636366"
        - text-align: left
    state:
      - value: "unlocked"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"

  # ── 捲門/車庫門 ──────────────────────────────────────
  ios_cover_card:
    show_state: true
    show_name: true
    show_icon: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    state_display: >
      [[[
        if (!entity) return '';
        const m = { open:'Open', closed:'Closed', opening:'Opening…', closing:'Closing…' };
        return m[entity.state] || entity.state;
      ]]]
    styles:
      card:
        - border-radius: 16px
        - padding: 14px 14px 12px 14px
        - height: 90px
        - background: "#3a3a3c"
        - box-shadow: "0 1px 4px rgba(0,0,0,0.35)"
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 1fr auto auto
        - justify-items: start
      icon:
        - color: "#6e6e73"
        - width: 28px
        - height: 28px
      name:
        - font-size: 13px
        - font-weight: "700"
        - color: "#ebebf5"
        - text-align: left
        - padding-top: 2px
      state:
        - font-size: 11px
        - color: "#636366"
        - text-align: left
    state:
      - value: "open"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"
      - value: "opening"
        styles:
          card:
            - background: "#fff3cc"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"

  # ── 情境按鈕（pill 風格）────────────────────────────
  ios_scene_card:
    show_state: false
    show_name: true
    show_icon: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - border-radius: 14px
        - background: "#3a3a3c"
        - height: 64px
        - padding: 0 16px
        - box-shadow: "0 1px 4px rgba(0,0,0,0.3)"
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 28px 1fr
        - align-items: center
        - justify-items: start
        - column-gap: 10px
      name:
        - font-size: 15px
        - font-weight: "600"
        - color: "#ffffff"
        - text-align: left
        - white-space: nowrap
      icon:
        - color: "#FFB900"
        - width: 22px
        - height: 22px

  # ── Section 標題 ─────────────────────────────────────
  ios_section_header:
    show_icon: false
    show_name: true
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border-radius: 0
        - padding: 18px 4px 6px 2px
        - height: auto
        - margin-top: 4px
      name:
        - font-size: 17px
        - font-weight: "700"
        - color: "#ebebf5"
        - text-align: left

  # ── 環境概況 Pill ─────────────────────────────────────
  ios_env_pill:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - border-radius: 20px
        - background: "rgba(58,58,60,0.9)"
        - padding: 8px 14px
        - height: auto
        - box-shadow: none
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 22px 1fr
        - align-items: center
        - column-gap: 8px
      name:
        - font-size: 10px
        - font-weight: "500"
        - color: "#98989d"
        - text-align: left
        - text-transform: uppercase
      state:
        - font-size: 13px
        - font-weight: "600"
        - color: "#ebebf5"
        - text-align: left
      icon:
        - color: "#98989d"
        - width: 18px
        - height: 18px

  # ── 保全卡片 ─────────────────────────────────────────
  ios_alarm_card:
    show_state: true
    show_name: true
    show_icon: true
    tap_action:
      action: more-info
    state_display: >
      [[[
        if (!entity) return '';
        const m = { disarmed:'Home', armed_home:'Home',
          armed_away:'Away', triggered:'⚠ Alert', pending:'Pending', arming:'Arming' };
        return m[entity.state] || entity.state;
      ]]]
    styles:
      card:
        - border-radius: 16px
        - padding: 14px 14px 12px 14px
        - height: 90px
        - background: "#3a3a3c"
        - box-shadow: "0 1px 4px rgba(0,0,0,0.35)"
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 1fr auto auto
        - justify-items: start
      icon:
        - color: "#6e6e73"
        - width: 28px
        - height: 28px
      name:
        - font-size: 13px
        - font-weight: "700"
        - color: "#ebebf5"
        - text-align: left
        - padding-top: 2px
      state:
        - font-size: 11px
        - color: "#636366"
        - text-align: left
    state:
      - value: "disarmed"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#34C759"
          name:
            - color: "#111111"
          state:
            - color: "#888888"
      - value: "armed_home"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#34C759"
          name:
            - color: "#111111"
          state:
            - color: "#888888"
      - value: "triggered"
        styles:
          card:
            - background: "#FF3B30"
          icon:
            - color: "#ffffff"
          name:
            - color: "#ffffff"
          state:
            - color: "#ffcccc"

  # ── 媒體播放器 ────────────────────────────────────────
  ios_media_card:
    show_state: true
    show_name: true
    show_icon: true
    tap_action:
      action: more-info
    state_display: >
      [[[
        if (!entity) return '';
        if (entity.state === 'playing') return entity.attributes.media_title || 'Playing';
        return 'Not Playing';
      ]]]
    styles:
      card:
        - border-radius: 16px
        - padding: 14px 14px 12px 14px
        - height: 90px
        - background: "#3a3a3c"
        - box-shadow: "0 1px 4px rgba(0,0,0,0.35)"
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 1fr auto auto
        - justify-items: start
      icon:
        - color: "#6e6e73"
        - width: 28px
        - height: 28px
      name:
        - font-size: 13px
        - font-weight: "700"
        - color: "#ebebf5"
        - text-align: left
        - padding-top: 2px
      state:
        - font-size: 11px
        - color: "#636366"
        - text-align: left
    state:
      - value: "playing"
        styles:
          card:
            - background: "#ffffff"
          icon:
            - color: "#FFB900"
          name:
            - color: "#111111"
          state:
            - color: "#888888"

title: 智慧家庭 Home
views:

  # ════════════════════════════════════════════════════════
  # 📱 首頁
  # ════════════════════════════════════════════════════════
  - title: 首頁
    path: all
    icon: mdi:home
    cards:

      - type: picture-entity
        entity: camera.g6_instant_high_resolution_channel
        name: 車庫攝影機
        show_name: true
        show_state: false
        camera_view: live

      - type: custom:button-card
        template: ios_section_header
        name: "情境"

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: ios_scene_card
            entity: input_boolean.google_scene_zao_an_trigger
            name: 早安
            icon: mdi:weather-sunny
          - type: custom:button-card
            template: ios_scene_card
            entity: input_boolean.google_scene_dao_jia_trigger
            name: 到家
            icon: mdi:home-import-outline
          - type: custom:button-card
            template: ios_scene_card
            entity: input_boolean.google_scene_wan_an_trigger
            name: 晚安
            icon: mdi:weather-night
          - type: custom:button-card
            template: ios_scene_card
            entity: input_boolean.google_scene_chu_men_trigger
            name: 出門
            icon: mdi:car-back

      - type: custom:button-card
        template: ios_section_header
        name: "車庫  ›"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: ios_cover_card
            entity: cover.garage
            name: 鐵門
            icon: mdi:garage-variant
          - type: custom:button-card
            template: ios_device_card
            entity: switch.che_ku_zhu_deng
            name: 車庫主燈
            icon: mdi:ceiling-light
          - type: custom:button-card
            template: ios_device_card
            entity: switch.lou_ti_deng
            name: 車庫樓梯燈
            icon: mdi:coach-lamp

      - type: custom:button-card
        template: ios_section_header
        name: "客廳  ›"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: ios_alarm_card
            entity: alarm_control_panel.54ef44cf58f9_alarm
            name: 保全系統
            icon: mdi:shield-home
          - type: custom:button-card
            template: ios_lock_card
            entity: lock.er_lou_men_suo
            name: 二樓門鎖
            icon: mdi:lock
          - type: custom:button-card
            template: ios_light_card
            entity: switch.ke_ting_bi_deng
            name: 客廳小燈
            icon: mdi:wall-sconce-flat
          - type: custom:button-card
            template: ios_light_card
            entity: light.ke_ting_deng_zu_1_ha
            name: 客廳燈組一
            icon: mdi:ceiling-fan-light
          - type: custom:button-card
            template: ios_light_card
            entity: light.ke_ting_deng_zu_2
            name: 客廳燈組二
            icon: mdi:ceiling-fan-light
          - type: custom:button-card
            template: ios_light_card
            entity: light.ke_ting_deng_zu_3
            name: 客廳燈組三
            icon: mdi:ceiling-fan-light
          - type: custom:button-card
            template: ios_device_card
            entity: switch.ke_ting_dian_shi
            name: 客廳電視
            icon: mdi:television
          - type: custom:button-card
            template: ios_device_card
            entity: fan.kong_qi_qing_jing_ji
            name: 空氣清淨機
            icon: mdi:air-purifier
            tap_action:
              action: more-info
          - type: custom:button-card
            template: ios_device_card
            entity: switch.ke_ting_kan_deng
            name: 門口燈
            icon: mdi:coach-lamp
          - type: custom:button-card
            template: ios_device_card
            entity: switch.lu_deng
            name: 路燈
            icon: mdi:outdoor-lamp

      - type: custom:button-card
        template: ios_media_card
        entity: media_player.ke_ting_homepod
        name: 客廳 HomePod
        icon: mdi:speaker

      - type: custom:button-card
        template: ios_section_header
        name: "餐廳  ›"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: ios_light_card
            entity: light.can_ting_deng_zu_1_ha
            name: 餐廳燈
            icon: mdi:chandelier
          - type: custom:button-card
            template: ios_device_card
            entity: switch.chu_fang_deng
            name: 廚房燈
            icon: mdi:stove
          - type: custom:button-card
            template: ios_device_card
            entity: switch.ce_suo_deng
            name: 廁所燈
            icon: mdi:toilet
          - type: custom:button-card
            template: ios_device_card
            entity: switch.can_ting_kan_deng
            name: 壁燈
            icon: mdi:wall-sconce
          - type: custom:button-card
            template: ios_device_card
            entity: switch.0x00158d0003923796_plug
            name: 廚房插座
            icon: mdi:power-socket-eu

      - type: custom:button-card
        template: ios_section_header
        name: "樓梯間  ›"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: ios_device_card
            entity: switch.er_san_lou_lou_ti_deng
            name: 二三樓梯燈
            icon: mdi:stairs
          - type: custom:button-card
            template: ios_device_card
            entity: switch.san_lou_lou_ti_deng
            name: 三樓梯燈
            icon: mdi:stairs
          - type: custom:button-card
            template: ios_device_card
            entity: switch.san_si_lou_lou_ti_deng
            name: 三四樓梯燈
            icon: mdi:stairs
          - type: custom:button-card
            template: ios_device_card
            entity: switch.si_lou_lou_ti_deng
            name: 四樓梯燈
            icon: mdi:stairs
          - type: custom:button-card
            template: ios_device_card
            entity: switch.shu_fang_deng
            name: 書房燈
            icon: mdi:bookshelf

      - type: custom:button-card
        template: ios_section_header
        name: "家庭其他裝置  ›"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            template: ios_device_card
            entity: input_boolean.jin_ji_mo_shi_pan_duan_kai_guan_i_homekit
            name: 解除網關警報
            icon: mdi:bell-off
          - type: custom:button-card
            template: ios_device_card
            entity: input_boolean.5f_security_temp_disable
            name: 五樓保全暫解
            icon: mdi:shield-off

  # ════════════════════════════════════════════════════════
  # 🗺️ 平面圖（條件式 SVG，替換 custom:card-3d-floorplan）
  # ════════════════════════════════════════════════════════
  - title: 平面圖
    path: floorplan
    icon: mdi:floor-plan
    cards:

      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.floorplan_active_floor
            name: 選擇樓層

      - type: conditional
        conditions:
          - entity: input_select.floorplan_active_floor
            state: "1F 車庫"
        card:
          type: picture
          image: /local/floorplan/3d/floor_1f_3d.svg
          tap_action:
            action: none

      - type: conditional
        conditions:
          - entity: input_select.floorplan_active_floor
            state: "2F 客廳餐廳"
        card:
          type: picture
          image: /local/floorplan/3d/floor_2f_3d.svg
          tap_action:
            action: none

      - type: conditional
        conditions:
          - entity: input_select.floorplan_active_floor
            state: "3F 主臥室"
        card:
          type: picture
          image: /local/floorplan/3d/floor_3f_3d.svg
          tap_action:
            action: none

      - type: conditional
        conditions:
          - entity: input_select.floorplan_active_floor
            state: "4F 次臥"
        card:
          type: picture
          image: /local/floorplan/3d/floor_4f_3d.svg
          tap_action:
            action: none

      - type: conditional
        conditions:
          - entity: input_select.floorplan_active_floor
            state: "5F 頂樓"
        card:
          type: picture
          image: /local/floorplan/3d/floor_5f_3d.svg
          tap_action:
            action: none

      - type: conditional
        conditions:
          - entity: input_select.floorplan_active_floor
            state: "全棟立體透視"
        card:
          type: picture
          image: /local/floorplan/3d/floor_all_3d.svg
          tap_action:
            action: none

      - type: markdown
        content: |
          {% set f = states('input_select.floorplan_active_floor') %}
          ## 🏠 {{ f }} 即時狀態

          {% if '1F' in f %}
          | 設備 | 狀態 |
          |---|---|
          | 🚗 車庫鐵門 | **{{ states('cover.garage') | upper }}** |
          | 💡 車庫主燈 | **{{ states('switch.che_ku_zhu_deng') | upper }}** |
          | 🪜 車庫樓梯燈 | **{{ states('switch.lou_ti_deng') | upper }}** |
          | 🎥 動態偵測 | **{{ states('binary_sensor.g6_instant_motion') | upper }}** |
          {% elif '2F' in f %}
          | 設備 | 狀態 |
          |---|---|
          | 🛡️ 保全 | **{{ states('alarm_control_panel.54ef44cf58f9_alarm') }}** |
          | 🔒 二樓門鎖 | **{{ states('lock.er_lou_men_suo') | upper }}** |
          | 🌡️ 溫度 | **{{ states('sensor.kong_qi_qing_jing_ji_temperature') }}°C** |
          | 💧 濕度 | **{{ states('sensor.kong_qi_qing_jing_ji_humidity') }}%** |
          | 🍃 PM2.5 | **{{ states('sensor.kong_qi_qing_jing_ji_pm2_5') }}** |
          {% elif '3F' in f %}
          | 設備 | 狀態 |
          |---|---|
          | 🪜 二三樓梯燈 | **{{ states('switch.er_san_lou_lou_ti_deng') | upper }}** |
          | 💡 三樓梯燈 | **{{ states('switch.san_lou_lou_ti_deng') | upper }}** |
          {% elif '4F' in f %}
          | 設備 | 狀態 |
          |---|---|
          | 🪜 三四樓梯燈 | **{{ states('switch.san_si_lou_lou_ti_deng') | upper }}** |
          | 💡 四樓梯燈 | **{{ states('switch.si_lou_lou_ti_deng') | upper }}** |
          {% elif '5F' in f %}
          | 設備 | 狀態 |
          |---|---|
          | 📚 書房燈 | **{{ states('switch.shu_fang_deng') | upper }}** |
          | 🌡️ 頂樓溫度 | **{{ states('sensor.5f_homepodmini_temperature') }}°C** |
          {% elif '全棟' in f %}
          | 區域 | 開啟燈數 |
          |---|---|
          | 1F 車庫 | **{{ expand(['switch.che_ku_zhu_deng','switch.lou_ti_deng']) | selectattr('state','eq','on') | list | count }}** |
          | 2F 客廳 | **{{ expand(['switch.ke_ting_bi_deng','light.ke_ting_deng_zu_1_ha','light.ke_ting_deng_zu_2','light.ke_ting_deng_zu_3']) | selectattr('state','eq','on') | list | count }}** |
          | 樓梯間 | **{{ expand(['switch.er_san_lou_lou_ti_deng','switch.san_lou_lou_ti_deng','switch.san_si_lou_lou_ti_deng','switch.si_lou_lou_ti_deng']) | selectattr('state','eq','on') | list | count }}** |
          {% endif %}

  # ════════════════════════════════════════════════════════
  # 🖥️ iPad 全家控制
  # ════════════════════════════════════════════════════════
  - title: iPad
    path: ipad
    icon: mdi:tablet-dashboard
    cards:

      - type: horizontal-stack
        cards:
          - type: custom:button-card
            template: ios_env_pill
            entity: alarm_control_panel.54ef44cf58f9_alarm

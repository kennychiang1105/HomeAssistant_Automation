# ────────────────────────────────────────────────────────
# 入侵警報AI (V4.2.2)
# 相容版本：Helpers V4.1.0（已確認）
# 更新紀錄（統一格式）：
# - V4.2.2（2026-10-22）：同一台實體裝置只算一個訊號：改用裝置名稱（不是 device_id）判斷「不同裝置」。車庫攝影機在 HA 裡有兩個名稱相同的裝置（UVC G6 Instant／G6 Instant），
#   一次車庫動作就被當成兩個裝置而判定疑似入侵（2026-10-22 14:29 家人開車回家時誤報）。
# - V4.2.0（2026-10-18）：移除 shadow 模式（正式模式直接通知、廣播、倒數與響警報），保留 real／dry／test。
# - V4.1.6（2026-10-12）：新增。離家入侵偵測（08-7）的兩支腳本：
#     script.intrusion_record_signal：記錄一個入侵訊號（同一個裝置只留最新一筆），回傳「視窗內不同裝置」的訊號數與清單；queued 避免同時寫入互相覆蓋。
#     script.intrusion_alert：通知與警報流程。mode：real（正式）／dry（測試乾跑，只寫 logbook）／test（只發通知，不廣播不響警報）。
#       流程：冷卻檢查 → 車庫與頂樓攝影機截圖 → 緊急級 LINE／HA 通知（兩張截圖、攝影機即時影像與「家庭」App 按鈕）＋廣播 → 倒數（家人回來／切到在家或早安情境／關閉功能就取消）→ 觸發網關警報（aqara_chu_fa，由 106 同步到實體網關）。
# ────────────────────────────────────────────────────────
intrusion_record_signal:
  alias: 入侵偵測記錄訊號AI (V4.2.2)
  description: 記錄入侵訊號，回傳視窗內來自不同裝置的訊號數量
  mode: queued
  max: 30
  fields:
    entity_id:
      description: 觸發訊號的實體
      required: true
  sequence:
    - variables:
        now_ts: "{{ now().timestamp() }}"
        win_s: "{{ (states('input_number.intrusion_window_min') | float(5)) * 60 }}"
        raw: "{{ states('input_text.intrusion_recent') }}"
        # V4.2.2：同一台實體裝置只算一個訊號（車庫攝影機在 HA 裡有兩個名稱相同的裝置，原本一次動作就被當成兩個裝置而判定入侵），改用裝置名稱當鍵
        my_dev: "{% macro dk(e) %}{{ (device_attr(device_id(e), 'name') if device_id(e) else '') or e }}{% endmacro %}{{ dk(entity_id) | trim }}"
        kept: >-
          {% macro dk(e) %}{{ (device_attr(device_id(e), 'name') if device_id(e) else '') or e }}{% endmacro %}
          {% set ns = namespace(o=[]) %}
          {% for it in (raw.split(';') if raw not in ['unknown', 'unavailable', ''] else []) %}
          {% set p = it.split('@') %}
          {% if p | length == 2 and (now_ts - (p[1] | float(0))) <= win_s and dk(p[0]) | trim != my_dev %}
          {% set ns.o = ns.o + [it] %}
          {% endif %}
          {% endfor %}
          {{ ns.o | tojson }}
        newlist: "{{ (kept + [entity_id ~ '@' ~ (now_ts | int)])[-3:] }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.intrusion_recent
      data:
        value: "{{ newlist | join(';') }}"
    - variables:
        result:
          count: "{{ newlist | count }}"
          entities: "{{ newlist | map('regex_replace', '@.*$', '') | list }}"
    - stop: "已記錄"
      response_variable: result

intrusion_alert:
  alias: 入侵警報AI (V4.2.2)
  description: 疑似入侵時的通知、廣播、倒數與網關警報（mode：real／dry／test）
  mode: single
  max_exceeded: silent
  fields:
    names:
      description: 觸發的感應器名稱（頓號分隔）
      required: true
    mode:
      description: real／dry／test
      required: false
  variables:
    automation_version: V4.2.2
    md: "{{ mode if (mode is defined and mode) else 'real' }}"
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"
    cd: "{{ states('input_number.intrusion_countdown_sec') | int(30) }}"
  sequence:
    - alias: "冷卻（正式）：太近的第二次不處理"
      if: >-
        {{ md == 'real'
           and (now().timestamp() - as_timestamp(states('input_datetime.intrusion_last_alert'), 0)) < (states('input_number.intrusion_cooldown_min') | float(30)) * 60 }}
      then:
        - stop: "冷卻中"
    - if: "{{ md == 'real' }}"
      then:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.intrusion_last_alert
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: logbook.log
      data:
        name: 離家入侵偵測
        message: >-
          {{ {'real': '疑似入侵', 'dry': '測試（乾跑）：會通知疑似入侵', 'test': '手動測試通知'}[md] }}：{{ names }}
    - if: "{{ md == 'dry' }}"
      then:
        - stop: "乾跑：只寫紀錄"
    # 兩張截圖（車庫、頂樓）＋即時影像
    - variables:
        live_token: "live{{ range(10000, 99999) | random }}{{ range(10000, 99999) | random }}{{ range(10000, 99999) | random }}"
    - action: script.turn_on
      target:
        entity_id: script.garage_live
      data:
        variables:
          token: "{{ live_token }}"
      continue_on_error: true
    - action: script.garage_snapshot
      response_variable: snap_garage
      continue_on_error: true
    - action: script.garage_snapshot
      data:
        camera: camera.wu_lou_she_ying_ji_high
      response_variable: snap_top
      continue_on_error: true
    - action: script.notify_dispatch
      data:
        level: emergency
        source: "08-7離家入侵偵測AI (V4.2.2)"
        version: "{{ automation_version }}"
        title: "{{ '【測試】' if md == 'test' else '' }}疑似入侵（離家中）"
        icon: "https://family.kteam.tw:8126/local/icons/shield.png?v=2"
        image: "{{ snap_garage.url if snap_garage is defined and snap_garage is mapping and snap_garage.url is defined else '' }}"
        image2: "{{ snap_top.url if snap_top is defined and snap_top is mapping and snap_top.url is defined else '' }}"
        link_url: "http://192.168.68.97:8125/local/live.html?t={{ live_token }}&openExternalBrowser=1"
        link_label: 開啟攝影機即時影像
        link_note: 僅限連接家裡 Wi-Fi 時可開啟
        link2_url: "https://family.kteam.tw:8126/local/home.html?openExternalBrowser=1"
        link2_label: 在「家庭」App 查看攝影機
        link2_note: 外出（外網）也可使用
        user_id: "{{ line_bot_target_user_id }}"
        voice: "{{ '' if md == 'test' else '離家期間偵測到疑似入侵，請立即確認。' }}"
        message: |-
          {{ '這是測試通知，不會響警報。' if md == 'test' else '離家期間偵測到疑似入侵，請立即確認！' }}

          時間：{{ now().strftime('%Y-%m-%d %H:%M:%S') }}
          觸發的感應器：{{ names }}
          {% if md == 'real' %}倒數：⟦r:{{ cd }} 秒⟧後若家裡仍沒有人，⟦r:觸發網關警報⟧{% endif %}

          家人回來：到「家庭」App 點選「早安」或「到家」情境，⟦g:就會取消⟧，不會響警報。
    - if: "{{ md == 'test' }}"
      then:
        - stop: "測試通知已送出"
    # 倒數：有人回家／切到在家、早安或到家情境／關閉功能／離家情境被解除 → 取消
    - wait_template: >-
        {{ is_state('input_boolean.aqara_zai_jia', 'on') or is_state('binary_sensor.at_home_anyone_home', 'on')
           or is_state('input_boolean.intrusion_watch_enable', 'off') or is_state('input_boolean.aqara_li_jia', 'off') }}
      timeout: "{{ cd }}"
      continue_on_timeout: true
    - if: "{{ wait.completed }}"
      then:
        - action: script.notify_dispatch
          data:
            level: info
            line: false
            source: "08-7離家入侵偵測AI (V4.2.2)"
            version: "{{ automation_version }}"
            title: 疑似入侵警報已取消
            message: |-
              已取消網關警報
              時機：倒數期間
              原因：家人回到家、網關切到在家模式，或入侵偵測被關閉
        - stop: "已取消"
    - if: "{{ is_state('input_boolean.intrusion_watch_alarm_enable', 'on') }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.aqara_chu_fa
        - action: script.notify_dispatch
          data:
            level: emergency
            line: false
            source: "08-7離家入侵偵測AI (V4.2.2)"
            version: "{{ automation_version }}"
            title: 已觸發網關警報
            message: |-
              倒數結束家裡仍沒有人，已觸發網關警報。
              到場確認後，在「家庭」App 按「解除網關警報」即可解除。
      else:
        - action: script.notify_dispatch
          data:
            level: important
            line: false
            source: "08-7離家入侵偵測AI (V4.2.2)"
            version: "{{ automation_version }}"
            title: 疑似入侵（未觸發警報）
            message: |-
              倒數結束，家裡仍沒有人
              警報：沒有觸發
              原因：「入侵偵測觸發網關警報」開關是關閉的


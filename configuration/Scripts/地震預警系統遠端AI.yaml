# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# - V4.0.0：第一段（預估秒數）播完立即接第二段緊急音效＋「立即就地趴下、掩護、穩住」（不等抵達時間、不再空 11 秒）。
# - V4.0.0：（舊）預估抵達時間一到立即播放緊急音效＋「發生地震，請就地避難掩護」（原本固定等 25 秒，中間會空一段）；沒有秒數時維持 25 秒。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V4.0.0：地震廣播延遲優化：①廣播移到最前面（不等 LINE／緊急模式／通知）並不阻塞；②第一句改短句並預先合成快取（斷網也能播）；③拿掉廣播前的 HomePod volume_set（實測卡約 3.6 秒），音量交給統一廣播；④播報秒數扣掉處理延遲與念到數字前的約 3 秒，剩 ≤2 秒改念「立即就地趴下，掩護，穩住」。
# - V4.2.3：多來源去重（SOP-24）：開頭判斷是不是同一場，最快的先處理，後到的只記錄慢了幾秒；升級（高 2 級以上）才重新警報。
# - V4.2.3：預警一收到就不阻塞啟動 script.eew_detail_followup（氣象署震央詳情補發，SOP-24）。
# 相容版本：Helpers V3.9（已確認）
'eq99':
  alias: 地震預警系統(遠端)AI (V4.2.0)
  description: 地震預警通知與分級廣播；4級以上觸發緊急模式。
  variables:
    automation_version: 'V4.2.0'
    ts0: "{{ now().timestamp() }}"
    # 修正 1：將 level_text 移至上方，讓後續的 lv 可以正確引用它
    level_text: >-
      {{ level if level is defined and level|string|trim not in ['', 'unknown', 'unavailable'] else '未知' }}
    seconds_text: >-
      {{ seconds if seconds is defined and seconds|string|trim not in ['', 'unknown', 'unavailable'] else '未知' }}
    # 修正 2：使用更安全的 regex 取值方式。就算字串是 "未知" 也不會引發系統崩潰，會安全地給予預設值 0
    lv: >-
      {{ (level_text | regex_findall('\d+') | join('')) | int(0) }}
    # 預估到達秒數（數字；取不到為 -1）。必須定義在 seconds_text 之後
    sec_i: "{{ seconds_text | int(-1) }}"
    line_bot_target_user_id: >-
      {{ states('sensor.line_bot_target_user_id') }}
  sequence:
  # V4.2.3（SOP-24）：多來源去重。任何來源（地牛、TREM、氣象署 PWS…）都呼叫本腳本並帶 source；
  # 合併時間內同一場地震只處理最快到的一個，後到的記錄「慢了幾秒」後略過；預估震度比先到的高 2 級以上（且達 3 級）才算升級、重新警報。
  - variables:
      src: "{{ source | default('地牛') if source is defined else '地牛' }}"
      last_ts: "{{ as_timestamp(states('input_datetime.eew_last_event'), 0) }}"
      gap: "{{ ts0 | float(0) - last_ts | float(0) }}"
      prev_lv: "{{ (states('input_text.eew_last_info').split('|')[1] | int(0)) if '|' in states('input_text.eew_last_info') else 0 }}"
      prev_src: "{{ states('input_text.eew_last_info').split('|')[0] if '|' in states('input_text.eew_last_info') else '' }}"
      is_dup: "{{ gap | float(999999) < (states('input_number.eew_dedupe_window_sec') | float(150)) and not (lv | int(0) >= 3 and lv | int(0) >= prev_lv | int(0) + 2) }}"
  # 來源有給震央資料（TREM：地名、規模、深度）就記下來，截圖卡會附上；重複來源也先記（不需要是最快的）
  - if: "{{ eq_loc is defined and eq_loc }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.eew_last_extra
        data:
          value: "{{ eq_loc }}|{{ eq_mag }}|{{ eq_depth }}|{{ src }}"
  - if: "{{ is_dup }}"
    then:
      - action: logbook.log
        data:
          name: 地震預警系統(遠端)AI
          message: "重複預警略過：{{ src }} 比 {{ prev_src }} 慢 {{ gap | float(0) | round(1) }} 秒（預估 {{ lv }} 級，先到的是 {{ prev_lv }} 級）"
        continue_on_error: true
      - stop: "同一場地震已由 {{ prev_src }} 處理，{{ src }} 慢了 {{ gap | float(0) | round(1) }} 秒"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.eew_last_event
    data:
      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - action: input_text.set_value
    target:
      entity_id: input_text.eew_last_info
    data:
      value: "{{ src }}|{{ lv }}"
  - action: input_text.set_value
    target:
      entity_id: input_text.line_eew_remote_level
    data:
      value: '{{ level_text }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.line_eew_remote_seconds
    data:
      value: '{{ seconds_text }}'
  # V4.2.3：預警一收到就不阻塞啟動「詳情補發」（每分鐘查氣象署，最多 10 分鐘；LINE 受 eew_line_min_level 控管，見 packages/v42_eew_detail.yaml）
  - action: script.turn_on
    target:
      entity_id: script.eew_detail_followup
    data:
      variables:
        lv: "{{ lv }}"
        t0: "{{ ts0 }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ lv <= 2 }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.notify_line_important_enable
          state: 'on'
        then:
        - action: script.send_line_to_user
          data:
            source: "地震預警系統(遠端)AI (V4.2.0)"
            user_id: '{{ line_bot_target_user_id | default(''C26ff4e9d30159ba5264a1676f46f8f86'') }}'
            payload: >-
              {% set level_raw = states('input_text.line_eew_remote_level') %}
              {% set level_safe = level_raw if level_raw|trim and level_raw|lower not in ['unknown','unavailable','none'] else level_text | default('未知') %}
              {% set seconds_raw = states('input_text.line_eew_remote_seconds') %}
              {% set seconds_safe = seconds_raw if seconds_raw|trim and seconds_raw|lower not in ['unknown','unavailable','none'] else seconds_text | default('未知') %}
              {% set messages = [
                {"type":"text","text":"【地震預警速報】重要 Important ⚠️"},
                {"type":"text","text":"預估地震" ~ level_safe ~ "級，" ~ seconds_safe ~ "秒後到達。\n目前未達廣播門檻（3級）與緊急模式門檻（4級）。"}
              ] %}
              {{ messages | tojson }}
      - action: script.notify_dispatch
        data:
          level: emergency
          line: false
          source: "地震預警系統(遠端)AI (V4.2.0)"
          version: "{{ automation_version | default('', true) }}"
          title: 地震預警速報
          message: >-
            地震預警系統收到訊息：預估地震{{ states('input_text.line_eew_remote_level') }}級，
            {{ states('input_text.line_eew_remote_seconds') }}秒後到達。
            本次僅發送通知，不啟動廣播與緊急模式。
    - conditions:
      - condition: template
        value_template: '{{ lv >= 3 }}'
      sequence:
      # [V4.0.0 地震延遲優化] 廣播最先執行（不等 LINE／緊急模式／通知），並以 script.turn_on 不阻塞後續動作。
      # 語音是預先合成的短句（www 快取暖機 warm_announce.py：震度 3~7 × 3~60 秒），念到數字時倒數已過去約 3 秒，
      # 所以播報秒數 = 預估秒數 - 已經過秒數 - 3；剩 ≤2 秒改念「立即就地趴下，掩護，穩住」。
      # （不再先 volume_set 兩台 HomePod：實測會卡約 3.6 秒；音量由 script.announce 依「廣播音量_緊急」設定）
      - variables:
          say_sec: "{{ (sec_i - (now().timestamp() - ts0 | float) - 3) | round(0) | int }}"
          quake_msg: >-
            {% if sec_i < 0 %}地震預警！預估地震{{ level_text }}級，立即就地避難！{% elif say_sec <= 2 %}地震！地震！立即就地趴下，掩護，穩住！{% else %}地震預警！預估{{ level_text }}級，{{ [say_sec, 99] | min }}秒後到達！{% endif %}
      # 氣氛燈先啟動（不等廣播合成），announce 內部再呼叫時會被去重
      - action: script.turn_on
        target:
          entity_id: script.mood_alert
        data:
          variables:
            level: emergency
            source: "地震預警"
            test: "{{ test | default(false) }}"
      - action: script.turn_on
        target:
          entity_id: script.announce
        data:
          variables:
            level: emergency
            chime: false
            message: "{{ quake_msg }}"
      - if:
        - condition: state
          entity_id: input_boolean.notify_line_emergency_enable
          state: 'on'
        then:
        - action: script.send_line_to_user
          data:
            source: "地震預警系統(遠端)AI (V4.2.0)"
            user_id: '{{ line_bot_target_user_id | default(''C26ff4e9d30159ba5264a1676f46f8f86'') }}'
            payload: >-
              {% set level_raw = states('input_text.line_eew_remote_level') %}
              {% set level_safe = level_raw if level_raw|trim and level_raw|lower not in ['unknown','unavailable','none'] else level_text | default('未知') %}
              {% set seconds_raw = states('input_text.line_eew_remote_seconds') %}
              {% set seconds_safe = seconds_raw if seconds_raw|trim and seconds_raw|lower not in ['unknown','unavailable','none'] else seconds_text | default('未知') %}
              {% if lv >= 4 %}
              {% set status_text = '預估震度達 4 級以上，系統將啟動緊急模式並同步廣播。' %}
              {% else %}
              {% set status_text = '本次將啟動廣播提醒，但不啟動緊急模式。' %}
              {% endif %}
              {% set messages = [
                {"type":"text","text":"【地震預警速報】緊急 Urgent ‼️"},
                {"type":"text","text":"預估地震" ~ level_safe ~ "級，" ~ seconds_safe ~ "秒後到達。\n" ~ status_text}
              ] %}
              {{ messages | tojson }}
      - if:
        - condition: template
          value_template: '{{ lv >= 4 }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.jin_ji_mo_shi_pan_duan_kai_guan_iii_ha_manual
          data: {}
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.jin_ji_mo_shi_pan_duan_kai_guan_ii_ha_auto
          data: {}
        - data:
            skip_condition: true
          target:
            entity_id: automation.jin_ji_mo_shi
          action: automation.trigger
      - action: script.notify_dispatch
        data:
          level: emergency
          line: false
          source: "地震預警系統(遠端)AI (V4.2.0)"
          version: "{{ automation_version | default('', true) }}"
          title: 地震預警速報
          message: >-
            地震預警系統收到訊息：預估地震{{ states('input_text.line_eew_remote_level') }}級，
            {{ states('input_text.line_eew_remote_seconds') }}秒後到達。
            {% if lv >= 4 %}
            已啟動緊急模式，並將進行廣播提醒。
            {% else %}
            已啟動廣播提醒，未啟動緊急模式。
            {% endif %}
      # 第一段（預估秒數）播完就接第二段：緊急音效＋「立即就地趴下、掩護、穩住」，不等預估抵達時間（原本固定等 25 秒再播，中間空一段）
      # 先等 1 秒讓 script.announce 真的開始執行，再等它結束（最多 25 秒）
      - delay: "00:00:01"
      - wait_template: "{{ is_state('script.announce', 'off') }}"
        timeout: "00:00:25"
        continue_on_timeout: true
      # 第二段氣氛燈提醒（第一輪結束後才閃；announce 內部再呼叫時被去重）
      - action: script.turn_on
        target:
          entity_id: script.mood_alert
        data:
          variables:
            level: emergency
            source: "地震預警"
            test: "{{ test | default(false) }}"
      - action: script.announce
        data:
          level: emergency
          chime: true
          kind: quake
          message: "請就地避難掩護！立即就地趴下、掩護、穩住並抓住桌腳，保護頭頸部。"
      - delay:
          hours: 0
          minutes: 0
          seconds: 25
          milliseconds: 0
      # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
      - action: media_player.volume_set
        data:
          volume_level: 0.4
        target:
          entity_id: media_player.ding_lou_homepod
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
  mode: single
  icon: mdi:earth

# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# ─────────────────────────────────────────────────────────────
# 104-3鐵門判斷未關提醒及作動AI (V4.3.1)
# 相容版本：Helpers V4.0.0（已確認）
# 更新紀錄（統一格式）：
# - V4.3.1（2026-10-28）：取消自動關門（有人車活動、AP 有人、淨空確認未通過）後，交給 script.garage_gate_close_retry 每 10 分鐘重判一次、最多 6 次（約 1 小時），通過就關，最後仍沒關再發緊急通知。
# - V4.3.1（2026-10-28）：10 分鐘提醒後的自動關門前，先呼叫 script.garage_close_safety_check（車庫模型人物偵測＋車燈／煞車燈＋位移＋攝影機＋手機位置）確認淨空；不安全每 30 秒重判、最多 10 次，仍不安全就不關並通知原因。
# - V4.2.2（2026-10-23，修正）：開門時間記錄拆成獨立的 104-3A（只在 open／closed 且非 unavailable 來源時寫入）；10 分鐘提醒的「人車安靜 3 分鐘」條件改用 if＋stop（巢狀 condition 不會中止整個自動化，原本會變成有人車活動也照發）；重啟接手的等待改成鐵門關上就中斷。
# - V4.2.2（2026-10-23）：依 SOP-20 新增開門時間戳記錄（garage_gate_opened_at）與 HA 重啟接手（ha_start）：重啟 1 分鐘後精確計算已開門時間，接續等待剩餘秒數並自動提醒/關門。
# - V4.0.0：「鐵門開啟超過 10 分鐘」通知改為單一緊急級扁平卡片（HA + LINE），附車庫攝影機截圖與鐵門圖示。
# - V4.0.0：外網網址改用 family.kteam.tw（截圖/圖示/轉址頁）。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.3.1：修補版；補齊車庫 Wi-Fi 綜合判斷 helper 依賴，並確認 LINE 通知標題、分級開關、user_id 與 fallback 紀錄符合 SOP-10。
# - V3.3：功能版；自動關門前新增車庫 AP 人員綜合判定，偵測有人時攔截關門並保留逾時提醒；車庫主燈變化排除 unknown/unavailable 抖動，AP 攔截補 LINE 結果通知。
# - V3.2：LINE 通知改為「【智慧保全通知】」分級標題；10 分鐘提醒改為緊急、自動關門結果改為重要；移除技術參數文字（如 automation.tie_men_kai_guan）。
# - V3.1：改以 automation.tie_men_kai_guan 執行關門；修正執行期變數時機；LINE 改用 line_bot_target_user_id + tojson。
# - V3.0：由「08鐵門判斷未關提醒V2」獨立重構；新增 10 分鐘提醒後 2 分鐘關門觀察與自動關門/取消通知。
# ─────────────────────────────────────────────────────────────
- alias: 104-3鐵門判斷未關提醒及作動AI (V4.3.1)
  id: ai_104_3_garage_gate_open_guard_and_autoclose
  description: >
    鐵門開啟達 10 分鐘且車庫無人車活動時先提醒；接續 2 分鐘觀察期，若無人車移動且車庫主燈狀態未改變則自動關門。
    若觀察期內偵測到人/車移動或車庫燈開關變化，會取消本次關門並發送 LINE 與永久通知；若期間已手動關門也會通知。
  mode: single

  triggers:
    - id: timed_10min
      platform: state
      entity_id: cover.garage
      to: "open"
      for:
        minutes: 10
    - id: ha_start
      platform: homeassistant
      event: start

  variables:
    automation_version: "V4.3.1"
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"
    notif_title_important: "【智慧保全通知AI ({{ automation_version }})】重要 Important ⚠️"
    notif_title_emergency: "【智慧保全通知AI ({{ automation_version }})】緊急 Emergency 🚨"
    gate_entity: cover.garage
    person_entity: binary_sensor.che_ku_she_ying_ji_person_detected
    vehicle_entity: binary_sensor.che_ku_she_ying_ji_vehicle_detected
    garage_light_entity: switch.che_ku_zhu_deng
    garage_wifi_presence_entity: binary_sensor.che_ku_wa_fi_gan_ying_zong_he_pan_duan
    line_user_valid: >-
      {{ line_bot_target_user_id|trim|lower not in ['unknown','unavailable','none','null',''] }}
    line_emergency_skip_reason: >-
      {{ 'LINE user_id 無效' if line_bot_target_user_id|trim|lower in ['unknown','unavailable','none','null',''] else '緊急通知開關未開啟' }}
    line_important_skip_reason: >-
      {{ 'LINE user_id 無效' if line_bot_target_user_id|trim|lower in ['unknown','unavailable','none','null',''] else '重要通知開關未開啟' }}

  conditions: []

  actions:
    # 2. HA 重啟接手處理
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('') == 'ha_start' }}"
      then:
        - delay: "00:01:00"
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.garage
                  state: "open"
          then:
            - stop: "鐵門未開啟，重啟接手結束"
        - variables:
            opened_raw: "{{ states('input_datetime.garage_gate_opened_at') }}"
            opened_ts: "{{ as_timestamp(opened_raw, 0) if opened_raw not in ['unknown', 'unavailable', ''] else 0 }}"
            now_ts: "{{ as_timestamp(now()) }}"
            calc_elapsed: "{{ (now_ts - opened_ts) | int if (opened_ts > 0 and now_ts >= opened_ts) else 0 }}"
            remain_sec: "{{ [600 - calc_elapsed, 0] | max }}"
        - if:
            - condition: template
              value_template: "{{ remain_sec > 0 }}"
          then:
            # 等待剩餘時間；期間鐵門關上就提前結束（原本是固定 delay，無法被打斷）
            - wait_for_trigger:
                - platform: state
                  entity_id: cover.garage
                  to: "closed"
              timeout:
                seconds: "{{ remain_sec }}"
              continue_on_timeout: true
        # 等待剩餘時間後，若鐵門已關或有人車活動，則結束
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: cover.garage
                  state: "open"
          then:
            - stop: "鐵門在等待期間已關閉"
        - if:
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.che_ku_she_ying_ji_vehicle_detected
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.che_ku_she_ying_ji_person_detected
                  state: "on"
          then:
            - action: script.turn_on
              target:
                entity_id: script.garage_gate_close_retry
            - stop: "車庫有人車活動，略過本次接手自動提醒"

    # 3. 正常定時 10 分鐘：車庫人車活動要安靜滿 3 分鐘才提醒。
    # 注意：巢狀區塊裡 condition 不成立只會結束該區塊、不會中止整個自動化，所以一定要用 if + stop
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('') == 'timed_10min' }}"
        - condition: not
          conditions:
            - condition: state
              entity_id: binary_sensor.che_ku_she_ying_ji_vehicle_detected
              state: "off"
              for:
                minutes: 3
            - condition: state
              entity_id: binary_sensor.che_ku_she_ying_ji_person_detected
              state: "off"
              for:
                minutes: 3
      then:
        - action: script.turn_on
          target:
            entity_id: script.garage_gate_close_retry
        - stop: "車庫三分鐘內有人車活動，略過鐵門未關提醒"
    - variables:
        light_state_before_window: "{{ states(garage_light_entity) }}"
        event_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    # 車庫攝影機截圖 + 緊急級通知（HA + LINE 扁平卡片，附圖與鐵門圖示）
    - variables:
        live_token: "live{{ range(10000, 99999) | random }}{{ range(10000, 99999) | random }}{{ range(10000, 99999) | random }}"
    - action: script.turn_on
      target:
        entity_id: script.garage_live
      data:
        variables:
          token: "{{ live_token }}"
    - action: script.garage_snapshot
      response_variable: snap
      continue_on_error: true
    - action: script.notify_dispatch
      data:
        level: emergency
        source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
        version: "{{ automation_version | default('', true) }}"
        title: 鐵門狀態提醒
        icon: "https://family.kteam.tw:8126/local/icons/gate.png?v=2"
        image: "{{ snap.url if snap is defined and snap is mapping and snap.url is defined else '' }}"
        link_url: "http://192.168.68.97:8125/local/live.html?t={{ live_token }}&openExternalBrowser=1"
        link_label: 開啟攝影機即時影像
        link_note: 僅限連接家裡 Wi-Fi 時可開啟
        link2_url: "https://family.kteam.tw:8126/local/home.html?openExternalBrowser=1"
        link2_label: 在「家庭」App 查看攝影機
        link2_note: 外出（外網）也可使用
        user_id: "{{ line_bot_target_user_id }}"
        message: |-
          鐵門已開啟超過 10 分鐘

          時間：{{ event_time }}

          自動關門條件（2 分鐘內）：
          無人車移動
          車庫主燈狀態未改變

          ※ 偵測到人車移動，或車庫燈被開關，會取消本次關門。

    # 卡片送出後，錄 8 秒車庫短片並以 LINE 影片訊息跟進（不阻塞後續觀察）
    - action: script.turn_on
      target:
        entity_id: script.garage_video_line
      data:
        variables:
          user_id: "{{ line_bot_target_user_id }}"
          preview: "{{ snap.url if snap is defined and snap is mapping and snap.url is defined else '' }}"
          enabled: "{{ line_user_valid and is_state('input_boolean.notify_line_emergency_enable', 'on') }}"

    - wait_for_trigger:
        - id: person_detected
          platform: state
          entity_id: binary_sensor.che_ku_she_ying_ji_person_detected
          to: "on"
        - id: vehicle_detected
          platform: state
          entity_id: binary_sensor.che_ku_she_ying_ji_vehicle_detected
          to: "on"
        - id: garage_light_changed
          platform: state
          entity_id: switch.che_ku_zhu_deng
          not_to:
            - unknown
            - unavailable
          not_from:
            - unknown
            - unavailable
        - id: garage_wifi_occupied
          platform: state
          entity_id: binary_sensor.che_ku_wa_fi_gan_ying_zong_he_pan_duan
          to: "on"
        - id: gate_closed_early
          platform: state
          entity_id: cover.garage
          to: "closed"
      timeout:
        minutes: 2
      continue_on_timeout: true

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ wait.trigger is not none and wait.trigger.id == 'gate_closed_early' }}"
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_important_enable
                  state: "on"
                - condition: template
                  value_template: "{{ line_user_valid }}"
              then:
                - service: script.send_line_to_user
                  data:
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: >-
                      {% set messages = [
                        {"type":"text","text": notif_title_important},
                        {"type":"text","text":"✅ 鐵門已於 2 分鐘觀察期內提前關閉，已不執行自動關門指令。"},
                        {"type":"text","text":"🚪 狀態：已提前關門"}
                      ] %} {{ messages | tojson }}
              else:
                - service: script.notify_dispatch
                  data:
                    level: important
                    line: false
                    source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                    version: "{{ automation_version | default('', true) }}"
                    title: "鐵門 LINE 未發送（{{ automation_version }}）"
                    message: "重要 LINE 未發送：{{ line_important_skip_reason }}。"
            - service: script.notify_dispatch
              data:
                level: important
                line: false
                source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "鐵門自動關門結果（{{ automation_version }}）"
                message: "鐵門已於觀察期內提前關閉，系統未執行自動關門指令。"

        - conditions:
            - condition: template
              value_template: "{{ wait.trigger is not none and wait.trigger.id in ['person_detected','vehicle_detected','garage_light_changed','garage_wifi_occupied'] }}"
          sequence:
            - variables:
                cancel_reason: >-
                  {% if wait.trigger.id == 'person_detected' %}
                    偵測到人員移動
                  {% elif wait.trigger.id == 'vehicle_detected' %}
                    偵測到車輛移動
                  {% elif wait.trigger.id == 'garage_wifi_occupied' %}
                    偵測到車庫 AP 仍有人員連線
                  {% else %}
                    車庫主燈狀態發生變化（{{ light_state_before_window }} → {{ states(garage_light_entity) }}）
                  {% endif %}
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_important_enable
                  state: "on"
                - condition: template
                  value_template: "{{ line_user_valid }}"
              then:
                - service: script.send_line_to_user
                  data:
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: >-
                      {% set messages = [
                        {"type":"text","text": notif_title_important},
                        {"type":"text","text":"⛔ 已取消本次鐵門自動關閉。\n原因：" ~ cancel_reason ~ "。"},
                        {"type":"text","text":"ℹ️ 若再次符合條件，系統將於下次流程重新評估。"}
                      ] %} {{ messages | tojson }}
              else:
                - service: script.notify_dispatch
                  data:
                    level: important
                    line: false
                    source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                    version: "{{ automation_version | default('', true) }}"
                    title: "鐵門 LINE 未發送（{{ automation_version }}）"
                    message: "重要 LINE 未發送：{{ line_important_skip_reason }}。"
            - service: script.notify_dispatch
              data:
                level: important
                line: false
                source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "鐵門自動關門結果（{{ automation_version }}）"
                message: "已取消本次自動關門。原因：{{ cancel_reason }}。"
            - action: script.turn_on
              target:
                entity_id: script.garage_gate_close_retry

      default:
        - condition: state
          entity_id: cover.garage
          state: "open"
        - if:
            - condition: state
              entity_id: binary_sensor.che_ku_wa_fi_gan_ying_zong_he_pan_duan
              state: "off"
          then:
            # V4.3.1：關門前用車庫模型確認淨空（沒人、車燈／煞車燈沒亮、車沒在動）；不安全每 30 秒重判，最多 10 次，仍不安全就不關
            - repeat:
                sequence:
                  - action: script.garage_close_safety_check
                    response_variable: sf
                  - if: "{{ not (sf is mapping and sf.get('safe') == true) and is_state('cover.garage', 'open') }}"
                    then:
                      - delay: "00:00:30"
                until:
                  - condition: template
                    value_template: "{{ (sf is mapping and sf.get('safe') == true) or not is_state('cover.garage', 'open') or repeat.index >= 10 }}"
            - action: script.garage_close_safety_check
              response_variable: sf2
            - if: "{{ not is_state('cover.garage', 'open') }}"
              then:
                - stop: "鐵門在淨空確認期間已關閉"
            - if: "{{ not (sf2 is mapping and sf2.get('safe') == true) }}"
              then:
                - action: script.notify_dispatch
                  data:
                    level: important
                    line: false
                    source: "104-3鐵門判斷未關提醒及作動AI (V4.3.1)"
                    version: "{{ automation_version | default('', true) }}"
                    title: "鐵門自動關門已取消（{{ automation_version }}）"
                    message: |-
                      已取消自動關門
                      原因：{{ '、'.join(sf2.reasons) if (sf2 is mapping and sf2.get('reasons')) else '無法確認淨空' }}

                      ※ 原本的逾時未關提醒不受影響。
                - action: script.turn_on
                  target:
                    entity_id: script.garage_gate_close_retry
                - stop: "淨空確認未通過，不自動關門"
            - action: automation.trigger
              target:
                entity_id: automation.tie_men_kai_guan
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_important_enable
                  state: "on"
                - condition: template
                  value_template: "{{ line_user_valid }}"
              then:
                - service: script.send_line_to_user
                  data:
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: >-
                      {% set messages = [
                        {"type":"text","text": notif_title_important},
                        {"type":"text","text":"🤖 已執行鐵門自動關閉。\n觀察期內無人車移動、車庫主燈狀態未變化，且車庫 AP 判定無人。"}
                      ] %} {{ messages | tojson }}
              else:
                - service: script.notify_dispatch
                  data:
                    level: important
                    line: false
                    source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                    version: "{{ automation_version | default('', true) }}"
                    title: "鐵門 LINE 未發送（{{ automation_version }}）"
                    message: "重要 LINE 未發送：{{ line_important_skip_reason }}。"
            - service: script.notify_dispatch
              data:
                level: important
                line: false
                source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "鐵門自動關門結果（{{ automation_version }}）"
                message: |-
                  已自動關門
                  觀察期：無人車移動
                  車庫主燈：狀態未變化
                  車庫 AP：判定無人
          else:
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_important_enable
                  state: "on"
                - condition: template
                  value_template: "{{ line_user_valid }}"
              then:
                - service: script.send_line_to_user
                  data:
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: >-
                      {% set messages = [
                        {"type":"text","text": notif_title_important},
                        {"type":"text","text":"⛔ 已取消本次鐵門自動關閉。\n原因：偵測到車庫 AP 仍有人員連線。"},
                        {"type":"text","text":"安全優先：系統未執行關門，原本的逾時未關提醒不受影響。"}
                      ] %} {{ messages | tojson }}
              else:
                - service: script.notify_dispatch
                  data:
                    level: important
                    line: false
                    source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                    version: "{{ automation_version | default('', true) }}"
                    title: "鐵門 LINE 未發送（{{ automation_version }}）"
                    message: "重要 LINE 未發送：{{ line_important_skip_reason }}。"
            - service: script.notify_dispatch
              data:
                level: important
                line: false
                source: "104-3鐵門判斷未關提醒及作動AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "鐵門自動關門已取消（{{ automation_version }}）"
                message: |-
                  已取消自動關門
                  原因：車庫 AP 仍有人員連線

                  ※ 原本的逾時未關提醒不受影響。
            - action: script.turn_on
              target:
                entity_id: script.garage_gate_close_retry

# ─────────────────────────────────────────────────────────────
# 104-3A 鐵門開啟時間記錄（SOP-20：重啟後精算「已開多久」用）
# 獨立成一支 queued 自動化：104-3 是 single 模式，等待期間會丟掉開關門事件；這裡只在「開啟」「關閉」兩個穩定狀態寫入，
# 並排除 unavailable／unknown 來源（重啟時實體恢復不能算成開門或關門）。
# ─────────────────────────────────────────────────────────────
- id: ai_104_3a_gate_open_stamp
  alias: 104-3A鐵門開啟時間記錄AI (V4.2.2)
  description: 鐵門變成開啟時記下時間，變成關閉時清除（1970），給 104-3 重啟接手計算已開門時間
  mode: queued
  max: 5
  triggers:
    - id: opened
      platform: state
      entity_id: cover.garage
      to: "open"
      not_from:
        - unavailable
        - unknown
    - id: closed
      platform: state
      entity_id: cover.garage
      to: "closed"
      not_from:
        - unavailable
        - unknown
  actions:
    - action: input_datetime.set_datetime

# ─────────────────────────────────────────────────────────────
# 104-1車庫鐵門感應燈AI (V4.2.0)
# 相容版本：Helpers V3.24.0（已確認）
# 更新紀錄（統一格式）：
# - V4.2.0（2026-10-18）：修正「手動開燈後立刻被離家情境關掉，卻被當成手動關燈而啟動冷卻」：2026-10-18 16:28 實體開關長按餐廳燈啟動離家情境，約 1 秒後按車庫主燈單擊開燈，情境最後一環又把車庫主燈關掉，
#           104-1B 因為 5 秒內有 Terncy 單擊紀錄就判成手動關燈，啟動 120 秒冷卻，期間攝影機偵測到人、鐵門開啟都不重新開燈。現在離家或晚安情境開啟後 90 秒內的關燈（情境造成的）不算手動關燈、不啟動冷卻。
# - V4.1.5（2026-10-11）：① 修正車庫主燈沒關：本自動化是 restart 模式，樓梯燈被別的自動化（例如 3 分鐘定時關燈）關掉時，「燈具關閉」觸發會重新啟動並中止鐵門關閉後的 5 分鐘關燈倒數，主燈就一直亮著。
#           移除「燈具關閉」觸發，手動關燈冷卻改由新的 104-1B（parallel）處理，不再中斷倒數。② 新增 104-1C：所有人（Kenny／Elay／Jerry／Iris）都不在家（binary_sensor.at_home_nobody_home 持續 1 分鐘）自動關閉車庫主燈與樓梯燈；
#           Jerry 一律只用 iPhone 16 判斷（person.jerry／at_home_jerry 皆只含 device_tracker.iphone_16_jerry，iPad／HomePod／Redmi／iPhone Xr 都不列入）。
#           104-1C 的 HA 通知由 input_boolean.garage_away_off_ha_notify 控制（預設關閉，只關燈不通知）。
# - V4.1.1（2026-10-10）：修正 5 秒內再開燈的等待秒數樣板（單一數值不能用 max 過濾器，改 [x, 0.5] | max）。
# - V4.1.1（2026-10-10）：手動關燈冷卻預設改 120 秒；800-10 雙擊切換車庫燈（自動化發出）也視為手動，會啟動冷卻（標記支援逗號分隔的多個實體）。
# - V3.4.3：功能優化版；
#           1. 修正動態感測實體：全面改用原生 UniFi Protect binary_sensor.g6_instant_motion，棄用 Scrypted 橋接實體。
#           2. 新增車庫主燈 5 秒防重複開啟保護：若車庫主燈剛關閉未滿 5 秒，自動延遲補滿 5 秒後始開燈，避免硬體切換至小燈模式；主燈已開啟時不重複發送指令。
#           3. 完善實體開關/App 手動關燈判定（parent_id is none）與冷卻防呆隔離機制（預設 30 秒）。
#           4. 維持外部手動點燈自動關閉守護與鐵門開啟常亮/關閉後 5 分鐘安全關閉。
# - V3.4.2：修正動態感測實體為 binary_sensor.g6_instant_motion。
# - V3.4.0：重構版；徹底解決車庫主燈與樓梯燈無法自動關閉的死結問題。
# - V3.3：功能版；手動關閉冷卻時間改為讀取 input_number.garage_light_cooldown_sec（可自行調整），預設 30 秒。
# ─────────────────────────────────────────────────────────────
- alias: 104-1車庫鐵門感應燈AI (V4.2.0)
  id: ai_104_1_garage_gate_motion_light
  description: >
    整合鐵門、攝影機事件及手動開關狀態控制車庫主燈與樓梯燈：
    鐵門開啟或偵測到人車移動時開燈；鐵門關閉且無人車移動滿 5 分鐘後自動關閉。
    支援車庫主燈 5 秒防切小燈保護、手動關閉冷卻防呆（預設 30 秒不重啟）及外部手動點燈自動關閉守護。
  mode: restart
  max: 10

  triggers:
    # 1. 鐵門動作觸發
    - id: gate_active
      platform: state
      entity_id: cover.garage
      to:
        - "open"
        - "opening"

    # 2. 人車活動偵測觸發 (開燈與延長倒數)
    - id: motion_detected
      platform: state
      entity_id:
        - binary_sensor.che_ku_she_ying_ji_person_detected
        - binary_sensor.che_ku_she_ying_ji_vehicle_detected
        - binary_sensor.g6_instant_motion
      to: "on"

    # 3. 鐵門關閉事件 (門關上後啟動關燈倒數)
    - id: gate_closed
      platform: state
      entity_id: cover.garage
      to: "closed"

    # 4. 燈具外部/手動開啟 (納入自動關閉守護)
    - id: light_turned_on
      platform: state
      entity_id:
        - switch.che_ku_zhu_deng
        - switch.lou_ti_deng
      to: "on"

    # 5. （V4.1.5 移除）燈具關閉觸發改由 104-1B 處理：此觸發會讓 restart 模式的本自動化重啟，中止關燈倒數，造成主燈沒關

  variables:
    automation_version: "V4.2.0"
    cooldown_sec: "{{ states('input_number.garage_light_cooldown_sec') | int(30) }}"
    is_cooling_down: "{{ not is_state('timer.garage_light_manual_off_cooldown', 'idle') }}"
    # 判斷是否為外部人工操作（實體按鈕或 App 均無 parent_id；自動化產生的動作會有 parent_id）
    # V4.1：Terncy 無線按鈕單擊由 08-9 代為切換（會有 parent_id），先寫入 input_text.terncy_btn_last 標記（可為逗號分隔的多個實體，例如 800-10 雙擊切換兩盞車庫燈），5 秒內視為手動
    is_manual_action: >-
      {% set m = states('input_text.terncy_btn_last').split('|') %}
      {{ trigger.to_state.context.parent_id is none
         or (m | length == 2 and trigger.entity_id in m[0].split(',') and (as_timestamp(now()) - (m[1] | float(0))) < 5) }}

  actions:
    - choose:
        # A. （V4.1.5：已不會觸發，手動關燈冷卻改由 104-1B 處理）燈具關閉事件處理
        - conditions:
            - condition: trigger
              id: light_turned_off
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_manual_action }}"
              then:
                # 實體按鈕或 App 關閉 -> 啟動冷卻防呆 timer
                - service: timer.start
                  target:
                    entity_id: timer.garage_light_manual_off_cooldown
                  data:
                    duration: "{{ '%02d:%02d:%02d' | format(cooldown_sec // 3600, (cooldown_sec % 3600) // 60, cooldown_sec % 60) }}"
            # 無論手動或自動關燈，至此直接終止，避免進入 default 倒數流程
            - stop: "燈具已關閉，終止後續動作"

      default:
        # B. 開燈與自動關閉守護流程
        # 若為感應或開門觸發，先檢驗是否處於手動關閉冷卻中
        - if:
            - condition: trigger
              id:
                - gate_active
                - motion_detected
          then:
            - if:
                - condition: template
                  value_template: "{{ is_cooling_down }}"
              then:
                - stop: "處於手動關閉冷卻期間，不重複自動開燈"
              else:
                # 1. 車庫主燈 5 秒防切換小燈保護：若主燈剛關閉未滿 5 秒，等待補滿 5 秒後始開燈
                - if:
                    - condition: state
                      entity_id: switch.che_ku_zhu_deng
                      state: "off"
                    - condition: template
                      value_template: >-
                        {{ (as_timestamp(now()) - as_timestamp(states.switch.che_ku_zhu_deng.last_changed, 0)) < 5 }}
                  then:
                    - delay:
                        seconds: >-
                          {{ [((5.1 - (as_timestamp(now()) - as_timestamp(states.switch.che_ku_zhu_deng.last_changed, 0))) | round(1, 'ceil')), 0.5] | max }}

                # 2. 開啟車庫主燈（若尚未開啟）
                - if:
                    - condition: state
                      entity_id: switch.che_ku_zhu_deng
                      state: "off"
                  then:
                    - service: switch.turn_on
                      target:
                        entity_id: switch.che_ku_zhu_deng

                # 3. 開啟樓梯燈（若尚未開啟）
                - if:
                    - condition: state
                      entity_id: switch.lou_ti_deng
                      state: "off"
                  then:
                    - service: switch.turn_on
                      target:
                        entity_id: switch.lou_ti_deng

        # C. 自動關閉序列（Auto-Off Sequence）
        # 1. 若鐵門未關閉，持續等待直到鐵門關閉（最多等待 45 分鐘）
        - if:
            - condition: template
              value_template: "{{ states('cover.garage') != 'closed' }}"
          then:
            - wait_for_trigger:
                - platform: state
                  entity_id: cover.garage
                  to: "closed"
              timeout: "00:45:00"
              continue_on_timeout: true

        # 2. 鐵門確認關閉後始進行 5 分鐘無人車活動倒數
        # （等待期間若有新人車移動或開門，因為 mode: restart 會重置本計時）
        - condition: state
          entity_id: cover.garage
          state: "closed"

        - delay: "00:05:00"

        # 3. 5 分鐘倒數結束前進行最終安全檢核
        - condition: state
          entity_id: cover.garage
          state: "closed"

        - condition: template
          value_template: >-
            {{ states('binary_sensor.che_ku_she_ying_ji_person_detected') != 'on' and
               states('binary_sensor.che_ku_she_ying_ji_vehicle_detected') != 'on' and
               states('binary_sensor.g6_instant_motion') != 'on' }}

        # 4. 關閉車庫主燈與樓梯燈
        - service: switch.turn_off
          target:
            entity_id:
              - switch.che_ku_zhu_deng
              - switch.lou_ti_deng

# ─────────────────────────────────────────────────────────────
# 104-1B 手動關燈冷卻（V4.1.5 從 104-1 拆出，parallel 模式，不會中斷 104-1 的關燈倒數）
# ─────────────────────────────────────────────────────────────
- alias: 104-1B車庫燈手動關閉冷卻AI (V4.2.0)
  id: ai_104_1b_garage_manual_off_cooldown
  description: 車庫主燈或樓梯燈被人工關閉（實體按鈕／App／Terncy 單擊）時啟動冷卻，冷卻期間 104-1 不自動重新開燈
  mode: parallel
  max: 10
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - switch.che_ku_zhu_deng
        - switch.lou_ti_deng
      to: "off"
  variables:
    automation_version: "V4.2.0"
    cooldown_sec: "{{ states('input_number.garage_light_cooldown_sec') | int(30) }}"
    is_manual_action: >-
      {% set m = states('input_text.terncy_btn_last').split('|') %}
      {{ trigger.to_state.context.parent_id is none
         or (m | length == 2 and trigger.entity_id in m[0].split(',') and (as_timestamp(now()) - (m[1] | float(0))) < 5) }}
    # V4.2.0：離家／晚安情境開啟後 90 秒內的關燈是情境逐環關閉造成的，不是人工關燈
    scene_recent: >-
      {% set now_ts = as_timestamp(now()) %}
      {{ [states.input_boolean.aqara_li_jia, states.input_boolean.aqara_wan_an]
         | selectattr('state', 'eq', 'on') | map(attribute='last_changed') | map('as_timestamp')
         | select('ge', now_ts - 90) | list | count > 0 }}
  conditions:
    - condition: template
      value_template: "{{ is_manual_action and not scene_recent }}"
  actions:
    - action: timer.start
      target:
        entity_id: timer.garage_light_manual_off_cooldown
      data:
        duration: "{{ '%02d:%02d:%02d' | format(cooldown_sec // 3600, (cooldown_sec % 3600) // 60, cooldown_sec % 60) }}"

# ─────────────────────────────────────────────────────────────
# 104-1C 全員離家關閉車庫燈（V4.1.5 新增）
# 判斷來源 binary_sensor.at_home_nobody_home：Kenny／Elay／Jerry／Iris 都不在家；Jerry 只看 iPhone 16。
# ─────────────────────────────────────────────────────────────
- alias: 104-1C全員離家關閉車庫燈AI (V4.2.0)
  id: ai_104_1c_garage_all_away_off
  description: 所有人都不在家（持續 1 分鐘，避免追蹤器抖動）時，自動關閉車庫主燈與車庫樓梯燈；Jerry 只用 iPhone 判斷
  mode: single
  variables:
    automation_version: "V4.2.0"
  triggers:
    - trigger: state
      id: all_away
      entity_id: binary_sensor.at_home_nobody_home
      to: "on"
      for: "00:01:00"
    - trigger: homeassistant
      id: ha_start
      event: start
  conditions: []
  actions:
    - if: "{{ trigger.id == 'ha_start' }}"
      then:
        - delay: "00:02:00"
    - condition: state
      entity_id: binary_sensor.at_home_nobody_home
      state: "on"
    - if: "{{ is_state('switch.che_ku_zhu_deng', 'on') or is_state('switch.lou_ti_deng', 'on') }}"
      then:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.che_ku_zhu_deng
              - switch.lou_ti_deng
        # 通知預設關閉：要看到請在自動化管理面板打開「104-1C全員離家關燈_HA通知」
        - if: "{{ is_state('input_boolean.garage_away_off_ha_notify', 'on') }}"
          then:
            - action: script.notify_dispatch
              data:
                level: info
                line: false
                source: "104-1C全員離家關閉車庫燈AI (V4.2.0)"
                version: "{{ automation_version }}"
                title: 全員離家，已關閉車庫燈
                message: "所有人都不在家，已自動關閉車庫主燈與車庫樓梯燈。"


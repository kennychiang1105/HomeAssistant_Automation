- id: ai_800_14d_si_lou_stairs_timed_off
  alias: 800-開關系列-14D 四樓樓梯燈（四樓開關下1單擊）-定時3分鐘關燈、雙擊常開AI (V4.1.3)
  description: >
    單擊（或客廳主開關下1 雙擊）後 3 分鐘自動關燈；雙擊同一顆按鈕＝常開（開燈、不自動關）。9A 常開、9B 全開一段時間執行中時不關（原本功能優先）。
    倒數中再單擊把燈關掉會取消倒數；倒數中又開燈則重新計時。
  mode: restart
  max_exceeded: silent
  variables:
    light: light.yeelink_color5_0fb7_light
    off_delay: "00:03:00"
    # 事件發生當下（燈泡回報較慢，尚未被切換）的燈狀態
    was_on: "{{ is_state(light, 'on') }}"
  triggers:
    - id: bulb_toggle
      alias: "[按鈕] 四樓開關下1 單擊"
      trigger: state
      entity_id: event.si_lou_lou_ti_deng_single_press
    - id: double_keep
      alias: "[按鈕] 四樓開關下1 雙擊（常開）"
      trigger: state
      entity_id: event.si_lou_lou_ti_deng_double_press
    - id: light_off
      alias: "[燈泡] 四樓樓梯燈關閉（清除常開旗標）"
      trigger: state
      entity_id: light.yeelink_color5_0fb7_light
      to: "off"
      not_from:
        - unavailable
        - unknown
  conditions:
    - alias: "事件是剛發生的 (5 秒內)，避免重啟還原舊事件（燈泡關閉的觸發不用檢查）"
      condition: template
      value_template: >-
        {{ trigger.id == 'light_off'
           or (trigger.to_state is not none
               and trigger.to_state.state not in ['unavailable', 'unknown']
               and (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) < 5) }}
  actions:
    - choose:
        - alias: "燈泡（由 12D 切換）：事件當下燈是亮的＝這次是關燈，取消倒數"
          conditions: "{{ trigger.id == 'bulb_toggle' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ was_on }}"
              then:
                - stop: "這次單擊是關燈，取消倒數"
        - alias: "雙擊：常開（開燈、取消倒數、不自動關；再單擊關燈）"
          conditions: "{{ trigger.id == 'double_keep' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not was_on }}"
              then:
                - action: light.turn_on
                  target:
                    entity_id: "{{ light }}"
            - wait_template: "{{ is_state(light, 'on') }}"
              timeout: "00:00:20"
              continue_on_timeout: true
            - if:
                - condition: state
                  entity_id: input_boolean.topfloor_stairs_keep_on
                  state: "off"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id:
                      - input_boolean.topfloor_stairs_keep_on
                      - input_boolean.stairs_si_lou_hold
            - stop: "雙擊常開，不自動關燈"
        - alias: "四樓樓梯燈關了：若常開旗標是雙擊打開的，一併清除"
          conditions: "{{ trigger.id == 'light_off' }}"
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.stairs_si_lou_hold
                  state: "on"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.topfloor_stairs_keep_on
                      - input_boolean.stairs_si_lou_hold
            - stop: "四樓樓梯燈已關，結束"
    - alias: "倒數 3 分鐘"
      delay: "{{ off_delay }}"
    - alias: "時間到：原本功能優先（9A 常開、9B 全開一段時間執行中就不關）；仍亮著才關"
      if:
        - condition: state
          entity_id: input_boolean.topfloor_stairs_keep_on
          state: "off"
        - condition: template
          alias: "9B 樓梯間燈全開一段時間：沒有在執行"
          value_template: "{{ (state_attr('automation.automation_41', 'current') | int(0)) == 0 }}"
        - condition: template
          value_template: "{{ is_state(light, 'on') }}"
      then:
        - alias: "頂樓感應正在使用梯廳燈 → 四樓樓梯燈交給頂樓感應，跟頂樓樓梯燈一起關；否則照常關"
          choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.topfloor_13b8_auto
                  state: "on"
                - condition: state
                  entity_id: light.yeelink_color5_13b8_light
                  state: "on"
              sequence:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.topfloor_0fb7_auto
          default:
            - action: light.turn_off
              target:
                entity_id: "{{ light }}"

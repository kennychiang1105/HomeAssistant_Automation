# ─────────────────────────────────────────────────────────────
# 107Tesla充電器狀態與通知AI (V3.2.4)
# 相容版本：Helpers V3.18.0（已確認）
# 更新紀錄（統一格式）：
# - V3.2.4：修補版。移除不存在的 sensor.tesla_wall_connector_power，改以 sensor.tesla_wall_connector_total_power 上升判斷本次插槍已有充電；拔槍時重置旗標讓同日第二車可再通知。
# - V3.2.3：修補版。新增拔槍/功率低於 1W 且連線狀態變更時重置當日完成旗標，支援同日多車連續充電完成通知。
# - V3.2.2：修補版。充電完成通知在用電量上方新增充電用時（X時X分鐘），LINE 一般通知維持 script.send_line_to_user 與分級/額外開關/user_id 防呆。
# - V3.2.1：修補版。插槍後若直接進入 charging/charging_reduced，不再由 charge_done 重設當次已充電記憶；同步補齊 LINE 發送 user_id 防呆與未發送原因紀錄，符合 SOP-10。
# - V3.2.0：修補版。新增當次插槍已充電記憶 helper，修復充飽後狀態退回等待/準備時未發完成通知與午夜/6小時未充電誤報；狀態屬性更新不再觸發流程。
# - V3.1.4：修補版。修復充電狀態因為 unknown 而導致的多次重複開始通知與完成時間錯誤；移除冗餘的額外系統通知，使 HA 通知與 LINE 通知數量與資訊保持一致。
# - V3.1.3：修補版。開始通知改為「任何非 charging/charging_reduced 狀態進入充電」皆觸發；統一所有 LINE 重要通知格式（含版本標題），並新增充電樁通知測試按鈕。
# - V3.1.2：修補版。修正觸發條件只保留 idle→charging/charging_reduced 的開始通知與 charging*→not_connected/charging_finished 的完成通知；移除 Tesla/Luxgen 互轉觸發並修正 6 小時未充電誤報。
# - V3.1.1：修補版。修正開始/完成通知觸發邏輯，新增 charging_reduced↔charging 互轉完成通知；6 小時未充電提醒僅在待充狀態且無充電能量時觸發，避免誤報。
# - V3.1.0：功能版。Tesla/Luxgen 通知格式統一為多則訊息（含版本號、換行與 emoji），補上 kWh（度）單位，並統一 LINE 發送方式與 100B 一致。
# - V3.0.5：修補版。00:02 未充電提醒改為僅在「準備充電/等待汽車」狀態通知；若為充電完成狀態則不通知。
# - V3.0.4：修補版。修正 session_energy 不會即時歸零問題，00:02 改以「今日 00:00 後是否有充電能量更新」判斷是否已有充電紀錄。
# - V3.0.3：修補版。恢復 00:02 未充電提醒，但僅在當次尚無充電完成紀錄（session_energy=0）時通知，避免充電完成後誤報。
# - V3.0.2：修補版。移除 00:02 未充電提醒避免「充電完成後插槍」誤報；新增 booting/ready/negotiating/error 未充電狀態，其中 error 立即發送重要通知。
# - V3.0.1：修補版。充電完成但用電量為 0 時不通知；LINE 改走 script.send_line_to_user（Messaging API）避免 notify_line 失敗中斷。
# - V3.0：功能版。新增 Tesla/Luxgen 充電狀態 HomeKit helper 與開始/完成/未充通知（系統+LINE 分級）。
# ─────────────────────────────────────────────────────────────

- alias: 107Tesla充電器狀態與通知AI (V3.2.4)
  id: ai_107_tesla_charger_status_notify
  description: >-
    Tesla 充電樁狀態映射（含 Luxgen/Tesla 充電判斷）與通知。
    相容版本：Helpers V3.18.0（已確認）。
  mode: queued
  max: 20
  variables:
    automation_version: "V3.2.4"
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"
    line_title_general: "【家用充電器系統AI ({{ automation_version }})】\n一般 General 🪧"
    line_title_important: "【家用充電器系統AI ({{ automation_version }})】\n重要 Important ⚠️"

  trigger:
    - platform: state
      entity_id: sensor.tesla_wall_connector_status
      to:
        - "充電中"
        - "charging"
        - "Charging"
      id: charge_start_tesla

    - platform: state
      entity_id: sensor.tesla_wall_connector_status
      to:
        - "充電（降壓）"
        - "charging_reduced"
        - "Charging (reduced)"
      id: charge_start_luxgen

    # 充電完成需捕捉「充飽後退回等待/準備」與「拔槍」兩種軌跡，
    # 因此不限制 from/to，改在 action 依 from_state/to_state 精準判斷。
    - platform: state
      entity_id: sensor.tesla_wall_connector_status
      id: charge_done

    - platform: time
      at: "00:02:00"
      id: midnight_not_started

    - platform: state
      entity_id: sensor.tesla_wall_connector_status
      to:
        - "等待汽車"
        - "準備充電"
        - "waiting_car"
        - "Waiting for car"
        - "ready"
        - "Ready to charge"
        - "connected"
        - "Vehicle connected"
        - "negotiating"
        - "Negotiating connection"
        - "booting"
        - "Booting"
        - "error"
        - "Error"
      for: "06:00:00"
      id: prep_too_long

    - platform: state
      entity_id: sensor.tesla_wall_connector_status
      to:
        - "error"
        - "Error"
      id: error_state

    - platform: state
      entity_id: binary_sensor.tesla_wall_connector_vehicle_connected
      to: "on"
      for: "06:00:00"
      id: vehicle_connected_too_long

    - platform: state
      entity_id: binary_sensor.tesla_wall_connector_vehicle_connected
      to: "off"
      id: vehicle_disconnected_reset

    - platform: state
      entity_id: sensor.tesla_wall_connector_total_power
      id: total_power_rising

    - platform: state
      entity_id: input_button.tesla_charger_notify_test
      id: notify_test_button

  condition:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not defined or trigger.to_state is not defined or
           trigger.from_state is none or trigger.to_state is none or
           trigger.from_state.state != trigger.to_state.state }}

  action:
    - variables:
        charger_status: "{{ states('sensor.tesla_wall_connector_status') }}"
        status_for_vehicle: >-
          {% set now_st = states('sensor.tesla_wall_connector_status') | string | lower | trim %}
          {% if trigger.id == 'charge_done' and trigger.from_state is defined and trigger.from_state is not none %}
            {{ trigger.from_state.state | string | lower | trim }}
          {% else %}
            {{ now_st }}
          {% endif %}
        vehicle_name: >-
          {% set st = status_for_vehicle %}
          {% if st in ['charging_reduced', 'charging (reduced)', '充電（降壓）'] %}
            Luxgen
          {% elif st in ['charging', '充電中'] %}
            Tesla
          {% else %}
            車輛
          {% endif %}
        start_time: >-
          {% if trigger.id == 'charge_done' %}
            {{ states('input_datetime.tesla_charger_start_time') }}
          {% else %}
            {% set s_obj = states.sensor.tesla_wall_connector_status %}
            {% set ts = s_obj.last_changed if s_obj is not none else none %}
            {{ ts.strftime('%Y-%m-%d %H:%M:%S') if ts is not none else '未知' }}
          {% endif %}
        now_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        charge_duration_text: >-
          {% set start_ts = as_timestamp(states('input_datetime.tesla_charger_start_time'), none) %}
          {% set end_ts = as_timestamp(now(), none) %}
          {% if start_ts is none or end_ts is none or end_ts < start_ts %}
            未知
          {% else %}
            {% set total_minutes = ((end_ts - start_ts) / 60) | int(0) %}
            {{ (total_minutes // 60) ~ '時' ~ (total_minutes % 60) ~ '分鐘' }}
          {% endif %}
        handle_temp: "{{ states('sensor.tesla_wall_connector_handle_temperature') }}"
        mcu_temp: "{{ states('sensor.tesla_wall_connector_mcu_temperature') }}"
        pcb_temp: "{{ states('sensor.tesla_wall_connector_pcb_temperature') }}"
        session_energy: "{{ states('sensor.tesla_wall_connector_session_energy')|float(0)|round(2) }}"
        total_power_now: "{{ states('sensor.tesla_wall_connector_total_power')|float(0) }}"
        total_power_delta: >-
          {% if trigger.id == 'total_power_rising' and trigger.from_state is defined and trigger.to_state is defined and trigger.from_state is not none and trigger.to_state is not none %}
            {{ (trigger.to_state.state|float(0)) - (trigger.from_state.state|float(0)) }}
          {% else %}
            0
          {% endif %}
        from_status_normalized: >-
          {{ trigger.from_state.state | string | lower | trim if trigger.from_state is defined and trigger.from_state is not none else '' }}
        to_status_normalized: >-
          {{ trigger.to_state.state | string | lower | trim if trigger.to_state is defined and trigger.to_state is not none else '' }}
        charging_states:
          - "充電中"
          - "charging"
          - "充電（降壓）"
          - "charging_reduced"
          - "charging (reduced)"
        disconnected_states:
          - "車輛未連接"
          - "not_connected"
          - "vehicle not connected"
          - "charging_finished"
          - "charging finished"
        connected_wait_states:
          - "等待汽車"
          - "準備充電"
          - "waiting_car"
          - "waiting for car"
          - "ready"
          - "ready to charge"
          - "connected"
          - "vehicle connected"
        pending_states:
          - "等待汽車"
          - "準備充電"
          - "waiting_car"
          - "waiting for car"
          - "ready"
          - "ready to charge"
          - "connected"
          - "vehicle connected"
          - "negotiating"
          - "negotiating connection"
          - "booting"
          - "error"

    - choose:
        - conditions:
            - condition: trigger
              id: vehicle_disconnected_reset
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.tesla_charger_session_charged

        - conditions:
            - condition: trigger
              id: total_power_rising
            - condition: state
              entity_id: binary_sensor.tesla_wall_connector_vehicle_connected
              state: "on"
            - condition: template
              value_template: "{{ total_power_delta | float(0) > 0 }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.tesla_charger_session_charged

    - choose:
        - conditions:
            - condition: trigger
              id: charge_done
            - condition: template
              value_template: >-
                {{ from_status_normalized in disconnected_states and
                   to_status_normalized not in disconnected_states and
                   to_status_normalized not in charging_states }}
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.tesla_charger_session_charged

    - choose:
        - conditions:
            - condition: trigger
              id:
                - charge_start_luxgen
                - charge_start_tesla
            - condition: template
              value_template: >-
                {{ trigger.from_state is defined and trigger.from_state is not none and
                   from_status_normalized not in (['unknown', 'unavailable', 'none'] + charging_states) }}
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.tesla_charger_session_charged
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tesla_charger_start_time
              data:
                datetime: "{{ now_time }}"
            - service: persistent_notification.create
              data:
                title: "【Tesla充電器】一般 General 🪧"
                message: >-
                  {{ vehicle_name }} 開始充電（{{ now_time }}）。
                  手把溫度 {{ handle_temp }}°C、MCU 溫度 {{ mcu_temp }}°C、PCB 溫度 {{ pcb_temp }}°C。
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.notify_line_general_enable
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.notify_tesla_charge_extra_line_enable
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ line_bot_target_user_id | string | lower | trim not in ['', 'unknown', 'unavailable', 'none'] }}
                  sequence:
                    - service: script.send_line_to_user
                      data:
                        user_id: "{{ line_bot_target_user_id }}"
                        payload: >-
                          {{ [
                              {'type':'text','text':line_title_general},
                              {'type':'text','text': '🪫 開始充電通知⚡\n充電車輛 ' ~ vehicle_name ~ '\n開始時間 ' ~ now_time},
                              {'type':'text','text': '其他資訊：\n手把溫度 ' ~ handle_temp ~ '°C\nMCU溫度 ' ~ mcu_temp ~ '°C\nPCB溫度 ' ~ pcb_temp ~ '°C'}
                            ] | tojson }}
              default:
                - service: persistent_notification.create
                  data:
                    title: "【Tesla充電器】LINE 未發送"
                    message: >-
                      LINE 未發送：user_id 無效，或必要通知開關未開啟。
                      user_id={{ line_bot_target_user_id }}、一般={{ states('input_boolean.notify_line_general_enable') }}、重要={{ states('input_boolean.notify_line_important_enable') }}、Tesla額外={{ states('input_boolean.notify_tesla_charge_extra_line_enable') }}。

        - conditions:
            - condition: trigger
              id: charge_done
            - condition: state
              entity_id: input_boolean.tesla_charger_session_charged
              state: "on"
            - condition: template
              value_template: >-
                {{ (session_energy | float(0)) > 0 and
                   from_status_normalized in charging_states and
                   (to_status_normalized in disconnected_states or
                    to_status_normalized in connected_wait_states) }}
          sequence:
            - service: persistent_notification.create
              data:
                title: "【Tesla充電器】一般 General 🪧"
                message: >-
                  {{ vehicle_name }} 充電完成。
                  開始時間 {{ start_time }}，結束時間 {{ now_time }}。
                  充電用時 {{ charge_duration_text }}。
                  用電量 {{ session_energy }} kWh（度）。
                  手把 {{ handle_temp }}°C、MCU {{ mcu_temp }}°C、PCB {{ pcb_temp }}°C。
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.notify_line_general_enable
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.notify_tesla_charge_extra_line_enable
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ line_bot_target_user_id | string | lower | trim not in ['', 'unknown', 'unavailable', 'none'] }}
                  sequence:
                    - service: script.send_line_to_user
                      data:
                        user_id: "{{ line_bot_target_user_id }}"
                        payload: >-
                          {{ [
                              {'type':'text','text':line_title_general},
                              {'type':'text','text': '🔋 充電完成通知 ✅\n充電車輛 ' ~ vehicle_name ~ '\n開始時間 ' ~ start_time ~ '\n結束時間 ' ~ now_time ~ '\n充電用時 ' ~ charge_duration_text ~ '\n用電量 ' ~ session_energy ~ ' kWh（度）'},
                              {'type':'text','text': '其他資訊：\n手把溫度 ' ~ handle_temp ~ '°C\nMCU溫度 ' ~ mcu_temp ~ '°C\nPCB溫度 ' ~ pcb_temp ~ '°C'}
                            ] | tojson }}
              default:
                - service: persistent_notification.create
                  data:
                    title: "【Tesla充電器】LINE 未發送"
                    message: >-
                      LINE 未發送：user_id 無效，或必要通知開關未開啟。
                      user_id={{ line_bot_target_user_id }}、一般={{ states('input_boolean.notify_line_general_enable') }}、重要={{ states('input_boolean.notify_line_important_enable') }}、Tesla額外={{ states('input_boolean.notify_tesla_charge_extra_line_enable') }}。



        - conditions:
            - condition: trigger
              id: midnight_not_started
            - condition: state
              entity_id: input_boolean.tesla_charger_session_charged
              state: "off"
            - condition: template
              value_template: >-
                {{ charger_status | string | lower | trim in pending_states }}
          sequence:
            - service: persistent_notification.create
              data:
                title: "【Tesla充電器】重要 Important ⚠️"
                message: >-
                  {{ now_time }} 仍未開始充電，請檢查車輛狀況（目前狀態：{{ charger_status }}）。
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.notify_line_important_enable
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ line_bot_target_user_id | string | lower | trim not in ['', 'unknown', 'unavailable', 'none'] }}
                  sequence:
                    - service: script.send_line_to_user
                      data:
                        user_id: "{{ line_bot_target_user_id }}"
                        payload: >-
                          {{ [
                              {'type':'text','text':line_title_important},
                              {'type':'text','text':'目前仍未開始充電，請檢查車輛狀況。'},
                              {'type':'text','text':'補充資訊：\n目前狀態 ' ~ charger_status ~ '\n通知時間 ' ~ now_time}
                            ] | tojson }}
              default:
                - service: persistent_notification.create
                  data:
                    title: "【Tesla充電器】LINE 未發送"
                    message: >-
                      LINE 未發送：user_id 無效，或必要通知開關未開啟。
                      user_id={{ line_bot_target_user_id }}、一般={{ states('input_boolean.notify_line_general_enable') }}、重要={{ states('input_boolean.notify_line_important_enable') }}、Tesla額外={{ states('input_boolean.notify_tesla_charge_extra_line_enable') }}。

        - conditions:
            - condition: trigger
              id: error_state
          sequence:
            - service: persistent_notification.create
              data:
                title: "【Tesla充電器】重要 Important ⚠️"
                message: >-
                  Tesla 充電器狀態異常（error），請儘速檢查設備與供電連線。
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.notify_line_important_enable
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ line_bot_target_user_id | string | lower | trim not in ['', 'unknown', 'unavailable', 'none'] }}
                  sequence:
                    - service: script.send_line_to_user
                      data:
                        user_id: "{{ line_bot_target_user_id }}"
                        payload: >-
                          {{ [
                              {'type':'text','text':line_title_important},
                              {'type':'text','text':'Tesla 充電器狀態異常（error），請儘速檢查設備與供電連線。'},
                              {'type':'text','text':'補充資訊：\n目前狀態 ' ~ charger_status ~ '\n通知時間 ' ~ now_time}
                            ] | tojson }}
              default:
                - service: persistent_notification.create
                  data:
                    title: "【Tesla充電器】LINE 未發送"
                    message: >-
                      LINE 未發送：user_id 無效，或必要通知開關未開啟。
                      user_id={{ line_bot_target_user_id }}、一般={{ states('input_boolean.notify_line_general_enable') }}、重要={{ states('input_boolean.notify_line_important_enable') }}、Tesla額外={{ states('input_boolean.notify_tesla_charge_extra_line_enable') }}。

        - conditions:
            - condition: trigger
              id:
                - prep_too_long
                - vehicle_connected_too_long
            - condition: state
              entity_id: input_boolean.tesla_charger_session_charged
              state: "off"
            - condition: template
              value_template: >-
                {{ charger_status | string | lower | trim in pending_states }}
          sequence:
            - service: persistent_notification.create
              data:
                title: "【Tesla充電器】重要 Important ⚠️"
                message: >-
                  已連接超過 6 小時仍未開始充電，請檢查車輛狀況（目前狀態：{{ charger_status }}）。
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.notify_line_important_enable
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ line_bot_target_user_id | string | lower | trim not in ['', 'unknown', 'unavailable', 'none'] }}
                  sequence:
                    - service: script.send_line_to_user
                      data:
                        user_id: "{{ line_bot_target_user_id }}"
                        payload: >-
                          {{ [
                              {'type':'text','text':line_title_important},
                              {'type':'text','text':'已連接超過 6 小時仍未開始充電，請檢查車輛狀況。'},
                              {'type':'text','text':'補充資訊：\n目前狀態 ' ~ charger_status ~ '\n通知時間 ' ~ now_time}
                            ] | tojson }}
              default:
                - service: persistent_notification.create
                  data:
                    title: "【Tesla充電器】LINE 未發送"
                    message: >-
                      LINE 未發送：user_id 無效，或必要通知開關未開啟。
                      user_id={{ line_bot_target_user_id }}、一般={{ states('input_boolean.notify_line_general_enable') }}、重要={{ states('input_boolean.notify_line_important_enable') }}、Tesla額外={{ states('input_boolean.notify_tesla_charge_extra_line_enable') }}。

        - conditions:
            - condition: trigger
              id: notify_test_button
          sequence:
            - service: persistent_notification.create
              data:
                title: "【Tesla充電器】一般 General 🪧"
                message: >-
                  這是充電樁通知測試訊息（{{ now_time }}）。
                  目前判定車輛 {{ vehicle_name }}，狀態 {{ charger_status }}。
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.notify_line_general_enable
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.notify_tesla_charge_extra_line_enable
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ line_bot_target_user_id | string | lower | trim not in ['', 'unknown', 'unavailable', 'none'] }}
                  sequence:
                    - service: script.send_line_to_user
                      data:
                        user_id: "{{ line_bot_target_user_id }}"
                        payload: >-
                          {{ [
                              {'type':'text','text':line_title_general},
                              {'type':'text','text': '🧪 充電通知測試訊息\n充電車輛 ' ~ vehicle_name ~ '\n測試時間 ' ~ now_time},
                              {'type':'text','text': '其他資訊：\n目前狀態 ' ~ charger_status ~ '\n手把溫度 ' ~ handle_temp ~ '°C\nMCU溫度 ' ~ mcu_temp ~ '°C\nPCB溫度 ' ~ pcb_temp ~ '°C'}
                            ] | tojson }}
              default:
                - service: persistent_notification.create
                  data:
                    title: "【Tesla充電器】LINE 未發送"
                    message: >-
                      LINE 未發送：user_id 無效，或必要通知開關未開啟。
                      user_id={{ line_bot_target_user_id }}、一般={{ states('input_boolean.notify_line_general_enable') }}、重要={{ states('input_boolean.notify_line_important_enable') }}、Tesla額外={{ states('input_boolean.notify_tesla_charge_extra_line_enable') }}。
      default: []

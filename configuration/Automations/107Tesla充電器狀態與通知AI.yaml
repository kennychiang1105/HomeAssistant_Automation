# ── 107B：記下「充電槍插上」的時間（重啟不會被重設；107 用它判斷這次連接是否已充過電） ──
- alias: 107B充電槍插上時間記錄AI (V4.2.5)
  id: ai_107b_charger_connected_mark
  description: 插槍（vehicle_connected 由 off 變 on）時記下時間到 input_datetime.tesla_charger_connected_at。
  mode: queued
  triggers:
    - trigger: state
      entity_id: binary_sensor.tesla_wall_connector_vehicle_connected
      from: "off"
      to: "on"
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tesla_charger_connected_at
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

# ── 107C：鎖定「現在是哪輛車在充電」（Tesla 約 24.7 A、Luxgen 約 31.3 A；45 天歷史 26～28 A 沒有重疊） ──
#   電流 ≥28 A → Luxgen 並標記已確認；尚未確認且落在 23～26 A 平台 → Tesla 並標記已確認；爬升中還不能確認時先用狀態先驗
#   （charging＝100% Tesla、charging_reduced＝80% Luxgen）；確認後尾端降載電流掉到中間值也不改判；離開充電狀態就清掉。
- alias: 107C充電車輛鎖定AI (V4.2.5)
  id: ai_107c_charging_vehicle_latch
  description: 依充電樁狀態與車輛電流鎖定充電中的車（input_select.garage_vehicle_latch），供 HomeKit 充電 helper、107 通知、3D 使用。
  mode: queued
  max: 10
  variables:
    st: "{{ states('sensor.tesla_wall_connector_status') }}"
    a: "{{ states('sensor.che_ku_tesla_wall_connector_vehicle_current') | float(0) }}"
    charging: "{{ st in ['charging', 'charging_reduced'] }}"
    cur: "{{ states('input_select.garage_vehicle_latch') }}"
    confirmed: "{{ is_state('input_boolean.garage_vehicle_confirmed', 'on') }}"
  triggers:
    - trigger: state
      entity_id:
        - sensor.tesla_wall_connector_status
        - sensor.che_ku_tesla_wall_connector_vehicle_current
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions: "{{ not charging }}"
          sequence:
            - if: "{{ cur != 'none' }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.garage_vehicle_latch
                  data:
                    option: none
            - if: "{{ confirmed }}"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.garage_vehicle_confirmed
        - conditions: "{{ a >= 28 }}"
          sequence:
            - if: "{{ cur != 'luxgen_n7' }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.garage_vehicle_latch
                  data:
                    option: luxgen_n7
            - if: "{{ states('input_select.garage_vehicle_last') != 'luxgen_n7' }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.garage_vehicle_last
                  data:
                    option: luxgen_n7
            - if: "{{ not confirmed }}"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.garage_vehicle_confirmed
        - conditions: "{{ (not confirmed) and 23 <= a <= 26 }}"
          sequence:
            - if: "{{ cur != 'tesla_model3' }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.garage_vehicle_latch
                  data:
                    option: tesla_model3
            - if: "{{ states('input_select.garage_vehicle_last') != 'tesla_model3' }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.garage_vehicle_last
                  data:
                    option: tesla_model3
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.garage_vehicle_confirmed
        - conditions: "{{ cur == 'none' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.garage_vehicle_latch
              data:
                option: "{{ 'luxgen_n7' if st == 'charging_reduced' else 'tesla_model3' }}"
            - action: input_select.select_option
              target:
                entity_id: input_select.garage_vehicle_last
              data:
                option: "{{ 'luxgen_n7' if st == 'charging_reduced' else 'tesla_model3' }}"

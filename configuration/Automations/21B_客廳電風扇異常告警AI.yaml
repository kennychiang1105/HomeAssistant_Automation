# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# ─────────────────────────────────────────────────────────────
# 21B_客廳電風扇異常告警AI (V4.0.0)
# 相容版本：Helpers V3.9（已確認）
# 更新紀錄（統一格式）：
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.0：統一命名規範、欄位標準化與通知標題版本同步。
# - V3.1：移除已下線 TV remote 裝置依賴，避免 Unknown entity 導致設定失敗。
# ─────────────────────────────────────────────────────────────
- alias: 21B_客廳電風扇異常告警AI (V4.0.0)
  id: ai_living_room_fan_anomaly_alert
  description: "當風扇在自動模式下離線或關閉時發出警報"
  mode: single

  variables:
    automation_version: "V4.0.0"
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"

  triggers:
    - platform: state
      entity_id: fan.ke_ting_dian_feng_shan
      to: unavailable
      for:
        minutes: 1
      id: became_unavailable
    - platform: state
      entity_id: fan.ke_ting_dian_feng_shan
      to: "off"
      for:
        seconds: 10
      id: turned_off

  condition:
    - condition: or
      conditions:
        # 條件一：風扇直接變為 unavailable
        - condition: trigger
          id: became_unavailable
        # 條件二：風扇被關閉，且「防關閉模式」是開啟的
        - condition: and
          conditions:
            - condition: trigger
              id: turned_off
            - condition: state
              entity_id: input_boolean.living_room_fan_prevent_off_mode
              state: "on"
            - condition: state
              entity_id: timer.living_room_fan_light_sync_snooze
              state: idle

  actions:
    - data:
        level: important
        line: false
        source: "21B_客廳電風扇異常告警AI (V4.0.0)"
        version: "{{ automation_version | default('', true) }}"
        title: "21B_客廳電風扇異常告警AI (V4.0.0)"
        message: "智慧家庭警告: 客廳電風扇電源連線異常，請確認！"
      action: script.notify_dispatch
      enabled: true
    - if:
        - condition: state
          entity_id: input_boolean.notify_line_important_enable
          state: "on"
      then:
        - service: script.send_line_to_user
          data:
            source: "21B_客廳電風扇異常告警AI (V4.0.0)"
            user_id: "{{ line_bot_target_user_id }}"
            payload: >-
              {{
                [
                  {"type":"text","text":"【智慧家庭通知】重要 Important ❗"},
                  {"type":"text","text":"⚠️ 智慧家庭告警：\n🛜 客廳電風扇電源連線異常（🔴），請確認電源與連線狀態。"}
                ] | tojson
              }}
    - if:
        - condition: template
          value_template: '{{ true }}'
      then:
        - parallel:
            - data:
                volume_level: 0.8
              action: media_player.volume_set
              target:
                entity_id: media_player.ke_ting_homepod
            - data:
                level: important
                line: false
                source: "21B_客廳電風扇異常告警AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                message: "智慧家庭警告: 客廳電風扇電源連線異常，請確認！"
                title: 智慧家庭告警
              action: script.notify_dispatch
            # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
        - action: script.announce
          data:
            level: important
            repeat_count: 2
            message: "智慧家庭警告: 客廳電風扇電源連線異常，請確認！"
        # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
        - data:
            volume_level: 0.5
          action: media_player.volume_set
          target:
            entity_id: media_player.ke_ting_homepod
      else:
        - parallel:
            - data:
                volume_level: 0.8
              action: media_player.volume_set
              target:
                entity_id: media_player.ke_ting_homepod
            - data:
                level: important
                line: false
                source: "21B_客廳電風扇異常告警AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                message: "智慧家庭警告: 客廳電風扇電源連線異常，請確認！"
                title: 智慧家庭告警
              action: script.notify_dispatch
            # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
        - action: script.announce
          data:
            level: important
            repeat_count: 2
            message: "智慧家庭警告: 客廳電風扇電源連線異常，請確認！"
        # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
        - delay:
            hours: 0
            minutes: 0
            seconds: 30
            milliseconds: 0
          enabled: true
        # TVSPEAKERTODO: 未來新廣播設備實體位置 (待更換設備後補上音量與播放指令)
        - data:
            volume_level: 0.5
          action: media_player.volume_set
          target:
            entity_id: media_player.ke_ting_homepod

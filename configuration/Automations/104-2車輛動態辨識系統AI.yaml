# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# ─────────────────────────────────────────────────────────────
# 104-2車輛動態辨識系統AI (V4.3.0-beta 5)
# 相容版本：Helpers V3.17（已確認）
# 更新紀錄（統一格式）：
# - V4.3.0-beta 5（2026-10-28，測試中）：車在車庫內挪位置（一個車位變空、另一車位同時變成有車）不算駛出憑證；淨空確認新增「車位 3 分鐘內變成有車＝車上可能還有人」。實際事件：10/28 10:28 Luxgen 由後位挪到前位準備出門，10:30 開門後 104-2 把後位剛變空當成已駛出，10:30:52 自動把鐵門關上，車還在車庫裡。
# - V4.3.0-beta 4（2026-10-28，測試中）：自動關門前先呼叫 script.garage_close_safety_check（車庫模型人物偵測＋車燈／煞車燈＋位移＋攝影機人員／動作＋手機位置）確認淨空；不安全每 30 秒重判、最多 10 次，仍不安全就不關並通知原因（交給 104-3）。
# - V4.3.0-beta 3（2026-10-28，測試中）：車庫有人（攝影機看到人或家人手機連在車庫 AP）而車還沒開走時，不再照 45 秒關門，改等車位真的變空（不設上限，車一直沒走就由 104-3 鐵門未關處理）、車走後再等一次緩衝。
# - V4.3.0-beta 2（2026-10-28，測試中）：用 10/24～10/27 的鐵門開啟紀錄逐筆回放後修正三處：①車位在鐵門「開到底之前」就變空（車在門升起途中開走）也算駛出憑證，原本只認開到底之後的變化，
#           實際 10/27 11:03 是靠雜訊碰巧補上；②憑證等待改為固定 6 分鐘期限，被忽略的舊訊號不再重置計時、也不會在重複 6 次後被當成憑證；
#           ③「準備出門旗標」不再當憑證（車還停著只是亮燈就可能被當成已駛出，45 秒後關門），一定要看到車位變空或車牌。
# - V4.3.0-beta 1（2026-10-26，測試中）：「車牌辨識」升級為「車輛動態辨識系統AI」。駛出憑證改用車位影像分析（該車位由有車變空、104-5 準備出門旗標）與車牌，
#           舊的車輛偵測／動作偵測只在影像分析關閉時採用；關門前緩衝改讀 input_number.lpr_close_buffer_sec；同一次開門去重；有人取消關門後等人離開再評估一次。正式版預計 V4.3.5。
# - V4.2.5（2026-10-26）：駛出憑證改看車位影像分析（該車位由有車變空、準備出門旗標），車輛偵測開關／動作偵測只在影像分析關閉時才採用；
#           關門前緩衝秒數改讀 input_number.lpr_close_buffer_sec（預設 45）；同一次開門去重；有人取消關門後等人離開再評估一次。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.1.1：修補版；車牌/設備代號 舊家用車牌 全域更名為 EBH8030，Webhook ID 與通知文字同步。
# - V3.1.0：功能版；沿用 LPR Debug 開關控管預備/取消類永久通知，新增車牌開門通知 Helper 控管實際自動開門通知；實際自動關門仍保留永久通知。
# - V3.0：正式版；安全緩衝時間由 90 秒下修為 45 秒。
# - V3.0 (RC1)：車輛駛出安全緩衝由 2 分鐘調整為 1.5 分鐘（90 秒），其餘流程不變。
# - V3.0 Beta 3：手動開門後一旦取得駛出憑證立即進入 2 分鐘安全緩衝；憑證等待上限由 10 分鐘下修為 6 分鐘。
# - V3.0 Beta 2：LPR 觸發直接視為具備憑證；取得憑證後安全等待時間統一為 2 分鐘；開門防呆 3 秒；支援 parallel 模式。
# - V3.0 Beta 1：統一命名規範、欄位標準化與通知標題版本同步。
# ─────────────────────────────────────────────────────────────
- alias: 104-2車輛動態辨識系統AI (V4.3.0-beta 5)
  id: ai_lpr_recognition
  description: >
    兩輛車（EAK8030、EBH8030）— 多 Webhook；即時門控監測；可取消式關門評估；
    新增出門防呆與 6 分鐘憑證等待。LPR觸發免憑證，統一給予 45 秒關門緩衝。
  mode: parallel
  max: 5

  trigger:
    # LPR — EAK8030
    - id: t_eak8030
      platform: webhook
      webhook_id: lpr_gate_eak8030
      allowed_methods: [GET, POST]
      local_only: false
    # LPR — EBH8030
    - id: t_ebh8030
      platform: webhook
      webhook_id: lpr_gate_ebh8030
      allowed_methods: [GET, POST]
      local_only: false
    # 鐵門一開就觸發 (代表鐵門已 100% 完全開啟)
    - id: t_gate_open_instant
      platform: state
      entity_id: cover.garage
      to: "open"

  variables:
    automation_version: "V4.3.0-beta 5"
    # 來源車牌與名稱
    plate: >-
      {% if trigger.id == 't_eak8030' %}EAK8030
      {% elif trigger.id == 't_ebh8030' %}EBH8030
      {% else %}未知{% endif %}
    car_name: >-
      {% if plate == 'EAK8030' %}Kenny車
      {% elif plate == 'EBH8030' %}家用車
      {% else %}未知車輛{% endif %}

    # 基本環境
    event_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    gate_state: "{{ states('cover.garage') }}"
    debug_on: "{{ is_state('input_boolean.lpr_debug_notify','on') }}"
    auto_close_enabled: "{{ is_state('input_boolean.lpr_auto_close_enable','on') }}"
    open_notify_enabled: "{{ is_state('input_boolean.lpr_open_notify_enable','on') }}"
    
    # 安防與感測器群
    aqara_li_jia_on: "{{ is_state('input_boolean.aqara_li_jia','on') }}"
    person_sensor: binary_sensor.che_ku_she_ying_ji_person_detected
    vehicle_sensor: binary_sensor.che_ku_she_ying_ji_vehicle_detected
    motion_sensor: binary_sensor.g6_instant_motion
    
    arm_away_now: "{{ aqara_li_jia_on }}"
    nobody_now: "{{ is_state(person_sensor, 'off') }}"
    
    # 判斷是否為 LPR 剛觸發的開門 (120 秒內)
    lpr_opened_recently: >-
      {{ 
        '來源:LPR' in states('input_text.lpr_last_event') and 
        (as_timestamp(now()) - as_timestamp(states.input_text.lpr_last_event.last_updated)) < 120 
      }}

    # V4.3.0-beta 5：車子在鐵門升起途中就開走（車位在「開到底」之前已變空）也算駛出憑證，只看開門前 120 秒內才變空的車位
    #   （實際紀錄 10/27 11:03、15:17 車位都在開到底前 10～40 秒變空，原本會因為等不到憑證而不關門）；需車位影像分析開啟
    slot_emptied_recently: >-
      {{ is_state('input_boolean.garage_depart_watch_enable', 'on') and (
           (is_state('input_select.garage_slot_front', 'empty') and (as_timestamp(now()) - as_timestamp(states.input_select.garage_slot_front.last_changed)) < 120)
           or (is_state('input_select.garage_slot_back', 'empty') and (as_timestamp(now()) - as_timestamp(states.input_select.garage_slot_back.last_changed)) < 120)) }}
    # 車在車庫內挪位置（一個車位變空、另一個車位同時變成有車；10/28 10:28 Luxgen 由後位挪到前位，結果鐵門被自動關上）不算駛出
    slot_moved_inside: >-
      {{ (not is_state('input_select.garage_slot_front', 'empty') and (as_timestamp(now()) - as_timestamp(states.input_select.garage_slot_front.last_changed)) < 180)
         or (not is_state('input_select.garage_slot_back', 'empty') and (as_timestamp(now()) - as_timestamp(states.input_select.garage_slot_back.last_changed)) < 180) }}
    have_cred: "{{ lpr_opened_recently or (slot_emptied_recently and not slot_moved_inside) }}"

    # LPR 當下「開門」預判（需保全 Arm Away）
    should_open_now: "{{ is_state('cover.garage','closed') and arm_away_now }}"

  action:
    - choose:
        # ① LPR 事件（回家或出門觸發自動開門）
        - conditions:
            - condition: template
              value_template: "{{ trigger.id in ['t_eak8030','t_ebh8030'] }}"
          sequence:
            - service: input_text.set_value
              data:
                entity_id: input_text.lpr_last_event
                value: >-
                  {{
                    (event_time ~ " | 來源:LPR | 車牌:" ~ plate ~
                    " (" ~ car_name ~ ") | 鐵門:" ~ gate_state)[:255]
                  }}
            - service: input_select.select_option
              data:
                entity_id: input_select.lpr_last_plate
                option: "{{ '未偵測' if plate=='未知' else plate }}"
            
            - choose:
                # 條件符合：關閉狀態 + Arm Away 下收到 LPR -> 等 3 秒 -> 開門
                - conditions:
                    - condition: template
                      value_template: "{{ should_open_now }}"
                  sequence:
                    - delay: "00:00:03"  # 🟢 3 秒防呆
                    - condition: state
                      entity_id: cover.garage
                      state: "closed"
                    - service: cover.open_cover
                      target:
                        entity_id: cover.garage
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ open_notify_enabled | bool(false) }}"
                          sequence:
                            - service: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "✅ LPR 開門指令已執行 ({{ automation_version }})"
                                message: >-
                                  時間：{{ event_time }}
                                  車牌：{{ plate }}（{{ car_name }}）
                                  指令：開門 (因鐵門為關閉狀態)
                # 條件不符：門已開或非 Arm Away -> 僅通知
                - conditions:
                    - condition: template
                      value_template: "{{ not should_open_now }}"
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_on | bool(false) }}"
                          sequence:
                            - service: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "ℹ️ LPR 事件通知 ({{ automation_version }})"
                                message: >-
                                  時間：{{ event_time }}
                                  車牌：{{ plate }}（{{ car_name }}）
                                  狀態：{{ '鐵門已開，不重複執行。' if is_state('cover.garage','open') else '目前非 Arm Away，不執行開門。' }}

        # ② 鐵門開啟 → 進入「可取消」的延遲關門評估
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 't_gate_open_instant' }}"
          sequence:
            # V4.2.5：同一次開門只跑一輪評估（30 秒內已有一輪就略過），避免 mode: parallel 重複關門／重複通知
            - if: "{{ (as_timestamp(now()) - as_timestamp(states('input_datetime.garage_gate_run_last'), 0)) < 30 }}"
              then:
                - stop: "同一次開門已有另一輪在評估"
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.garage_gate_run_last
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - service: input_text.set_value
              data:
                entity_id: input_text.lpr_last_event
                value: >-
                  {{
                    (event_time ~ " | 來源:GateOpen | 車牌:N/A | 鐵門:" ~ gate_state)[:255]
                  }}
            
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ debug_on | bool(false) }}"
                  sequence:
                    - service: script.notify_dispatch
                      data:
                        level: info
                        line: false
                        source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                        version: "{{ automation_version | default('', true) }}"
                        title: "🛗 鐵門已完全打開（{{ automation_version }}）"
                        message: |-
                          鐵門已完全打開
                          {% if have_cred -%}
                          憑證：{{ '近期已有 LPR 觸發紀錄' if lpr_opened_recently else '車位在開門途中已變空' }}，視同取得駛出憑證
                          下一步：45 秒後評估關門
                          {%- else -%}
                          憑證：等待駛出憑證（6 分鐘內）
                          下一步：取得憑證後立即進入 45 秒安全緩衝
                          {%- endif %}

            # —— 階段一：防呆等待，確認車輛真的有移動/駛出 —— #
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not have_cred }}"  # 🟢 若 LPR 剛觸發過、或車位在開門途中已變空，跳過這段等待
                  sequence:
                    # V4.3.0-beta 5：憑證等待有固定期限（開到底起 6 分鐘），被忽略的舊訊號不再重置計時，也不會在重複 6 次後被當成憑證
                    - variables:
                        cred_deadline: "{{ as_timestamp(now()) + 360 }}"
                    - repeat:
                        sequence:
                            - wait_for_trigger:
                                # 【憑證一：車位影像分析（V4.2.5）】停了很久的車要出門時，攝影機不會產生新的車輛事件；
                                #   改看車位狀態（該車位由有車變空）。
                                #   V4.3.0-beta 5：不再把「準備出門旗標」當憑證——車還停著、只是亮燈準備時就會誤判，45 秒後可能關門；一定要看到車位真的變空或車牌。
                                - platform: state
                                  entity_id: input_select.garage_slot_front
                                  to: "empty"
                                - platform: state
                                  entity_id: input_select.garage_slot_back
                                  to: "empty"
                                # 【憑證二：專屬車輛辨識（車牌）】
                                - platform: webhook
                                  webhook_id: lpr_gate_eak8030
                                - platform: webhook
                                  webhook_id: lpr_gate_ebh8030
                                # 【舊訊號：只有車位影像分析關閉時才採用，否則忽略（會把「車進來」也當成憑證）】
                                - platform: state
                                  entity_id: binary_sensor.che_ku_she_ying_ji_vehicle_detected
                                  to: "on"
                                - platform: state
                                  entity_id: binary_sensor.che_ku_she_ying_ji_vehicle_detected
                                  to: "off"
                                - platform: state
                                  entity_id: binary_sensor.g6_instant_motion
                                  from: "on"
                                  to: "off"
                                  for:
                                    seconds: 30
                              timeout:
                                seconds: "{{ [((cred_deadline | float(0)) - as_timestamp(now())) | int(0), 1] | max }}"
                              continue_on_timeout: true

                            # 如果 6 分鐘都沒有憑證觸發 ⇒ 取消
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ wait.trigger is none }}"
                                  sequence:
                                    - choose:
                                        - conditions:
                                            - condition: template
                                              value_template: "{{ debug_on | bool(false) }}"
                                          sequence:
                                            - service: script.notify_dispatch
                                              data:
                                                level: info
                                                line: false
                                                source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                                version: "{{ automation_version | default('', true) }}"
                                                title: "⛔ 已取消自動關門 (車輛未駛出)"
                                                message: |-
                                                  已取消自動關門
                                                  原因：鐵門開啟後 6 分鐘內未捕捉到駛出憑證

                                                  ※ 為保護安全，本次不自動關門。
                                    - stop: "Canceled because no car left"
                                - conditions:
                                    - condition: template
                                      value_template: >-
                                        {{ wait.trigger is not none and (debug_on | bool(false)) and not (
                                             is_state('input_boolean.garage_depart_watch_enable', 'on')
                                             and wait.trigger.platform == 'state'
                                             and wait.trigger.entity_id in ['binary_sensor.che_ku_she_ying_ji_vehicle_detected', 'binary_sensor.g6_instant_motion']) }}
                                  sequence:
                                    - service: script.notify_dispatch
                                      data:
                                        level: info
                                        line: false
                                        source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                        version: "{{ automation_version | default('', true) }}"
                                        title: "✅ 已取得駛出憑證"
                                        message: |-
                                          已取得駛出憑證
                                          來源：{{ wait.trigger.platform }}
                                          下一步：進入 45 秒安全緩衝

                                          ※ 不會繼續等待到 6 分鐘上限。
                        until:
                          - condition: template
                            value_template: >-
                              {{ wait.trigger is none or not (
                                   is_state('input_boolean.garage_depart_watch_enable', 'on')
                                   and wait.trigger.platform == 'state'
                                   and wait.trigger.entity_id in ['binary_sensor.che_ku_she_ying_ji_vehicle_detected', 'binary_sensor.g6_instant_motion']) }}

            # —— 階段二：確認駛出 (或 LPR 直達)，進入統一 45 秒安全緩衝 —— #
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.che_ku_she_ying_ji_person_detected
                  to: "on"
              timeout:
                seconds: "{{ states('input_number.lpr_close_buffer_sec') | int(45) }}"  # V4.2.5：改讀面板可調的 input_number.lpr_close_buffer_sec（預設 45 秒）
              continue_on_timeout: true

            # 緩衝期間偵測到人 ⇒ 取消
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_on | bool(false) }}"
                          sequence:
                            - service: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "⛔ 已取消自動關門 (偵測到人)"
                                message: "等待期間攝影機偵測到人員活動，為保護安全已暫停關門。"
                    # V4.2.5：不直接放棄；等人離開 1 分鐘（最多 5 分鐘）後再評估一次，避免鐵門一直開著
                    - wait_for_trigger:
                        - platform: state
                          entity_id: binary_sensor.che_ku_she_ying_ji_person_detected
                          to: "off"
                          for:
                            seconds: 60
                      timeout:
                        minutes: 5
                      continue_on_timeout: true
                    - if: "{{ wait.trigger is none }}"
                      then:
                        - stop: "Canceled by presence (retry timed out)"

            # V4.3.0-beta 5：車庫有人（攝影機看到人，或家人手機連在車庫 AP）而車還沒開走（開門前 120 秒起沒有車位變空）
            #   ⇒ 不照 45 秒關門，改等車位真的變空（不設上限；一直沒走由 104-3 鐵門未關處理），車走後再等一次緩衝。需車位影像分析開啟
            - if: >-
                {{ is_state('input_boolean.garage_depart_watch_enable', 'on')
                   and (is_state('binary_sensor.che_ku_she_ying_ji_person_detected', 'on')
                        or '車庫' in [states('sensor.at_home_kenny_location'), states('sensor.at_home_iris_location'), states('sensor.at_home_jerry_location'), states('sensor.at_home_elay_location')])
                   and not (
                     (is_state('input_select.garage_slot_front', 'empty') and (as_timestamp(states.input_select.garage_slot_front.last_changed) > as_timestamp(states.cover.garage.last_changed) - 120))
                     or (is_state('input_select.garage_slot_back', 'empty') and (as_timestamp(states.input_select.garage_slot_back.last_changed) > as_timestamp(states.cover.garage.last_changed) - 120))) }}
              then:
                - wait_for_trigger:
                    - platform: state
                      entity_id: input_select.garage_slot_front
                      to: "empty"
                    - platform: state
                      entity_id: input_select.garage_slot_back
                      to: "empty"
                    - platform: state
                      entity_id: cover.garage
                      to: "closed"
                # 不設等待上限：車一直沒走，鐵門開太久就由 104-3（開門 10 分鐘提醒＋2 分鐘觀察）處理；門先被關上就結束
                - if: "{{ wait.trigger.entity_id == 'cover.garage' }}"
                  then:
                    - stop: "鐵門已關閉，結束等待車輛駛出"
                - delay:
                    seconds: "{{ states('input_number.lpr_close_buffer_sec') | int(45) }}"

            # 視窗結束 ⇒ 條件式判斷
            - variables:
                arm_away_later: "{{ is_state('input_boolean.aqara_li_jia','on') }}"
                # 🟢 三重保護：確認現場無人、無車輛狀態、無任何細微移動
                nobody_later: >-
                  {{ 
                    is_state(person_sensor, 'off') and 
                    is_state(vehicle_sensor, 'off') and
                    is_state(motion_sensor, 'off')
                  }}
                gate_still_open: "{{ is_state('cover.garage','open') }}"
            - choose:
                # 符合條件
                - conditions:
                    - condition: template
                      value_template: "{{ (gate_still_open | bool(false)) and (arm_away_later | bool(false)) and (nobody_later | bool(false)) }}"
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ auto_close_enabled | bool(false) }}"
                          sequence:
                            # V4.3.0-beta 6：關門前用車庫模型再確認一次淨空（沒人、車燈／煞車燈沒亮、車沒在動）；不安全就每 30 秒重判，最多 10 次，仍不安全就不關（交給 104-3）
                            - repeat:
                                sequence:
                                  - action: script.garage_close_safety_check
                                    response_variable: sf
                                  - if: "{{ not (sf is mapping and sf.get('safe') == true) and is_state('cover.garage', 'open') }}"
                                    then:
                                      - delay: "00:00:30"
                                until:
                                  - condition: template
                                    value_template: "{{ (sf is mapping and sf.get('safe') == true) or not is_state('cover.garage', 'open') or repeat.index >= 10 }}"
                            - action: script.garage_close_safety_check
                              response_variable: sf2
                            - if: "{{ not (sf2 is mapping and sf2.get('safe') == true) or not is_state('cover.garage', 'open') }}"
                              then:
                                - if: "{{ is_state('cover.garage', 'open') }}"
                                  then:
                                    - service: script.notify_dispatch
                                      data:
                                        level: info
                                        line: false
                                        source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                        version: "{{ automation_version | default('', true) }}"
                                        title: "⛔ 已取消自動關門 (淨空確認未通過)"
                                        message: "{{ '、'.join(sf2.reasons) if (sf2 is mapping and sf2.get('reasons')) else '無法確認' }}。5 分鐘內仍未淨空，不自動關門，交給 104-3 鐵門未關處理。"
                                - stop: "淨空確認未通過或鐵門已不是開啟狀態"
                            - service: cover.close_cover
                              target:
                                entity_id: cover.garage
                            - service: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "🤖 自動關門已執行 ({{ automation_version }})"
                                message: "倒數結束：Arm Away + 現場三重靜態確認無動靜 + 門仍開 ⇒ 已下達關門。"
                        - conditions:
                            - condition: template
                              value_template: "{{ (not (auto_close_enabled | bool(false))) and (debug_on | bool(false)) }}"
                          sequence:
                            - service: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "🤖（預備）條件式關門：會關"
                                message: "預判會關門。目前僅通知；開啟『LPR自動關門』即可生效。"
                # 不符合條件
                - conditions:
                    - condition: template
                      value_template: "{{ (not ((gate_still_open | bool(false)) and (arm_away_later | bool(false)) and (nobody_later | bool(false)))) and (debug_on | bool(false)) }}"
                  sequence:
                    - service: script.notify_dispatch
                      data:
                        level: info
                        line: false
                        source: "104-2車輛動態辨識系統AI (V4.3.0-beta 5)"
                        version: "{{ automation_version | default('', true) }}"
                        title: "🙂（預備）條件式關門：不關"
                        message: >-
                          條件未滿足：保全={{ 'Arm Away' if (arm_away_later | bool(false)) else '非 Arm Away' }}、
                          現場動靜={{ '平靜無人' if (nobody_later | bool(false)) else '有動靜' }}、鐵門={{ '仍開啟' if (gate_still_open | bool(false)) else '已關閉' }}。
      default: []

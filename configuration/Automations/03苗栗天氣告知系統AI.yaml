# ─────────────────────────────────────────────────────────────
# 03苗栗天氣告知系統AI (V4.1.5)
# 相容版本：Helpers V3.0
# 更新紀錄（統一格式）：
# - V4.1.5（2026-10-11）：災害訊息改成「依內容分級、不重要的不通知」。
#   問題：原本只要內文有「苗栗」就用「一般」級通知＋廣播；實際 45 天 255 則訊息裡有 114 則提到苗栗，其中 84 則是風力黃燈、109 則是各地水務搶修，幾乎都不重要。
#   分級（msg_level）：
#     emergency：地震／海嘯／國家級警報／疏散撤離／土石流／堰塞湖，以及含苗栗的陸上颱風警報。
#     important：竹南周邊（竹南、頭份、後龍、三灣、造橋）的淹水警戒、停水停電、水庫洩洪；颱風警報；含苗栗的豪雨／大豪雨特報；苗栗橙色／紅色高溫燈號。
#     general  ：竹南周邊淹水警戒解除。
#     info     ：含苗栗或竹苗的大雨預報、豪雨／大豪雨特報解除（只發 HA 資訊通知，不發 LINE、不廣播）。
#     其餘（風力黃燈、黃色高溫、他處水務搶修、火災、消防檢查、全台大雷雨即時訊息…）：不通知。
#   發送：統一用 script.notify_dispatch 依等級發（HA／LINE 開關由 dispatch 處理）；只有 important／emergency 才廣播（important 只在 07:00–22:00，emergency 不限時段）。
#   早晨補報：只補報夜間（22:00–07:00）收到、尚未廣播的 important／emergency 訊息的語音；不再要求「5 分鐘內更新」（原本的條件讓補報幾乎不可能成立）。夜間的 HA／LINE 通知照常即時發出。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.0：統一命名規範、欄位標準化與通知標題版本同步。
# ─────────────────────────────────────────────────────────────
- alias: 03苗栗天氣告知系統AI (V4.1.5)
  id: ai_miaoli_weather_disaster_notify
  description: 依內容分級通知苗栗（竹南周邊）的災害與天氣訊息，不重要的不通知；重要以上才廣播
  mode: queued
  max: 10
  variables:
    automation_version: "V4.1.5"
    local_re: "竹南|頭份|後龍|三灣|造橋"
  triggers:
    - entity_id: sensor.disaster
      id: message_received
      trigger: state
    - at: "07:00:05"
      id: morning_catch_up
      trigger: time
  actions:
    - variables:
        current_message: "{{ states('sensor.disaster') }}"
        msg_level: >-
          {% set m = current_message %}
          {% set local = m | regex_search(local_re) %}
          {% set county = m | regex_search('苗栗') %}
          {% set cancel = m | regex_search('解除|已無警戒|降至|已降至') %}
          {% if m in ['unknown', 'unavailable', 'none', 'None', ''] %}drop
          {% elif m | regex_search('地震|海嘯|國家級警報|空襲|飛彈|疏散|撤離|土石流|堰塞') %}emergency
          {% elif m | regex_search('陸上.{0,6}颱風警報') and county and not cancel %}emergency
          {% elif m | regex_search('颱風警報') and not cancel %}important
          {% elif local and m | regex_search('淹水|警戒') %}{{ 'general' if cancel else 'important' }}
          {% elif local and m | regex_search('洩洪|放水|溢流') %}important
          {% elif local and m | regex_search('停水|停電|暫停供水') %}important
          {% elif county and m | regex_search('大豪雨|超大豪雨|豪雨特報|大雨特報') and not cancel %}important
          {% elif m | regex_search('苗栗縣[^燈]*(橙|紅)色燈號') %}important
          {% elif cancel and m | regex_search('大豪雨|豪雨|大雨') %}info
          {% elif (county or m | regex_search('竹苗')) and m | regex_search('局部大雨|局部豪雨|大雨或豪雨') %}info
          {% else %}drop{% endif %}
        is_broadcast_time: "{{ 7 <= now().hour < 22 }}"
        last_broadcast_ts: "{{ as_timestamp(states('input_datetime.last_disaster_broadcast'), 0) }}"
        last_message: "{{ states('input_text.disaster_last_message') }}"
        message_ts: "{{ as_timestamp(states.sensor.disaster.last_updated, 0) }}"
        is_new_content: "{{ current_message[:250] != last_message }}"
        level_title: >-
          {{ {'emergency': '緊急災害訊息', 'important': '重要災害訊息', 'general': '本地災害訊息', 'info': '天氣資訊'}.get(msg_level | trim, '天氣資訊') }}
        voice_text: "{{ '天氣告知系統收到以下政府災害訊息 ' ~ (current_message | replace('\n', ' '))[:160] }}"
    - choose:
        # ── 即時：依等級發 HA／LINE，重要以上再廣播 ──
        - conditions:
            - condition: trigger
              id: message_received
            - condition: template
              value_template: "{{ (msg_level | trim) != 'drop' and is_new_content }}"
          sequence:
            - variables:
                lv: "{{ msg_level | trim }}"
                speak: "{{ lv in ['important', 'emergency'] and (is_broadcast_time or lv == 'emergency') }}"
            - action: script.notify_dispatch
              data:
                level: "{{ lv }}"
                line: "{{ lv != 'info' }}"
                source: "03苗栗天氣告知系統AI (V4.1.5)"
                version: "{{ automation_version }}"
                title: "{{ level_title }}"
                message: |-
                  天氣告知系統收到以下政府災害訊息:

                  {{ current_message }}
            - if: "{{ speak }}"
              then:
                - action: script.announce
                  data:
                    level: "{{ lv }}"
                    message: "{{ voice_text }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.last_disaster_broadcast
                  data:
                    datetime: "{{ now().isoformat() }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.disaster_last_message
              data:
                value: "{{ current_message[:250] }}"
        # ── 早晨補報：只補夜間收到、還沒廣播過的重要／緊急訊息（語音） ──
        - conditions:
            - condition: trigger
              id: morning_catch_up
            - condition: template
              value_template: >-
                {{ (msg_level | trim) in ['important', 'emergency']
                   and message_ts > last_broadcast_ts
                   and (now().timestamp() - message_ts) < 9 * 3600 }}
          sequence:
            - action: script.announce
              data:
                level: "{{ msg_level | trim }}"
                message: "{{ '早晨補報。' ~ voice_text }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.last_disaster_broadcast
              data:
                datetime: "{{ now().isoformat() }}"


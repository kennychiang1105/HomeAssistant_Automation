# ─────────────────────────────────────────────────────────────
# 03苗栗天氣告知系統AI (V4.2.0)
# 相容版本：Helpers V3.0
# 更新紀錄（統一格式）：
# - V4.2.0（2026-10-22）：災害廣播在地化（苗栗竹南新竹）＋修復中途截斷問題。
#   1. 廣播改用 disaster_voice 巨集：只念在地（苗栗縣/竹南/新竹縣市）燈號與警戒，其他縣市完全不念；若無本地區內容則不廣播。
#   2. 移除 [:160] 硬切限制，確保語音為自然完整句結尾（補「。」），避免念到一半中斷。
#   3. speak 與早晨補報皆增加 voice_text 不為空之檢查，無在地警報不打擾。
# - V4.1.5（2026-10-11）：災害訊息改成「依內容分級、不重要的不通知」。
#   問題：原本只要內文有「苗栗」就用「一般」級通知＋廣播；實際 45 天 255 則訊息裡有 114 則提到苗栗，其中 84 則是風力黃燈、109 則是各地水務搶修，幾乎都不重要。
#   分級（msg_level）：
#     emergency（緊急類）：疏散撤離／土石流／堰塞湖／海嘯警報（內文有苗栗；解除或沒寫苗栗的降為 info）／國家級警報／空襲飛彈（不限地區）。
#     important（重要類）：確定「竹南有影響」才算——
#         · 內文直接寫竹南的淹水警戒、停水停電、水庫洩洪；
#         · 縣市層級的警報且列有苗栗：颱風警報（含陸上）、豪雨／大豪雨特報、橙色／紅色燈號（竹南屬苗栗縣，視為有影響）。
#     info（只發 HA 資訊通知，不發 LINE、不廣播）：含苗栗或竹苗的大雨預報、豪雨／大豪雨特報解除、竹南解除淹水警戒、
#         竹南鄰近（頭份、後龍、三灣、造橋）的淹水警戒／洩洪／停水停電（竹南沒寫到）、內文有「演練」「演習」「模擬」的訊息。
#     其餘（風力黃燈、黃色高溫、他處水務搶修、火災、消防檢查、全台大雷雨即時訊息…）：不通知。
#     地震由「02地震災害系統」處理，這裡不通知（海嘯仍由這裡處理）。
#   通知等級對照（呼叫 notify_dispatch／announce 時）：重要類→「一般」級；緊急類→「重要」級；info→「資訊」級。
#   開關：packages/v41_disaster_notify.yaml 六個開關（LINE、HA、廣播 各分重要類／緊急類），LINE 兩個公開給 HomeKit；關閉後該類不發對應通知／不廣播。
#   廣播：只有重要類（07:00–22:00）與緊急類（不限時段）會廣播。
#   早晨補報：只補報夜間（22:00–07:00）收到、尚未廣播的重要類／緊急類訊息語音；不再要求「5 分鐘內更新」（原本的條件讓補報幾乎不可能成立）。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.0：統一命名規範、欄位標準化與通知標題版本同步。
# ─────────────────────────────────────────────────────────────
- alias: 03苗栗天氣告知系統AI (V4.2.0)
  id: ai_miaoli_weather_disaster_notify
  description: 依內容分級通知竹南有影響的災害與天氣訊息，不重要的不通知；重要類與緊急類才廣播
  mode: queued
  max: 10
  variables:
    automation_version: "V4.2.0"
    near_re: "頭份|後龍|三灣|造橋"
  triggers:
    - entity_id: sensor.disaster
      id: message_received
      trigger: state
    - at: "07:00:05"
      id: morning_catch_up
      trigger: time
  actions:
    - variables:
        current_message: "{{ states('sensor.disaster') }}"
        msg_level: >-
          {% set m = current_message %}
          {% set zhunan = m | regex_search('竹南') %}
          {% set near = m | regex_search(near_re) %}
          {% set county = m | regex_search('苗栗') %}
          {% set cancel = m | regex_search('解除|已無警戒|降至|已降至') %}
          {% if m in ['unknown', 'unavailable', 'none', 'None', ''] %}drop
          {% elif m | regex_search('演練|演習|模擬') %}info
          {% elif m | regex_search('海嘯') %}{{ ('info' if cancel else 'emergency') if county else 'info' }}
          {% elif m | regex_search('地震') %}drop
          {% elif m | regex_search('國家級警報|空襲|飛彈') %}emergency
          {% elif county and m | regex_search('疏散|撤離|土石流|堰塞') %}emergency
          {% elif county and m | regex_search('颱風警報') and not cancel %}important
          {% elif zhunan and m | regex_search('淹水|警戒') %}{{ 'info' if cancel else 'important' }}
          {% elif zhunan and m | regex_search('洩洪|放水|溢流') %}important
          {% elif zhunan and m | regex_search('停水|停電|暫停供水') %}important
          {% elif near and m | regex_search('淹水|警戒|洩洪|放水|溢流|停水|停電|暫停供水') %}info
          {% elif county and m | regex_search('大豪雨|超大豪雨|豪雨特報|大雨特報') and not cancel %}important
          {% elif m | regex_search('苗栗縣[^燈]*(橙|紅)色燈號') %}important
          {% elif cancel and m | regex_search('大豪雨|豪雨|大雨') %}info
          {% elif (county or m | regex_search('竹苗')) and m | regex_search('局部大雨|局部豪雨|大雨或豪雨') %}info
          {% else %}drop{% endif %}
        is_broadcast_time: "{{ 7 <= now().hour < 22 }}"
        last_broadcast_ts: "{{ as_timestamp(states('input_datetime.last_disaster_broadcast'), 0) }}"
        last_message: "{{ states('input_text.disaster_last_message') }}"
        message_ts: "{{ as_timestamp(states.sensor.disaster.last_updated, 0) }}"
        is_new_content: "{{ current_message[:250] != last_message }}"
        level_title: >-
          {{ {'emergency': '緊急災害訊息', 'important': '重要災害訊息', 'info': '天氣資訊'}.get(msg_level | trim, '天氣資訊') }}
        voice_text: >-
          {% from 'notify_body.jinja' import disaster_voice %}{% set v = disaster_voice(current_message) | trim %}
          {{ ('天氣告知系統收到政府災害訊息。' ~ v) if v else '' }}
    - choose:
        # ── 即時：依類別發 HA／LINE，重要類與緊急類再廣播 ──
        - conditions:
            - condition: trigger
              id: message_received
            - condition: template
              value_template: "{{ (msg_level | trim) != 'drop' and is_new_content }}"
          sequence:
            - variables:
                lv: "{{ msg_level | trim }}"
                # 重要類→一般級；緊急類→重要級；info→資訊級
                send_level: "{{ {'emergency': 'important', 'important': 'general', 'info': 'info'}[lv] }}"
                ha_on: "{{ lv == 'info' or is_state('input_boolean.notify_ha_disaster_' ~ lv ~ '_enable', 'on') }}"
                line_on: "{{ lv != 'info' and is_state('input_boolean.notify_line_disaster_' ~ lv ~ '_enable', 'on') }}"
                speak: "{{ (voice_text | trim != '') and lv in ['important', 'emergency'] and (is_broadcast_time or lv == 'emergency') and is_state('input_boolean.announce_disaster_' ~ lv ~ '_enable', 'on') }}"
            - if: "{{ ha_on or line_on }}"
              then:
                - action: script.notify_dispatch
                  data:
                    level: "{{ send_level }}"
                    to_ha: "{{ ha_on }}"
                    line: "{{ line_on }}"
                    source: "03苗栗天氣告知系統AI (V4.2.0)"
                    version: "{{ automation_version }}"
                    title: "{{ level_title }}"
                    message: |-
                      天氣告知系統收到以下政府災害訊息:

                      {{ current_message }}
            - if: "{{ speak }}"
              then:
                - action: script.announce
                  data:
                    level: "{{ send_level }}"
                    message: "{{ voice_text }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.last_disaster_broadcast
                  data:
                    datetime: "{{ now().isoformat() }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.disaster_last_message
              data:
                value: "{{ current_message[:250] }}"
        # ── 早晨補報：只補夜間收到、還沒廣播過的重要類／緊急類訊息（語音） ──
        - conditions:
            - condition: trigger
              id: morning_catch_up
            - condition: template
              value_template: >-
                {{ (voice_text | trim != '')
                   and (msg_level | trim) in ['important', 'emergency']
                   and message_ts > last_broadcast_ts
                   and (now().timestamp() - message_ts) < 9 * 3600
                   and is_state('input_boolean.announce_disaster_' ~ (msg_level | trim) ~ '_enable', 'on') }}
          sequence:
            - action: script.announce
              data:
                level: "{{ 'important' if (msg_level | trim) == 'emergency' else 'general' }}"
                message: "{{ '早晨補報。' ~ voice_text }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.last_disaster_broadcast
              data:
                datetime: "{{ now().isoformat() }}"


        state: 'on'
      - condition: state
        entity_id: input_boolean.jin_ji_mo_shi_pan_duan_kai_guan_ii_ha_auto
        state: 'off'
      - condition: state
        entity_id: input_boolean.jin_ji_mo_shi_pan_duan_kai_guan_iii_ha_manual
        state: 'off'
        enabled: true
      - condition: state
        entity_id: input_boolean.jin_ji_mo_shi_pan_duan_kai_guan_iv_shi_ti_an_niu
        state: 'off'
      sequence:
      - parallel:
        - data:
            user_id: C26ff4e9d30159ba5264a1676f46f8f86
            payload: "[\n      {\n          \"type\":\"text\",\n\n           \"text\":\"【智慧家庭通知】\U0001F198
              緊急 Urgent ‼️\"\n      },\n      {\n\n           \"type\":\"text\",\n
              \         \"text\":\"\U0001F198 緊急模式已被啟動，\\n所有照明開啟並關閉電源!\"\n\n       },\n
              \     {\n          \"type\":\"text\",\n          \"text\":\"\U0001F534緊急模式由家庭APP手動觸發\U0001F4F1，\\n請確認是否誤觸‼️\\n若為誤觸或誤發命令，\\n請復原所有電源與照明設備狀態。\\n(於家庭APP中直接調整電源與照明or執行離家模式)\"\n\n
              \      },\n      {\n          \"type\":\"text\",\n          \"text\":\"\U0001F7E2緊急情況結束後，\\n請確認所有電源與照明設備開關狀態!\\n根據情況開關電源與照明。\\n\\n復原方式:\\n於家庭APP中直接調整電源與照明or執行離家模式\"\n\n
              \      },\n      {\n          \"type\":\"text\",\n          \"text\":\"【\U0001F198 緊急

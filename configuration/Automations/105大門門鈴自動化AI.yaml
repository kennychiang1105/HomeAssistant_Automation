# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# - V4.0.0：門鈴改為重要級；通知加門鈴圖示、車庫攝影機截圖、車庫即時影像網頁連結與 8 秒 LINE 短片；使用專屬門鈴提示音（/media/chime_doorbell.mp3，四音鈴聲約 2.6 秒）：廣播用 script.announce（重要，觸發氣氛燈提醒）、通知用 script.notify_dispatch（HA + LINE 扁平卡片）；移除自帶音量儲存/還原（由 announce 處理）。
# - V4.0.0：外網網址改用 family.kteam.tw（截圖/圖示/轉址頁）。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# ==============================================================================
# 105大門門鈴自動化AI (V4.0.0)
# ==============================================================================
# 相容版本：Helpers V3.21.1 (門鈴 helper 與 LINE 通知開關)
#
# 功能描述：
# 1. 偵測小米門鈴無線開關（sensor.0x00158d0002419b84_action）單擊 'single' 或門鈴 HomeKit 橋接實體 binary_sensor.da_men_men_ling 觸發。
# 2. 家中廣播與 TTS（遵循 SOP-11 廣播音量恢復規範）：
#    - 廣播前先讀取客廳 HomePod 與頂樓 HomePod 的當前音量。
#    - 調整音量至 0.65 後發出語音通知：「大門有人按門鈴！請注意門外來訪客人。」。
#    - tts.speak 後等待 2 秒讓播放啟動，再以 wait_template 監聽播放器狀態離開 playing。
#    - 確認播畢（或超時 12 秒）後，恢復各 HomePod 至觸發前的原始音量。
# 3. LINE 智能推播 (遵循 SOP-10 規範)：
#    - 透過 script.send_line_to_user 發送推播，確認 target_user_id 有效且 input_boolean.notify_line_doorbell_enable 開啟。
#    - 採用 Helper 自訂標題與時間戳，若未啟用通知或發送失敗則透過 persistent_notification.create 留下系統通知與除錯紀錄。
#
# 修改歷史 (Changelog):
#   - V3.1.0 (2026-08-09): 功能版。廣播前儲存音量，wait_template（timeout 12s）確認播音完畢後恢復，遵循 SOP-11 廣播音量恢復規範。
#   - V3.0 (2026-08-02): 新增 105 大門門鈴自動化AI，參考 05B 緊急模式廣播與 106 保全系統 SOP-10 LINE 通知架構。
# ==============================================================================

- id: ai_105_front_door_doorbell_notify
  alias: 105大門門鈴自動化AI (V4.0.0)
  description: 大門門鈴按壓偵測、HomePod 語音廣播（含音量恢復）與 LINE 推播通知 (含 SOP-10/SOP-11 規範)
  mode: restart
  max_exceeded: silent
  variables:
    automation_version: 'V4.0.0'
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"
    line_doorbell_enabled: "{{ is_state('input_boolean.notify_line_doorbell_enable', 'on') }}"
    notif_title_doorbell: >-
      {% set title = states('input_text.notif_title_doorbell') %}
      {{ title if title and title|lower not in ['unknown','unavailable','none',''] else '【AI大門門鈴系統 V3.1.0】' }}
    at_home_count: "{{ states('sensor.at_home_count') | int(0) }}"
    now_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  triggers:
    - trigger: state
      entity_id:
        - sensor.0x00158d0002419b84_action
      to: 'single'
    - trigger: state
      entity_id:
        - binary_sensor.da_men_men_ling
      to: 'on'
  conditions: []
  actions:
    - parallel:
        # 1. 廣播（重要級，專屬門鈴提示音：統一廣播會處理音量/還原，並觸發氣氛燈提醒）
        - action: script.announce
          data:
            level: important
            chime_media: media-source://media_source/local/chime_doorbell.mp3
            chime_media_s: 2.6
            message: "大門有人按門鈴！請注意門外來訪客人。"
            player: media_player.guang_bo_qun_zu_all
        # 2. 車庫攝影機截圖 + HA 通知與 LINE 扁平卡片（重要級；LINE 仍受 notify_line_doorbell_enable 控管）
        - sequence:
            - variables:
                live_token: "live{{ range(10000, 99999) | random }}{{ range(10000, 99999) | random }}{{ range(10000, 99999) | random }}"
            - action: script.turn_on
              target:
                entity_id: script.garage_live
              data:
                variables:
                  token: "{{ live_token }}"
            - action: script.garage_snapshot
              response_variable: snap
              continue_on_error: true
            - action: script.notify_dispatch
              data:
                level: important
                source: "105大門門鈴自動化AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                title: 大門門鈴
                icon: "https://family.kteam.tw:8126/local/icons/doorbell.png?v=2"
                image: "{{ snap.url if snap is defined and snap is mapping and snap.url is defined else '' }}"
                link_url: "http://192.168.68.97:8125/local/live.html?t={{ live_token }}&openExternalBrowser=1"
                link_label: 開啟攝影機即時影像
                link_note: 僅限連接家裡 Wi-Fi 時可開啟
                link2_url: "https://family.kteam.tw:8126/local/home.html?openExternalBrowser=1"
                link2_label: 在「家庭」App 查看攝影機
                link2_note: 外出（外網）也可使用
                line: "{{ line_doorbell_enabled | bool(true) and (line_bot_target_user_id | string | length > 5) }}"
                user_id: "{{ line_bot_target_user_id }}"
                message: |-
                  大門有人按門鈴！

                  觸發時間：{{ now_time }}
                  目前家中成員數量：{{ at_home_count }} 人

                  請確認大門攝影機或應門。
            # 卡片送出後，錄 8 秒車庫短片並以 LINE 影片訊息跟進（不阻塞）
            - action: script.turn_on
              target:
                entity_id: script.garage_video_line
              data:
                variables:
                  user_id: "{{ line_bot_target_user_id }}"
                  preview: "{{ snap.url if snap is defined and snap is mapping and snap.url is defined else '' }}"
                  enabled: "{{ line_doorbell_enabled | bool(true) and (line_bot_target_user_id | string | length > 5) and is_state('input_boolean.notify_line_important_enable', 'on') }}"

# ────────────────────────────────────────────────────────
# 08-5K頂樓燈具使用權AI (V4.0.0)
# 相容版本：Helpers V4.0.0（已確認）
# 更新紀錄（統一格式）：
# - V4.0.0：新增。頂樓感應優化：判斷樓梯燈（4F 0fb7／5F 13b8）、坎燈、書房燈是「感應開的」還是「手動／其他自動化開的」。
#           感應開的燈由 08-5C／08-5G 負責關；手動開的樓梯燈保持 5 分鐘後恢復感應控制（9A 常開除外，需 9C 全關）；
#           手動開的坎燈永遠不自動關。Yeelink 狀態更新約延遲 10 秒，所以「感應開」的判斷窗口放寬為 20 秒。
#           另含：樓梯燈手動保持結束接管、11B 感應暫停到期自動恢復（HA 資訊通知）。
# ────────────────────────────────────────────────────────
- id: ai_08_5k_topfloor_light_ownership
  alias: 08-5K頂樓燈具使用權AI (V4.0.0)
  description: 判斷頂樓燈是感應開還是手動開；手動開的樓梯燈保持 5 分鐘、坎燈與書房燈標記為非感應
  mode: queued
  max: 20
  max_exceeded: silent
  variables:
    automation_version: V4.0.0
    ent: "{{ trigger.entity_id }}"
    k: >-
      {{ {'light.yeelink_color5_0fb7_light': '0fb7', 'light.yeelink_color5_13b8_light': '13b8',
          'light.ding_lou_kan_deng': 'kandeng', 'switch.shu_fang_deng': 'study'}.get(ent, '') }}
    auto_e: "{{ 'input_boolean.topfloor_' ~ k ~ '_auto' }}"
    to_s: "{{ trigger.to_state.state }}"
    is_stairs: "{{ k in ['0fb7', '13b8'] }}"
  triggers:
    - trigger: state
      entity_id:
        - light.yeelink_color5_0fb7_light
        - light.yeelink_color5_13b8_light
        - light.ding_lou_kan_deng
        - switch.shu_fang_deng
      to:
        - "on"
        - "off"
      not_from:
        - unavailable
        - unknown
  conditions:
    - condition: template
      value_template: "{{ k != '' }}"
  actions:
    - choose:
        - conditions: "{{ to_s == 'on' }}"
          sequence:
            # 感應自己開的（旗標剛設為 on，Yeelink 狀態延遲故放寬 20 秒）→ 不處理
            - if: >-
                {{ is_state(auto_e, 'on') and (now() - states[auto_e].last_changed).total_seconds() <= 20 }}
              then:
                - stop: "感應開啟，不是手動"
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ auto_e }}"
            - if: "{{ is_stairs }}"
              then:
                - action: timer.start
                  target:
                    entity_id: timer.topfloor_stairs_manual_hold
            - action: logbook.log
              data:
                name: 頂樓動線
                message: "{{ now().strftime('%H:%M:%S') }} {{ state_attr(ent, 'friendly_name') }} 被手動（或其他自動化）開啟，感應不會自動關閉{{ '（樓梯燈 5 分鐘內）' if is_stairs else '' }}"
              continue_on_error: true
        - conditions: "{{ to_s == 'off' }}"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ auto_e }}"
            - if: >-
                {{ is_stairs and is_state('light.yeelink_color5_0fb7_light', 'off') and is_state('light.yeelink_color5_13b8_light', 'off') }}
              then:
                - action: timer.cancel
                  target:
                    entity_id: timer.topfloor_stairs_manual_hold

- id: ai_08_5k_topfloor_manual_hold_end
  alias: 08-5K頂樓樓梯燈手動保持結束AI (V4.0.0)
  description: 手動保持 5 分鐘結束後，仍亮著的樓梯燈由感應接管（有人就續、沒人就關）；9A 常開除外
  mode: single
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.topfloor_stairs_manual_hold
  conditions:
    - condition: state
      entity_id: input_boolean.topfloor_stairs_keep_on
      state: "off"
  actions:
    - if: "{{ is_state('light.yeelink_color5_0fb7_light', 'on') }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.topfloor_0fb7_auto
    - if: "{{ is_state('light.yeelink_color5_13b8_light', 'on') }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.topfloor_13b8_auto
    - action: timer.start
      target:
        entity_id: timer.topfloor_stairs_max

- id: ai_08_5k_topfloor_pause_end
  alias: 08-5K頂樓感應暫停到期AI (V4.0.0)
  description: 11B 長按暫停頂樓感應 2 小時，時間到自動恢復並發 HA 資訊通知（不發 LINE）
  mode: single
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.topfloor_pause
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.topfloor_motion_pause
    - action: script.notify_dispatch
      data:
        level: info
        line: false
        source: "08-5K頂樓燈具使用權AI (V4.0.0)"
        version: "V4.0.0"
        title: 頂樓感應已自動恢復
        message: 頂樓感應暫停的 2 小時已到期，感應燈與書房燈恢復自動控制。

# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# - V4.3.9（2026-10-31）：自動風速結合室外溫度（weather.homeweather_zhu_nan_zhen）：①室內比室外熱時體感溫度加成（高出 1°C 以上每 1°C +0.25，上限 +1.0；室外 ≥ 32°C 再 +0.4）；②非夏季模式的整體降檔由固定 10% 改為看室外溫度（< 26°C 降 10%、26～29°C 降 5%、≥ 29°C 不降）。原因：10/31 室內 29°C／濕度 61%／室外 27°C，體感 29.55°C 剛好卡在 60% 門檻（29.6）下方，遲滯讓風量停在 50%，使用者覺得熱；加上室內比室外熱的加成後體感 29.8°C → 60%。
# - V4.2.2（2026-10-23）：依 SOP-20 新增 HA 重啟接手（ha_start）：重啟後 delay 15 秒重新評估環境溫濕度與兒童鎖／風速調節；保護 trigger.to_state is defined。
# - V4.1.5（2026-10-11）：自動調速防抖。原本 t_eff 在 28.3／28.4 等門檻上下 0.1°C 抖動就會讓風量每 15～30 秒大小來回（30 小時 67 次變化、86 次快速反轉）。
#   ① 遲滯：升級要超過門檻 +遲滯（預設 0.3°C）、降級要低於門檻 -遲滯；② 自動調速最短間隔 3 分鐘（timer.living_room_fan_speed_dwell）；
#   ③ 濕度加成改連續線性（>50% 起每 1% +0.05°C，上限 1.5），不再在 50／60／75% 一次跳 0.5°C；④ 曲線下限 20%（風扇最低檔），不再送 10% 指令。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# 導入路徑：configuration/Automations/21A_客廳電風扇整合控制AI.yaml
- alias: 21A_客廳電風扇整合控制AI (V4.2.2)
  id: ai_living_room_fan_integrated_control
  description: "整合溫控、防關閉、夏季模式的雙模式自動化"
  mode: queued
  max: 10

  trigger:
    - platform: state
      entity_id:
        - sensor.kong_qi_qing_jing_ji_temperature
        - sensor.kong_qi_qing_jing_ji_humidity
        - sensor.kitchenm_wen_du
        - sensor.kitchenm_shi_du
      id: sensor_change
      for: "00:00:10"
    - platform: state
      entity_id: fan.ke_ting_dian_feng_shan
      id: fan_change
    - platform: state
      entity_id: fan.ke_ting_dian_feng_shan
      attribute: percentage
      id: fan_speed_change
    - platform: state
      entity_id:
        - input_boolean.living_room_fan_auto_speed_mode
        - input_boolean.living_room_fan_prevent_off_mode
      id: mode_change
    - platform: state
      entity_id: sensor.at_home_kenny_location
      id: location_change
    - platform: homeassistant
      event: start
      id: ha_start

  variables:
    automation_version: "V4.2.2"
    # ---- Modes ----
    auto_speed_mode: "{{ is_state('input_boolean.living_room_fan_auto_speed_mode', 'on') }}"
    prevent_off_mode: "{{ is_state('input_boolean.living_room_fan_prevent_off_mode', 'on') }}"
    summer_mode: "{{ is_state('input_boolean.summer_mode','on') }}"
    snooze_active: "{{ is_state('timer.living_room_fan_light_sync_snooze', 'active') }}"
    speed_snooze_active: "{{ is_state('input_boolean.living_room_fan_manual_speed_snooze', 'on') }}"
    manual_actor_detected: >
      {% set uid = trigger.to_state.context.user_id if (trigger is defined and trigger.to_state is defined and trigger.to_state is not none) else none %}
      {% set pid = trigger.to_state.context.parent_id if (trigger is defined and trigger.to_state is defined and trigger.to_state is not none) else none %}
      {{ (uid is not none) or ((uid is none) and (pid is none)) }}
    light_is_on: "{{ is_state('light.yeelink_color5_4181_light', 'on') }}"

    # ---- Debug & Fan State ----
    debug_notify: "{{ is_state('input_boolean.living_room_fan_debug_notify','on') }}"
    fan_pct_now: "{{ state_attr('fan.ke_ting_dian_feng_shan','percentage') | int(0) }}"

    # ---- Sensor Logic ----
    primary_temp: "{{ states('sensor.kong_qi_qing_jing_ji_temperature') | float(None) }}"
    primary_humidity: "{{ states('sensor.kong_qi_qing_jing_ji_humidity') | float(None) }}"
    primary_valid: >-
      {% set temp_valid = (primary_temp is not none) and (10 < primary_temp < 45) %}
      {% set hum_valid = (primary_humidity is not none) and (0 < primary_humidity <= 100) %}
      {{ temp_valid and hum_valid }}
    fallback_temp: "{{ states('sensor.kitchenm_wen_du') | float(None) }}"
    fallback_humidity: "{{ states('sensor.kitchenm_shi_du') | float(None) }}"
    fallback_valid: >-
      {% set temp_valid = (fallback_temp is not none) and (10 < fallback_temp < 45) %}
      {% set hum_valid = (fallback_humidity is not none) and (0 < fallback_humidity <= 100) %}
      {{ temp_valid and hum_valid }}
    active_temp: "{{ primary_temp if primary_valid else fallback_temp }}"
    active_humidity: "{{ primary_humidity if primary_valid else fallback_humidity }}"
    active_sensor_name: "{{ '空氣清淨機' if primary_valid else ('廚房' if fallback_valid else '無') }}"
    humidity_bonus_c: >-
      {% if active_humidity is none or active_humidity <= 50 %}0
      {% elif active_humidity <= 80 %}{{ ((active_humidity - 50) * 0.05) | round(2) }}
      {% else %}1.5{% endif %}
    # V4.3.9：結合室外溫度。室外溫度取 weather.homeweather_zhu_nan_zhen（竹南鎮）；取不到就不加（out_bonus_c＝0、不做季節降檔）。
    outdoor_temp: "{{ state_attr('weather.homeweather_zhu_nan_zhen','temperature') | float(None) }}"
    # V4.3.10：室外濕度（同一個天氣實體 humidity 屬性）。室外 ≥ 24°C 且相對濕度 > 60% 時，每多 1% 加 0.04°C（上限 +0.6）——外面悶濕時體感散熱差、通風也帶不走熱。
    outdoor_hum: "{{ state_attr('weather.homeweather_zhu_nan_zhen','humidity') | float(None) }}"
    # ① 室內比室外熱（散熱差）：室內高出室外 1°C 以上，每多 1°C 加 0.25°C（上限 +1.0，室內比室外涼很多則最多 -0.5）；② 室外 ≥ 32°C（熱負荷大）再 +0.4
    out_bonus_c: >-
      {%- if outdoor_temp is none or active_temp is none -%}0
      {%- else -%}
        {%- set d = active_temp - outdoor_temp -%}
        {%- set b = [[(d - 1.0) * 0.25, -0.5] | max, 1.0] | min -%}
        {%- if outdoor_temp >= 32 -%}{%- set b = b + 0.4 -%}{%- endif -%}
        {%- if outdoor_hum is not none and outdoor_temp >= 24 and outdoor_hum > 60 -%}{%- set b = b + ([(outdoor_hum - 60) * 0.04, 0.6] | min) -%}{%- endif -%}
        {{- b | round(2) -}}
      {%- endif -%}
    # ③ 非夏季模式原本一律把曲線整體降 10%：改成看室外溫度，室外 < 26°C 降 10%、26～29°C 降 5%、≥ 29°C 不降（室外取不到沿用 10%）
    season_cut: >-
      {% if summer_mode %}0
      {% elif outdoor_temp is none or outdoor_temp < 26 %}10
      {% elif outdoor_temp < 29 %}5
      {% else %}0{% endif %}
    t_eff: >-
      {% if active_temp is not none %}
        {{ active_temp + humidity_bonus_c + out_bonus_c | float(0) }}
      {% else %}
        none
      {% endif %}
    # t_eff 在沒有溫度時會是文字「none」（不是 None），所以改看 active_temp（原本會把「none」丟進 float() 造成每次變數渲染錯誤）
    t_eff_valid: "{{ active_temp is not none }}"
    hyst_c: "{{ states('input_number.living_room_fan_hysteresis_c') | float(0.3) }}"
    # V4.1.5：曲線加遲滯。up＝t_eff 往下偏 hyst 後的目標（要超過門檻 +hyst 才會比它高），down＝往上偏 hyst 後的目標；
    # 目前風量在兩者之間就維持不動；低於 up 才升、高於 down 才降。下限 20%（風扇最低檔）。
    desired_pct_curve: >-
      {% macro curve(t) -%}
        {%- set p = 20 -%}
        {%- if t > 31.3 -%}{%- set p = 100 -%}
        {%- elif t > 30.8 -%}{%- set p = 90 -%}
        {%- elif t > 30.3 -%}{%- set p = 80 -%}
        {%- elif t > 29.8 -%}{%- set p = 70 -%}
        {%- elif t > 29.3 -%}{%- set p = 60 -%}
        {%- elif t > 28.8 -%}{%- set p = 50 -%}
        {%- elif t > 28.3 -%}{%- set p = 40 -%}
        {%- elif t > 27.8 -%}{%- set p = 30 -%}
        {%- endif -%}
        {%- if p != 100 -%}{{ [p - (season_cut | int(10)), 20] | max }}{%- else -%}{{ p }}{%- endif -%}
      {%- endmacro %}
      {% if not t_eff_valid %}{{ fan_pct_now }}
      {% else %}
        {% set t = t_eff | float(0) %}
        {% set up = curve(t - hyst_c) | int(20) %}
        {% set down = curve(t + hyst_c) | int(20) %}
        {% if fan_pct_now < up %}{{ up }}{% elif fan_pct_now > down %}{{ down }}{% else %}{{ fan_pct_now }}{% endif %}
      {% endif %}

  action:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('') == 'ha_start' }}"
      then:
        - delay: "00:00:15"
    - choose:
        # === PRIORITY 1: 防關閉模式的兒童鎖控制 ===
        - conditions:
            - condition: trigger
              id: mode_change
            - "{{ trigger.entity_id == 'input_boolean.living_room_fan_prevent_off_mode' }}"
          sequence:
            - choose:
                - conditions:
                    - "{{ trigger.to_state.state == 'on' }}"
                  sequence:
                    - service: xiaomi_miio_fan.fan_set_child_lock_on
                      target:
                        entity_id: fan.ke_ting_dian_feng_shan
                - conditions:
                    - "{{ trigger.to_state is not none and trigger.to_state.state == 'off' }}"
                  sequence:
                    - service: xiaomi_miio_fan.fan_set_child_lock_off
                      target:
                        entity_id: fan.ke_ting_dian_feng_shan

        # === PRIORITY 2: 手動調速防護罩 ===
        - conditions:
            - condition: trigger
              id: fan_change
            - "{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state == 'off' and trigger.to_state.state == 'on' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.living_room_fan_manual_speed_snooze

        - conditions:
            - condition: trigger
              id: fan_speed_change
            - condition: template
              value_template: >
                {{ trigger.to_state is not none and manual_actor_detected and is_state('input_boolean.living_room_fan_manual_speed_snooze','off') }}
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.living_room_fan_manual_speed_snooze
            - if:
                - "{{ debug_notify }}"
              then:
                - service: script.notify_dispatch
                  data:
                    level: info
                    line: false
                    source: "21A_客廳電風扇整合控制AI (V4.1.5)"
                    version: "{{ automation_version | default('', true) }}"
                    title: "客廳風扇 (Debug)"
                    message: "偵測到人為手動調速，AI 自動調速將暫停至下次開機。"

        # === PRIORITY 3: 手動關閉風扇 ===
        - conditions:
            - condition: trigger
              id: fan_change
            - "{{ trigger.to_state is not none and trigger.to_state.state == 'off' }}"
          sequence:
            - choose:
                - conditions:
                    - "{{ prevent_off_mode }}"
                  sequence:
                    - service: fan.turn_on
                      target:
                        entity_id: fan.ke_ting_dian_feng_shan
                - conditions:
                    - "{{ auto_speed_mode }}"
                    - "{{ summer_mode }}"
                    - "{{ light_is_on }}"
                  sequence:
                    - service: timer.start
                      target:
                        entity_id: timer.living_room_fan_light_sync_snooze
                    - if:
                        - "{{ debug_notify }}"
                      then:
                        - service: script.notify_dispatch
                          data:
                            level: info
                            line: false
                            source: "21A_客廳電風扇整合控制AI (V4.1.5)"
                            version: "{{ automation_version | default('', true) }}"
                            title: "客廳風扇 (Debug)"
                            message: "風扇被手動關閉，已啟動燈光連動暫停 1 小時。"
                    - stop: "Snooze for light-sync started"
                - conditions:
                    - "{{ auto_speed_mode }}"
                  sequence:
                    - stop: "Auto-speed mode allows manual turn off"

        # === PRIORITY 4: 環境與位置變更綜合控制 (打通兒童鎖與溫控回寫鏈結) ===
        - conditions:
            - condition: trigger
              id:
                - sensor_change
                - location_change
                - ha_start
            - "{{ t_eff_valid }}"
          sequence:
            # Sub-Step A: 執行 V3.2.1 動態兒童鎖遲滯控制
            - choose:
                - conditions:
                    - "{{ states('sensor.at_home_kenny_location') in ['客廳', '廚房', '廁所'] or (t_eff | float(0) < 30.0) }}"
                  sequence:
                    - service: xiaomi_miio_fan.fan_set_child_lock_off
                      target:
                        entity_id: fan.ke_ting_dian_feng_shan
                - conditions:
                    - "{{ t_eff | float(0) > 30.5 }}"
                  sequence:
                    - service: xiaomi_miio_fan.fan_set_child_lock_on
                      target:
                        entity_id: fan.ke_ting_dian_feng_shan

            # Sub-Step B: 執行原本的 PRIORITY 5 邏輯（回寫至 input_number 與風速調節）
            - if:
                - condition: template
                  value_template: "{{ t_eff != states('input_number.living_room_effective_apparent_temperature') | float(0) }}"
              then:
                - service: input_number.set_value
                  target:
                    entity_id: input_number.living_room_effective_apparent_temperature
                  data:
                    value: "{{ t_eff }}"
            - if:
                - "{{ auto_speed_mode }}"
                - "{{ is_state('fan.ke_ting_dian_feng_shan', 'on') }}"
                - "{{ not speed_snooze_active }}"
                - "{{ is_state('timer.living_room_fan_speed_dwell', 'idle') }}"
              then:
                - variables:
                    desired_pct: "{{ desired_pct_curve | int }}"
                    need_update: "{{ (desired_pct - fan_pct_now) | abs >= 5 }}"
                - if:
                    - "{{ need_update }}"
                  then:
                    - service: fan.set_percentage
                      target:
                        entity_id: fan.ke_ting_dian_feng_shan
                      data:
                        percentage: "{{ desired_pct }}"
                    - service: timer.start
                      target:
                        entity_id: timer.living_room_fan_speed_dwell
                      data:
                        duration: "{{ ((states('input_number.living_room_fan_min_interval_min') | float(3)) * 60) | int }}"
                    - if:
                        - "{{ debug_notify }}"
                      then:
                        - service: script.notify_dispatch
                          data:
                            level: info
                            line: false
                            source: "21A_客廳電風扇整合控制AI (V4.1.5)"
                            version: "{{ automation_version | default('', true) }}"
                            title: "客廳風扇風速調整 (Debug)"
                            message: >
                              🔄 新風速={{ desired_pct }}%｜體感t_eff={{ '%.1f'|format(t_eff|float) }}°C
                              (來源: {{ active_sensor_name }}｜T={{ '%.1f'|format(active_temp|float) }}°C, H={{ '%.1f'|format(active_humidity|float) }}%)

# ─────────────────────────────────────────────────────────────
# 08-7A自動晚安情境AI (V3.2.0)
# 相容版本：Helpers V3.18.0（已確認）
# 更新紀錄（統一格式）：
# - V3.2.0：功能版；加入 Elay/Jerry/Iris 位置聯合判斷，僅所有在家成員都在就寢/臥室安全區時才自動晚安。
# - V3.1.1：修補版；離家/離家確認中 30 秒重檢後僅在回到二樓主控制區或車庫時取消，避免 Kenny 維持離家時永遠無法執行晚安情境。
# - V3.1.0：功能版；晚安時段延長至 05:00，二樓無人防抖提高至 90 秒，並加入 Location Helper 離家/車庫/二樓控制區安全重檢與取消防禦。
# - V3.0.3：修補版；恢復 21:00 night_check 定時觸發，避免二樓在晚安時段開始前已無人時漏跑晚安情境；保留二樓無人 30 秒與無執行訊息通知。
# - V3.0.2：修補版；移除 21:00 night_check 定時觸發，二樓無人等待改為 30 秒，並取消執行訊息通知。
# - V3.0.1：修補版；補齊二樓坪幕感應綜合判斷 helper 依賴，沿用 AtHome AP MAC 區域判斷邏輯。
# - V3.0：功能版；新增跨夜時間自動晚安情境，於 21:00 後或 03:00 前且二樓無人時執行晚安情境；以單一跨夜 time 條件與晚安 helper off 防止重複觸發。
# ─────────────────────────────────────────────────────────────
- alias: 08-7A自動晚安情境AI (V3.2.0)
  id: ai_08_7a_auto_goodnight_scene
  description: >
    晚間 21:00 後至凌晨 05:00 前，若二樓 AP/人員綜合判定連續 90 秒無人，
    或於 21:00 定時校正時已無人，則自動執行晚安情境。
  mode: single

  triggers:
    - id: second_floor_empty
      platform: state
      entity_id: binary_sensor.er_lou_ping_mu_gan_ying_zong_he_pan_duan
      to: "off"
      for:
        seconds: 90
    - id: night_check
      platform: time
      at: "21:00:00"

  conditions:
    - condition: time
      after: "20:59:59"
      before: "05:00:00"
    - condition: state
      entity_id: binary_sensor.er_lou_ping_mu_gan_ying_zong_he_pan_duan
      state: "off"
    - condition: state
      entity_id: input_boolean.aqara_wan_an
      state: "off"
    - condition: template
      value_template: >-
        {% set members = [
          states('sensor.at_home_kenny_location'),
          states('sensor.at_home_elay_location'),
          states('sensor.at_home_jerry_location'),
          states('sensor.at_home_iris_location')
        ] %}
        {% set invalid = ['unknown', 'unavailable', 'none', ''] %}
        {% set sleep_ok = ['臥室', '主臥', '房間', '就寢', '睡覺', '離家'] %}
        {{ members | reject('in', invalid) | reject('in', sleep_ok) | list | count == 0 }}

  variables:
    automation_version: "V3.2.0"
    helpers_compat: "Helpers V3.18.0"

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.at_home_kenny_location') in ['離家', '離家確認中'] }}"
          sequence:
            - delay: "00:00:30"
            - if:
                - condition: template
                  value_template: "{{ states('sensor.at_home_kenny_location') in ['客廳', '廚房', '廁所', '車庫'] }}"
              then:
                - stop: "Location safety guard cancelled auto goodnight after recheck"
        - conditions:
            - condition: template
              value_template: "{{ states('sensor.at_home_kenny_location') in ['客廳', '廚房', '廁所', '車庫'] }}"
          sequence:
            - stop: "Location safety guard cancelled auto goodnight"
    - service: automation.trigger
      target:
        entity_id: automation.wan_an_qing_jing
      data:
        skip_condition: false

# ─────────────────────────────────────────────────────────────
# 08-7A自動晚安情境AI (V3.4.0)
# 相容版本：Helpers V3.22.0（已確認）
# 更新紀錄（統一格式）：
# - V3.4.0：功能版；新增三樓臥室 10 分鐘觀察機制（解決設備定位誤跳三樓臥室 8 分鐘後離家之 bug）：
#           1. 僅針對「最後一個位置變動的成員」進行三樓臥室判斷。
#           2. 若該成員本來就位於三樓臥室 10 分鐘以上，視為本來就在三樓就寢，直接忽略等待並放行。
#           3. 若該成員剛進入三樓臥室（< 10 分鐘），啟動觀察等待。
#           4. 期間若跳到其他安全臥室（四樓/頂樓）則提早結束等待並執行晚安情境。
#           5. 期間若跳到車庫、離家或活動區，則立即取消執行晚安情境。
#           6. 若持續保持在三樓臥室滿 10 分鐘，則正式執行晚安情境。
# - V3.3.0：功能版；修復 Conditions 過濾邏輯：改用白名單機制，指定安全位置清單（臥室類/離家），排除車庫/客廳/廚房/廁所/離家確認中等「活動中」狀態後才放行。
#           修復 Actions 安全門：改為遍歷所有家庭成員（Kenny/Elay/Jerry/Iris），任一人在活動區即取消晚安，不再僅檢查 Kenny。
# - V3.2.1：修補版（patch a）；小幅校正客廳按鈕防守邏輯。
# - V3.2.0：功能版；加入 Elay/Jerry/Iris 位置聯合判斷，僅所有在家成員都在就寢/臥室安全區時才自動晚安。
# - V3.1.1：修補版；離家/離家確認中 30 秒重檢後僅在回到二樓主控制區或車庫時取消，避免 Kenny 維持離家時永遠無法執行晚安情境。
# - V3.1.0：功能版；晚安時段延長至 05:00，二樓無人防抖提高至 90 秒，並加入 Location Helper 離家/車庫/二樓控制區安全重檢與取消防禦。
# - V3.0.3：修補版；恢復 21:00 night_check 定時觸發，避免二樓在晚安時段開始前已無人時漏跑晚安情境；保留二樓無人 30 秒與無執行訊息通知。
# - V3.0.2：修補版；移除 21:00 night_check 定時觸發，二樓無人等待改為 30 秒，並取消執行訊息通知。
# - V3.0.1：修補版；補齊二樓坪幕感應綜合判斷 helper 依賴，沿用 AtHome AP MAC 區域判斷邏輯。
# - V3.0：功能版；新增跨夜時間自動晚安情境，於 21:00 後或 03:00 前且二樓無人時執行晚安情境；以單一跨夜 time 條件與晚安 helper off 防止重複觸發。
# ─────────────────────────────────────────────────────────────
- alias: 08-7A自動晚安情境AI (V3.4.0)
  id: ai_08_7a_auto_goodnight_scene
  description: >
    晚間 21:00 後至凌晨 05:00 前，若二樓 AP/人員綜合判定連續 90 秒無人，
    或於 21:00 定時校正時已無人，則自動執行晚安情境。
    Conditions 白名單：需所有有效成員均在安全位置（臥室類或離家）才放行。
    Actions 安全門：僅對最後變動者判斷三樓臥室觀察期（已滿 10 分鐘直接放行，未滿 10 分鐘觀察，跳車庫/離家取消，跳其他臥室提前執行）。
  mode: single

  triggers:
    - id: second_floor_empty
      platform: state
      entity_id: binary_sensor.er_lou_ping_mu_gan_ying_zong_he_pan_duan
      to: "off"
      for:
        seconds: 90
    - id: night_check
      platform: time
      at: "21:00:00"

  conditions:
    - condition: time
      after: "20:59:59"
      before: "05:00:00"
    - condition: state
      entity_id: binary_sensor.er_lou_ping_mu_gan_ying_zong_he_pan_duan
      state: "off"
    - condition: state
      entity_id: input_boolean.aqara_wan_an
      state: "off"
    - condition: template
      value_template: >-
        {% set members = [
          states('sensor.at_home_kenny_location'),
          states('sensor.at_home_elay_location'),
          states('sensor.at_home_jerry_location'),
          states('sensor.at_home_iris_location')
        ] %}
        {% set invalid = ['unknown', 'unavailable', 'none', ''] %}
        {% set safe_locations = ['三樓臥室', '四樓Jerry房間', '四樓Elay房間', '頂樓Kenny房間', '離家'] %}
        {# 活動中的位置：車庫/客廳/廚房/廁所/離家確認中 表示不得觸發晚安 #}
        {% set valid_members = members | reject('in', invalid) | list %}
        {# 有效成員大於 0 ，且全部都在安全位置才放行 #}
        {{ valid_members | count > 0 and (valid_members | reject('in', safe_locations) | list | count == 0) }}

  variables:
    automation_version: "V3.4.0"
    helpers_compat: "Helpers V3.22.0"

  actions:
    # 1. 全成員活動位置即時取消（不等待）
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set locs = [
                  states('sensor.at_home_kenny_location'),
                  states('sensor.at_home_elay_location'),
                  states('sensor.at_home_jerry_location'),
                  states('sensor.at_home_iris_location')
                ] %}
                {{ locs | select('in', ['客廳', '廚房', '廁所', '車庫']) | list | count > 0 }}
          sequence:
            - stop: "Location safety guard: active member detected, cancelled auto goodnight"

        # 2. 有人在離家確認中，等 30 秒再重檢（可能是開門回家途中）
        - conditions:
            - condition: template
              value_template: >-
                {% set locs = [
                  states('sensor.at_home_kenny_location'),
                  states('sensor.at_home_elay_location'),
                  states('sensor.at_home_jerry_location'),
                  states('sensor.at_home_iris_location')
                ] %}
                {{ locs | select('in', ['離家確認中']) | list | count > 0 }}
          sequence:
            - delay: "00:00:30"
            - if:
                - condition: template
                  value_template: >-
                    {% set locs = [
                      states('sensor.at_home_kenny_location'),
                      states('sensor.at_home_elay_location'),
                      states('sensor.at_home_jerry_location'),
                      states('sensor.at_home_iris_location')
                    ] %}
                    {{ locs | select('in', ['客廳', '廚房', '廁所', '車庫']) | list | count > 0 }}
              then:
                - stop: "Location safety guard: active member detected after recheck, cancelled auto goodnight"

    # 3. 三樓臥室 10 分鐘觀察期（僅針對最後變動者判斷，若本來就在三樓滿 10 分鐘以上則直接忽略）
    - if:
        - condition: template
          value_template: >-
            {% set m_list = [
              states['sensor.at_home_kenny_location'],
              states['sensor.at_home_elay_location'],
              states['sensor.at_home_jerry_location'],
              states['sensor.at_home_iris_location']
            ] %}
            {% set valid_m = m_list | select('ne', none) | rejectattr('state', 'in', ['unknown', 'unavailable', 'none', '']) | list %}
            {% if valid_m | count > 0 %}
              {% set latest_m = valid_m | sort(attribute='last_changed', reverse=true) | first %}
              {{ (latest_m.state == '三樓臥室') and ((now() - latest_m.last_changed).total_seconds() < 600) }}
            {% else %}
              {{ false }}
            {% endif %}
      then:
        # 等待最多 10 分鐘：期間若跳至其他安全臥室則提前結束等待；若跳至車庫/離家/活動區亦提前結束等待並取消
        - wait_template: >-
            {% set m_list = [
              states['sensor.at_home_kenny_location'],
              states['sensor.at_home_elay_location'],
              states['sensor.at_home_jerry_location'],
              states['sensor.at_home_iris_location']
            ] %}
            {% set valid = m_list | select('ne', none) | rejectattr('state', 'in', ['unknown', 'unavailable', 'none', '']) | list %}
            {% set valid_states = valid | map(attribute='state') | list %}
            {% set other_bedrooms = ['四樓Jerry房間', '四樓Elay房間', '頂樓Kenny房間'] %}
            {% set cancel_locs = ['客廳', '廚房', '廁所', '車庫', '離家', '離家確認中'] %}
            {% set latest_m = valid | sort(attribute='last_changed', reverse=true) | first if valid | count > 0 else none %}
            {# 結束等待條件：
               1. 有人跳到活動/離家區（需取消）
               2. 全員都在其他臥室（可提早執行）
               3. 該名最後變動者在三樓臥室已滿 10 分鐘（就寢成立可執行） #}
            {{ (valid_states | select('in', cancel_locs) | list | count > 0) or
               (valid_states | count > 0 and (valid_states | reject('in', other_bedrooms) | list | count == 0)) or
               (latest_m is not none and latest_m.state == '三樓臥室' and (now() - latest_m.last_changed).total_seconds() >= 600) }}
          timeout: "00:10:00"
          continue_on_timeout: true

        # 觀察期結束後複檢：若跳至車庫/離家/活動區，或二樓有人、晚安已開，則取消
        - if:
            - condition: template
              value_template: >-
                {% set members = [
                  states('sensor.at_home_kenny_location'),
                  states('sensor.at_home_elay_location'),
                  states('sensor.at_home_jerry_location'),
                  states('sensor.at_home_iris_location')
                ] %}
                {% set valid = members | reject('in', ['unknown', 'unavailable', 'none', '']) | list %}
                {% set cancel_locs = ['客廳', '廚房', '廁所', '車庫', '離家', '離家確認中'] %}
                {{ (valid | select('in', cancel_locs) | list | count > 0) or
                   is_state('binary_sensor.er_lou_ping_mu_gan_ying_zong_he_pan_duan', 'on') or
                   is_state('input_boolean.aqara_wan_an', 'on') }}
          then:
            - stop: "3F bedroom observation guard: member jumped to away/active area or scene already active, cancelled auto goodnight"

    # 4. 最終執行晚安情境
    - service: automation.trigger
      target:
        entity_id: automation.wan_an_qing_jing
      data:
        skip_condition: false

# ─────────────────────────────────────────────────────────────
# 08-5G書房燈感應AI (V4.1.2)
# 相容版本：Helpers V4.1.0（已確認）
# 更新紀錄（統一格式）：
# - V4.1.3（2026-10-10）：手機所在 AP 改讀 sensor.kenny_phone_ap_mac；其餘邏輯不變。
# - V4.1.2（2026-10-10）：「書房回房間關燈」加兩道防呆（燈剛亮 10 秒內不處理；08-5J 剛判定 enter_study 10 秒內不處理）。7 天紀錄顯示 10-07 起 60 秒內的書房燈亮了又關幾乎都是此規則造成（進書房時房間側 PIR 跟著觸發）。
# - V4.1.1（2026-10-10）：修正 08-5G 書房回房間關燈的 regex_replace 反斜線（\1 會被 Jinja 當成八進位跳脫，群組參照失效，頂樓人數恆為 0）。
# - V4.1.0（2026-10-09）：項目二升級。全面導入 HA 2026.10 結構化 Trigger by 別名與具名條件拆解。將開燈 15 行複合模板拆解為「熟睡鎖」、「下樓經過」、「影像/AP佐證」獨立具名條件，Traces 圖上一眼看清攔截點；所有 choose 分支補齊別名。
# - V4.0.0：頂樓深夜熟睡鎖（sleep_silent_active）開啟時，書房 PIR 右單獨觸發不再開書房燈，只有跨書房線（08-5J 的 enter_study）才開。
# - V4.0.0：無人檢查改成只看右側（書房）PIR 與攝影機安靜，不再因為 iPhone 在 5F 就延長（去書房拿東西後回臥室，燈會在安靜時間到就關）。
# - V4.0.0：修正「進臥室後書房燈沒關」：①剛判定回臥室／下樓 180 秒內，書房 PIR 右單獨觸發不再開書房燈；②判定回臥室時關閉「感應自己開的」書房燈。
# - V4.0.0：頂樓感應優化 P3 重寫。開燈：08-5J 的 enter_study 或書房 PIR 右（攝影機／iPhone AP 佐證）；關燈：離開書房回房立即關、離開書房下樓保留 3 分鐘、
#           每分鐘無人檢查（PIR 右安靜 5 分鐘＋攝影機無人，且 iPhone 不在 5F 或已回房／下樓才關）、安靜坐著最長 60 分鐘一律關。
# ─────────────────────────────────────────────────────────────
- alias: 08-5G 書房燈感應AI (V4.1.3)
  id: ai_08_5g_study_motion_light
  description: >
    書房燈開燈：08-5J 判定進書房，或書房 PIR 右有動作且攝影機（iPhone 在 5F AP 時放寬到 20 分鐘）近期有人。
    由感應開啟的書房燈標記 topfloor_study_auto。
  mode: queued
  max: 5
  max_exceeded: silent
  variables:
    automation_version: V4.1.3
  triggers:
    - id: enter_study
      alias: "[動線事件] 08-5J判定進入書房 (enter_study)"
      trigger: event
      event_type: topfloor_path
      event_data:
        path: enter_study
    - id: pir_right
      alias: "[動態感應] 書房側PIR(右)偵測活動 (pir_right)"
      trigger: state
      entity_id: binary_sensor.shu_fang_gan_ying_kai_guan_motion_right
      to: "on"
  conditions:
    - condition: state
      alias: "全域感應防護：未處於暫停模式"
      entity_id: input_boolean.topfloor_motion_pause
      state: "off"
    - condition: state
      alias: "書房燈目前為關閉狀態"
      entity_id: switch.shu_fang_deng
      state: "off"
    - condition: or
      alias: "放行檢查：08-5J進書房事件 或 書房側PIR右三重過濾放行"
      conditions:
        # 分支 1: 08-5J 動線進書房事件 (100% 放行)
        - condition: template
          alias: "[放行] 08-5J動線確認進入書房 (enter_study)"
          value_template: "{{ trigger.id == 'enter_study' }}"
        # 分支 2: PIR 右側觸發，需滿足無熟睡鎖、無下樓防經過、且有攝影機/AP在場佐證
        - condition: and
          alias: "[檢查] 書房側PIR(右)觸發之三重過濾檢驗"
          conditions:
            - condition: template
              alias: "[過濾 1] 深夜熟睡鎖未開啟 (sleep_silent_active == off)"
              value_template: "{{ not is_state('input_boolean.sleep_silent_active', 'on') }}"
            - condition: template
              alias: "[過濾 2] 非剛下樓180秒經過 (not just_passed down)"
              value_template: >-
                {% set lp = states('input_text.topfloor_last_path') | string %}
                {% set lp_name = lp.split('|')[0] if '|' in lp else '' %}
                {% set lp_age = now().timestamp() - ((lp.split('|')[1] | float(0)) if '|' in lp else 0) %}
                {{ not (lp_name in ['down', 'down_start'] and lp_age < 180) }}
            - condition: template
              alias: "[過濾 3] 影像或5F AP在場佐證 (cam_age ≤ 120s 或 5F AP 20分)"
              value_template: >-
                {% set cam_age = now().timestamp() - as_timestamp(states('input_datetime.topfloor_cam_last_on'), 0) %}
                {% set s = states('input_text.iphone_tracker_entity_kenny') %}
                {% set ent = 'device_tracker.iphone_17_pro_max_kenny' if s in ['unknown','unavailable',''] else s %}
                {% set ap = states('sensor.kenny_phone_ap_mac') %}
                {% set raw = states('input_text.topfloor_ap_macs_5f') %}
                {% set lst = ('70:a7:41:e4:54:1f,70:a7:41:e4:5a:bf,d0:21:f9:f2:fc:4c' if raw in ['unknown','unavailable',''] else raw) | lower | replace(' ','') | replace(';',',') | regex_findall('[^,]+') %}
                {{ cam_age <= 120 or (ap in lst and cam_age <= 1200) }}
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.topfloor_study_auto
    - action: switch.turn_on
      target:
        entity_id: switch.shu_fang_deng

- alias: 08-5G 書房燈關閉AI (V4.1.3)
  id: ai_08_5g_study_light_off_v4
  description: 離開書房回臥室立即關；離開書房下樓保留 3 分鐘後關；再次進書房取消
  mode: restart
  max_exceeded: silent
  variables:
    automation_version: V4.1.3
  triggers:
    - id: to_bedroom
      alias: "[動線事件] 離開書房回臥室 (leave_study_bedroom)"
      trigger: event
      event_type: topfloor_path
      event_data:
        path: leave_study_bedroom
    - id: to_down
      alias: "[動線事件] 離開書房準備下樓 (leave_study_down)"
      trigger: event
      event_type: topfloor_path
      event_data:
        path: leave_study_down
    - id: back
      alias: "[動線事件] 再次返回進入書房 (enter_study)"
      trigger: event
      event_type: topfloor_path
      event_data:
        path: enter_study
  conditions:
    - condition: state
      alias: "全域感應防護：未處於暫停模式"
      entity_id: input_boolean.topfloor_motion_pause
      state: "off"
  actions:
    - choose:
        - alias: "分支 1：又進書房，取消延遲關燈"
          conditions: "{{ trigger.id == 'back' }}"
          sequence:
            - stop: "又進書房，取消延遲關燈"
        # 回臥室：只關「感應自己開的」書房燈（手動開的不動）
        - alias: "分支 2：回臥室，若非感應開燈則略過"
          conditions: "{{ trigger.id == 'to_bedroom' and not is_state('input_boolean.topfloor_study_auto', 'on') }}"
          sequence:
            - stop: "書房燈不是感應開的，回臥室不處理"
        - alias: "分支 3：準備下樓，倒數 3 分鐘緩衝關燈"
          conditions: "{{ trigger.id == 'to_down' }}"
          sequence:
            - delay:
                minutes: "{{ states('input_number.topfloor_study_leave_down_min') | int(3) }}"
    - action: switch.turn_off
      target:
        entity_id: switch.shu_fang_deng
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.topfloor_study_auto

- alias: 08-5G 書房燈無人檢查AI (V4.1.3)
  id: ai_08_5g_study_vacancy_check
  description: >
    每分鐘檢查書房燈：右側（書房）PIR 安靜超過「書房無人判定」分鐘數、攝影機同樣時間內無人、同樣時間內沒有進書房 → 關。
    不再看 iPhone 是否在 5F（臥室與書房同在 5F，分不出來，會讓燈撐很久）；右側（書房）感應器安靜＝你已離開書房。
  mode: single
  triggers:
    - trigger: time_pattern
      alias: "[定時輪詢] 每分鐘檢查書房無人狀態"
      minutes: "/1"
  conditions:
    - condition: state
      alias: "前置條件：書房燈當前處於開啟狀態"
      entity_id: switch.shu_fang_deng
      state: "on"
    - condition: state
      alias: "全域感應防護：未處於暫停模式"
      entity_id: input_boolean.topfloor_motion_pause
      state: "off"
  actions:
    - variables:
        now_ts: "{{ now().timestamp() }}"
        quiet_min: >-
          {{ 0 if is_state('binary_sensor.shu_fang_gan_ying_kai_guan_motion_right', 'on')
             else ((now_ts - as_timestamp(states('input_datetime.topfloor_pir_right_last'), 0)) / 60) | round(1) }}
        cam_min: "{{ ((now_ts - as_timestamp(states('input_datetime.topfloor_cam_last_on'), 0)) / 60) | round(1) }}"
        enter_min: "{{ ((now_ts - as_timestamp(states('input_datetime.topfloor_path_enter_study'), 0)) / 60) | round(1) }}"
        enter_ts: "{{ as_timestamp(states('input_datetime.topfloor_path_enter_study'), 0) }}"
        left_after_enter: >-
          {{ as_timestamp(states('input_datetime.topfloor_path_bedroom'), 0) > enter_ts
             or as_timestamp(states('input_datetime.topfloor_path_down'), 0) > enter_ts
             or as_timestamp(states('input_datetime.topfloor_study_last_exited'), 0) > enter_ts }}
        iphone_5f: >-
          {% set s = states('input_text.iphone_tracker_entity_kenny') %}
          {% set ent = 'device_tracker.iphone_17_pro_max_kenny' if s in ['unknown','unavailable',''] else s %}
          {% set ap = states('sensor.kenny_phone_ap_mac') %}
          {% set raw = states('input_text.topfloor_ap_macs_5f') %}
          {% set lst = ('70:a7:41:e4:54:1f,70:a7:41:e4:5a:bf,d0:21:f9:f2:fc:4c' if raw in ['unknown','unavailable',''] else raw) | lower | replace(' ','') | replace(';',',') | regex_findall('[^,]+') %}
          {{ ap in lst }}
        max_min: "{{ states('input_number.topfloor_study_max_min') | int(60) }}"
        vac_min: "{{ states('input_number.topfloor_study_vacancy_min') | int(5) }}"
    - choose:
        # 上限：PIR 右已安靜超過上限 → 一律關
        - alias: "分支 1：保底上限（PIR右安靜 ≥ 60分鐘一律關燈）"
          conditions: "{{ quiet_min | float >= max_min | float }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.shu_fang_deng
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.topfloor_study_auto
            - action: counter.increment
              target:
                entity_id: counter.topfloor_study_max_off
              continue_on_error: true
            - action: logbook.log
              data:
                name: 頂樓動線
                message: "{{ now().strftime('%H:%M:%S') }} 書房燈 {{ max_min }} 分鐘沒有動作，已關閉（上限）"
              continue_on_error: true
        # 無人：PIR 右安靜、攝影機無人、剛才沒有進書房，且 iPhone 不在 5F 或已離開書房
        - alias: "分支 2：無人清空（PIR右安靜、攝影機無人、無進書房 ≥ 5分鐘關燈）"
          conditions: >-
            {{ quiet_min | float >= vac_min | float and cam_min | float >= vac_min | float
               and enter_min | float >= vac_min | float }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.shu_fang_deng
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.topfloor_study_auto
            - action: logbook.log
              data:
                name: 頂樓動線
                message: "{{ now().strftime('%H:%M:%S') }} 書房燈判定無人（PIR 右安靜 {{ quiet_min }} 分鐘、攝影機 {{ cam_min }} 分鐘無人），已關閉"
              continue_on_error: true

- alias: 08-5G 書房回房間關燈AI (V4.1.3)
  id: ai_08_5g_study_to_room_off
  description: >
    左側（房間）感應器觸發且是「走進房間」（剛上樓，或 120 秒內右側／書房先觸發）→ 關書房燈，並依「抵達後關樓梯燈延遲」關樓梯燈（只關感應開的）。
    頂樓同時有 2 位以上家人（家人位置感測）時不動作，避免別人還在書房。
  mode: restart
  max_exceeded: silent
  triggers:
    - id: pir_left
      alias: "[動態感應] 書房房間側PIR(左)觸發"
      trigger: state
      entity_id: binary_sensor.shu_fang_gan_ying_kai_guan_motion_left
      to: "on"
  conditions:
    - condition: state
      alias: "全域感應防護：未處於暫停模式"
      entity_id: input_boolean.topfloor_motion_pause
      state: "off"
    - condition: template
      alias: "多方驗證：頂樓少於2位家人 且 判定為由外走入房間"
      value_template: >-
        {% set people = ['kenny', 'jerry', 'iris', 'elay']
             | map('regex_replace', '^(.*)$', 'sensor.at_home_\\1_location')
             | map('states') | select('match', '頂樓') | list | length %}
        {% set now_ts = now().timestamp() %}
        {% set right_age = now_ts - as_timestamp(states('input_datetime.topfloor_pir_right_last'), 0) %}
        {% set lp = states('input_text.topfloor_last_path') | string %}
        {% set arrived = lp.split('|')[0] == 'arrive_up' and (now_ts - ((lp.split('|')[1] | float(0)) if '|' in lp else 0)) <= 120 %}
        {{ people < 2 and (right_age <= 120 or arrived) }}
    - condition: template
      alias: "防呆 1：書房燈剛亮 10 秒內不處理（剛進書房，房間側 PIR 會跟著觸發）"
      value_template: >-
        {{ is_state('switch.shu_fang_deng', 'off')
           or (as_timestamp(now()) - as_timestamp(states.switch.shu_fang_deng.last_changed, 0)) >= 10 }}
    - condition: template
      alias: "防呆 2：08-5J 剛判定 enter_study 10 秒內不處理（人還在進書房的動線上）"
      value_template: >-
        {% set lp = states('input_text.topfloor_last_path') | string %}
        {% set name = lp.split('|')[0] if '|' in lp else '' %}
        {% set age = (as_timestamp(now()) - ((lp.split('|')[1] | float(0)) if '|' in lp else 0)) %}
        {{ not (name == 'enter_study' and age < 10) }}
  actions:
    - variables:
        trig_ts: "{{ now().timestamp() }}"
    - if:
        - condition: template
          alias: "書房燈目前亮著：立即關燈"
          value_template: "{{ is_state('switch.shu_fang_deng', 'on') }}"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.shu_fang_deng
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.topfloor_study_auto
        - action: logbook.log
          data:
            name: 頂樓動線
            message: "{{ now().strftime('%H:%M:%S') }} 房間（左）感應器觸發，已關書房燈"
          continue_on_error: true
    - action: timer.start
      target:
        entity_id: timer.topfloor_room_arrived
    - delay:
        seconds: "{{ [states('input_number.topfloor_arrive_off_delay_s') | int(5), 4] | max }}"
    # 延遲期間右側（書房側）又有動靜＝其實是在往外走（左→右），不關樓梯燈
    - condition: template
      alias: "防呆檢查：延遲期間書房側PIR右無新動態 (非往外走動線)"
      value_template: >-
        {{ not is_state('binary_sensor.shu_fang_gan_ying_kai_guan_motion_right', 'on')
           and as_timestamp(states('input_datetime.topfloor_pir_right_last'), 0) <= trig_ts }}
    - action: script.topfloor_stairs_off_one
      data:
        key: "0fb7"
    - delay: "00:00:01"
    - action: script.topfloor_stairs_off_one
      data:
        key: "13b8"
    - delay: "00:00:02"
    - action: script.topfloor_kandeng_off_if_auto

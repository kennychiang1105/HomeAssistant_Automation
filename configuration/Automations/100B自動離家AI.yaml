# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# ─────────────────────────────────────────────────────────────
# 100B自動離家AI (V4.2.2)
# 相容版本：Helpers V3.17（已確認）
# 更新紀錄（統一格式）：
# - V4.2.2（2026-10-23）：依 SOP-20 新增 HA 重啟接手（ha_start）：重啟後 delay 4 分 10 秒重新檢查「全員不在家＋離家情境未開（或剛開過未滿 3 分鐘）」，成立才接續執行離家情境。
# - V4.2.0（2026-10-22）：修正範本／person 重新載入後重複發離家通知：離家情境（aqara_li_jia）已經開著超過 3 分鐘就不再重發（重載時 at_home_*_location 短暫 unavailable，4 分 10 秒計時重新開始）。
# - V4.1.6（2026-10-13）：離家時「門鎖／鐵門有未上鎖或未關」通知改成說清楚是哪一個（鐵門開著、或二樓門鎖同步開關顯示未上鎖）與狀態更新時間，等級維持緊急。（2026-10-13 誤報原因：二樓門鎖同步開關的 on／off 設定相反，已由使用者修正。）
# - V4.1.6（2026-10-12）：修正離家通知整個漏掉：鐵門正在關（closing）時觸發，原本兩個通知條件一個要「已關」、一個要「開著」都不成立，什麼都沒發（2026-10-12 08:09:57 觸發、08:10:05 鐵門才關好）。現在先等鐵門停下來（最多 90 秒）再判斷，並新增預設分支：兩個條件都不成立時仍發一般級離家通知。
# - V4.1.6（2026-10-18）：離家通知（HA＋LINE 各分支）最後附「戶外狀況」：天氣、紫外線、空氣品質，異常（紫外線高、AQI>100、降雨、高低溫、強風）附提醒（sensor.leave_outdoor_brief）。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.4.1：修補版。替換 3 處 4-byte Emoji（U+1FAA7、U+1F3E0 兩處）為 ASCII 文字符號，
#   避免 LINE 推送時 JSON 序列化失敗（surrogates not allowed）。
# - V3.4.0：功能版；離家判斷改由 sensor.at_home_XXX_location 中文狀態驅動，所有家庭成員皆為「離家」滿 4 分 10 秒後才執行離家網關與保全切換。
# - V3.3.1：修復 LINE 通知標題版本與編號顯示問題；統一移除「100B」顯示並改以 automation_version 動態帶入版本。
# - V3.3：完整通知新增「本次已自動切換為離家情境」強調文案，僅在原先非離家且切換成功時顯示。
# - V3.2：網關非離家時改為切換成功後續行完整門窗安全檢查流程，移除簡短成功通知，統一送出含門鎖電量摘要的詳細狀態通知。
# - V3.1：LINE 通知等級調整（一般→重要、緊急維持緊急且強制檢查開關）；新增「網關未離家時僅通知一次」邏輯，並顯示已自動切換離家情境與目前情境。
# - V3.0：統一命名規範、欄位標準化與通知標題版本同步。
# ─────────────────────────────────────────────────────────────
- alias: 100B自動離家AI (V4.2.2)
  id: ai_auto_leave_system
  description: "AI離家 V3.4.1"
  mode: single

  triggers:
    - id: all_locations_away
      platform: template
      value_template: >-
        {{ states('sensor.at_home_kenny_location') == '離家'
           and states('sensor.at_home_elay_location') == '離家'
           and states('sensor.at_home_jerry_location') == '離家'
           and states('sensor.at_home_iris_location') == '離家' }}
      for:
        minutes: 4
        seconds: 10
    - id: ha_start
      platform: homeassistant
      event: start

  conditions:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ trigger.id | default('') == 'ha_start' }}"
        - condition: and
          conditions:
            # V4.2.0：離家情境已經開著超過 3 分鐘就不再重發離家通知。
            - condition: template
              value_template: >-
                {{ not is_state('input_boolean.aqara_li_jia', 'on')
                   or (now() - states.input_boolean.aqara_li_jia.last_changed).total_seconds() < 180 }}
            - condition: template
              value_template: >-
                {{ states('sensor.at_home_kenny_location') == '離家'
                   and states('sensor.at_home_elay_location') == '離家'
                   and states('sensor.at_home_jerry_location') == '離家'
                   and states('sensor.at_home_iris_location') == '離家' }}

  variables:
    automation_version: "V4.2.2"
    helpers_compat: "Helpers V3.17"
    notif_title_base: "【AI離家系統 {{ automation_version }}】"
    notif_title_general: >-
      {% set title = states('input_text.notif_title_100b_general') %}
      {% set clean = title|regex_replace('100B','')|trim %}
      {{ clean if clean and clean|lower not in ['unknown','unavailable','none'] else '【AI離家系統 ' ~ automation_version ~ '】' }}
    notif_title_urgent: >-
      {% set title = states('input_text.notif_title_100b_urgent') %}
      {% set clean = title|regex_replace('100B','')|trim %}
      {{ clean if clean and clean|lower not in ['unknown','unavailable','none'] else '【AI離家系統 ' ~ automation_version ~ '】' }}
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"
    notif_title_only_general: >-
      {{ (notif_title_general if notif_title_general|trim else notif_title_base) }}
    notif_title_only_urgent: >-
      {{ (notif_title_urgent if notif_title_urgent|trim else notif_title_base) }}
    notif_heading_general: >-
      {% set heading = notif_title_general if notif_title_general|trim else notif_title_base %}
      {{ heading ~ '\n一般 General [*]' }}
    notif_heading_urgent: >-
      {% set heading = notif_title_urgent if notif_title_urgent|trim else notif_title_base %}
      {{ heading ~ '\n緊急 Urgent ‼️' }}
    notif_title_only_general_safe: >-
      {{ notif_title_only_general|default(notif_title_base, true)|string }}
    notif_title_only_urgent_safe: >-
      {{ notif_title_only_urgent|default(notif_title_base, true)|string }}

    debounce_sec: 120
    debounce_ok: >-
      {% set last = state_attr(this.entity_id, 'last_triggered') %}
      {% set delta = (as_timestamp(now()) - as_timestamp(last)) if last else 999999 %}
      {{ delta > debounce_sec }}

    arm_away_timeout_sec: 5

    aqara_zai_jia_on: "{{ is_state('input_boolean.aqara_zai_jia','on') | bool }}"
    aqara_wan_an_on: "{{ is_state('input_boolean.aqara_wan_an','on') | bool }}"
    aqara_li_jia_on: "{{ is_state('input_boolean.aqara_li_jia','on') | bool }}"
    aqara_guan_bi_on: "{{ is_state('input_boolean.aqara_guan_bi','on') | bool }}"
    aqara_chu_fa_on: "{{ is_state('input_boolean.aqara_chu_fa','on') | bool }}"
    aqara_scene_label_helper_raw: "{{ states('sensor.aqaradang_qian_qing_jing')|string }}"
    aqara_scene_label_attr_raw: "{{ state_attr('sensor.aqaradang_qian_qing_jing','active_labels')|string }}"
    aqara_scene_label_helper: >-
      {% set label = aqara_scene_label_helper_raw|trim %}
      {% set invalids = ['unknown','unavailable','none','null','', None, 'None', '未設定情境'] %}
      {% if label|lower in invalids %}
        {{ '' }}
      {% else %}
        {{ label }}
      {% endif %}
    aqara_scene_label_attr: >-
      {% set label = aqara_scene_label_attr_raw|trim %}
      {% set invalids = ['unknown','unavailable','none','null','', None, 'None'] %}
      {% if label|lower in invalids %}
        {{ '' }}
      {% else %}
        {{ label }}
      {% endif %}
    aqara_state_label: >-
      {% if is_state('input_boolean.aqara_li_jia','on') %}離家情境
      {% elif is_state('input_boolean.aqara_wan_an','on') %}晚安情境
      {% elif is_state('input_boolean.aqara_zai_jia','on') %}在家情境
      {% elif is_state('input_boolean.aqara_guan_bi','on') %}網關解除情境
      {% elif is_state('input_boolean.aqara_chu_fa','on') %}網關觸發情境
      {% else %}情境未知{% endif %}
    aqara_active_labels: >-
      {% set labels = [] %}
      {% if is_state('input_boolean.aqara_zai_jia','on') %}
        {% set labels = labels + ['在家情境'] %}
      {% endif %}
      {% if is_state('input_boolean.aqara_wan_an','on') %}
        {% set labels = labels + ['晚安情境'] %}
      {% endif %}
      {% if is_state('input_boolean.aqara_li_jia','on') %}
        {% set labels = labels + ['離家情境'] %}
      {% endif %}
      {% if is_state('input_boolean.aqara_guan_bi','on') %}
        {% set labels = labels + ['網關解除情境'] %}
      {% endif %}
      {% if is_state('input_boolean.aqara_chu_fa','on') %}
        {% set labels = labels + ['網關觸發情境'] %}
      {% endif %}
      {{ labels|join('、') if labels else '' }}
    aqara_scene_label_safe: >-
      {% if aqara_scene_label_helper|trim %}{{ aqara_scene_label_helper|trim }}
      {% elif aqara_scene_label_attr|trim %}{{ aqara_scene_label_attr|trim }}
      {% elif aqara_active_labels|trim %}{{ aqara_active_labels|trim }}
      {% else %}{{ aqara_state_label }}{% endif %}
    aqara_is_away: "{{ aqara_li_jia_on }}"

    # V4.1.6：離家時「門鎖／鐵門有未上鎖或未關」通知要說清楚是哪一個、狀態多久沒更新（二樓門鎖同步開關可能停在舊狀態）
    lock_sync_on: "{{ is_state('input_boolean.er_lou_men_suo_tong_bu_kai_guan', 'on') }}"
    lock_age_h: "{{ ((now() - states.input_boolean.er_lou_men_suo_tong_bu_kai_guan.last_changed).total_seconds() / 3600) | round(1) }}"
    garage_is_open: "{{ is_state('cover.garage', 'open') }}"
    unsafe_detail: >-
      {% set p = [] %}
      {% if garage_is_open %}{% set p = p + ['車庫鐵門：開著'] %}{% endif %}
      {% if lock_sync_on %}{% set p = p + ['二樓門鎖同步開關：顯示未上鎖（' ~ lock_age_h ~ ' 小時前更新）'] %}{% endif %}
      {{ p | join('；') if p else '請確認鐵門與二樓門鎖狀況！' }}
    unsafe_level: emergency

    doorlock_batt: "{{ states('sensor.ke_ting_men_suo_dian_liang_guo_lu')|float(-1) }}"
    batt_valid: "{{ doorlock_batt >= 0 }}"
    batt50: "{{ batt_valid and doorlock_batt < 50 }}"
    batt10: "{{ batt_valid and doorlock_batt < 10 }}"
    batt0: "{{ batt_valid and doorlock_batt < 1 }}"
    batt_line_text: >-
      {% set txt = states('sensor.batt_line_text') %}
      {% set invalids = ['unknown','unavailable','none','None'] %}
      {{ txt if txt|trim and txt|lower not in invalids else '門鎖電量摘要：\n• 資料暫無（gateway 尚未回報）' }}
    batt_line_text_line: >-
      {{ (batt_line_text|replace('\\n','\n')) if batt_line_text|default('')|trim else '' }}
    # V4.1.6：出門前戶外狀況（天氣、紫外線、空氣品質，異常附提醒），附在離家通知最後
    outdoor_brief: "{{ state_attr('sensor.leave_outdoor_brief', 'text') or '' }}"
    batt_line_text_line_safe: >-
      {{ batt_line_text_line|default('', true)|string }}
    title_fallback_line: "【AI離家系統 {{ automation_version }}】"

  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('') == 'ha_start' }}"
      then:
        - delay: "00:04:10"
        - if:
            - condition: template
              value_template: >-
                {{ (not is_state('input_boolean.aqara_li_jia', 'on')
                    or (now() - states.input_boolean.aqara_li_jia.last_changed).total_seconds() < 180)
                   and states('sensor.at_home_kenny_location') == '離家'
                   and states('sensor.at_home_elay_location') == '離家'
                   and states('sensor.at_home_jerry_location') == '離家'
                   and states('sensor.at_home_iris_location') == '離家' }}
          then:
            - action: logbook.log
              data:
                name: 100B自動離家AI
                message: "HA 重啟後接續：全員離家條件成立，接續執行離家情境"
          else:
            - stop: "HA 重啟接手：條件不符或離家情境已超過 3 分鐘，跳過離家執行"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not debounce_ok }}"
          sequence:
            - stop: "防抖中（{{ debounce_sec }} 秒內重複觸發）—已跳過通知"

    - event: ai_leave_confirmed
      event_data:
        who: kenny
        reason: "ai_auto_leave_system conditions passed — {{ automation_version }} / {{ helpers_compat }}"

    # 若尚未離家情境 → 先嘗試切換離家；若失敗才發送緊急通知
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not is_state('input_boolean.aqara_li_jia','on') }}"
          sequence:
            - service: automation.trigger
              target:
                entity_id: automation.101li_jia_qing_jing
              data: {skip_condition: true}
            - wait_template: >
                {{ is_state('input_boolean.aqara_li_jia','on') }}
              timeout: "00:00:{{ arm_away_timeout_sec }}"
              continue_on_timeout: true
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.aqara_li_jia','on') }}"
                  sequence:
                    - service: script.notify_dispatch
                      data:
                        level: emergency
                        line: false
                        source: "100B自動離家AI (V4.2.0)"
                        version: "{{ automation_version | default('', true) }}"
                        title: "{{ notif_title_urgent }}"
                        message: |-
                          ⚠️ 已判定離家，但保全系統未成功設定外出模式。
                          目前情境：{{ aqara_scene_label_safe }}
                    - if:
                        - condition: state
                          entity_id: input_boolean.notify_line_emergency_enable
                          state: "on"
                      then:
                        - service: script.send_line_to_user
                          data:
                            source: "100B自動離家AI (V4.2.0)"
                            user_id: "{{ line_bot_target_user_id }}"
                            payload: >-
                              {% set base = title_fallback_line %}
                              {% set title_raw = states('input_text.notif_title_100b_urgent') %}
                              {% set title_clean = title_raw|regex_replace('100B','')|trim %}
                              {% set title_safe = title_clean if title_clean and title_clean|lower not in ['unknown','unavailable','none'] else base %}
                              {% set batt_txt = states('sensor.batt_line_text') %}
                              {% set batt_safe = (batt_txt|replace('\\n','\n')) if batt_txt|trim and batt_txt|lower not in ['unknown','unavailable','none'] else '' %}
                              {% set scene_raw = states('sensor.aqaradang_qian_qing_jing')|string %}
                              {% set scene = scene_raw|trim %}
                              {% set invalids = ['unknown','unavailable','none','null','', None, 'None'] %}
                              {% set scene_safe = scene if scene|lower not in invalids else aqara_state_label %}
                              {% set messages = [
                                {"type":"text","text": title_safe},
                                {"type":"text","text": '緊急 Urgent ‼️'},
                                {"type":"text","text": (
                                  '⚠️ 已判定離家並嘗試執行離家情境，'
                                  ~ "\n但 Aqara 網關未成功設定離家模式。"
                                  ~ "\n目前情境：" ~ scene_safe
                                )}
                              ] %}
                              {% if batt_safe|trim %}
                                {% set messages = messages + [{"type":"text","text": batt_safe}] %}
                              {% endif %}
                              {% set ob = outdoor_brief | trim %}{% if ob %}{% set messages = messages + [{"type":"text","text": ob}] %}{% endif %}{{ messages | tojson }}

    # V4.1.6：鐵門正在開／關（opening／closing）時，下面兩個通知條件都不成立（一個要「已關」、一個要「開著」），離家通知整個漏掉；
    # 先等鐵門停下來（最多 90 秒），再判斷通知內容。
    - wait_template: "{{ states('cover.garage') in ['open', 'closed'] }}"
      timeout: "00:01:30"
      continue_on_timeout: true

    - choose:
        - conditions:
            - condition: and
              conditions:
                - condition: state
                  entity_id: cover.garage
                  state: closed
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: input_boolean.er_lou_men_suo_tong_bu_kai_guan
                      state: "off"
                    - condition: template
                      value_template: "{{ batt0 }}"
                - condition: state
                  entity_id: input_boolean.aqara_li_jia
                  state: "on"
          sequence:
            - service: script.notify_dispatch
              data:
                level: general
                line: false
                source: "100B自動離家AI (V4.2.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "{{ notif_title_general|default(notif_title_base, true) }}"
                message: |-
                  [離家] 系統偵測所有人已離家。
                  • 家電皆為關閉，門鎖皆已上鎖。
                  • 已啟動離家模式。
                  {% if (not aqara_li_jia_on) and is_state('input_boolean.aqara_li_jia','on') %}• 本次已自動切換為離家情境（切換成功）。{% endif %}
                  {{ batt_line_text_line }}

                  {{ outdoor_brief }}
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_important_enable
                  state: "on"
              then:
                - service: script.send_line_to_user
                  data:
                    source: "100B自動離家AI (V4.2.0)"
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: >-
                      {% set base = title_fallback_line %}
                      {% set title_raw = states('input_text.notif_title_100b_general') %}
                      {% set title_clean = title_raw|regex_replace('100B','')|trim %}
                      {% set title_safe = title_clean if title_clean and title_clean|lower not in ['unknown','unavailable','none'] else base %}
                      {% set batt_txt = states('sensor.batt_line_text') %}
                      {% set batt_safe = (batt_txt|replace('\\n','\n')) if batt_txt|trim and batt_txt|lower not in ['unknown','unavailable','none'] else '' %}
                      {% set scene_raw = states('sensor.aqaradang_qian_qing_jing')|string %}
                      {% set scene = scene_raw|trim %}
                      {% set invalids = ['unknown','unavailable','none','null','', None, 'None'] %}
                      {% set scene_safe = scene if scene|lower not in invalids else aqara_state_label %}
                      {% set messages = [
                        {"type":"text","text": title_safe},
                        {"type":"text","text": '重要 Important ⚠️'},
                        {"type":"text","text": (
                         '[離家] 系統偵測所有人已離家。'
                          ~ "\n• 家電皆為關閉，門鎖皆已上鎖。"
                          ~ "\n• 已啟動離家模式。"
                          ~ ("\n• 本次已自動切換為離家情境（切換成功）。" if (not aqara_li_jia_on) and is_state('input_boolean.aqara_li_jia','on') else "")
                          ~ "\n目前情境：" ~ scene_safe
                        )}
                      ] %}
                      {% if batt_safe|trim %}
                        {% set messages = messages + [{"type":"text","text": batt_safe}] %}
                      {% endif %}
                      {% set ob = outdoor_brief | trim %}{% if ob %}{% set messages = messages + [{"type":"text","text": ob}] %}{% endif %}{{ messages | tojson }}

        - conditions:
            - condition: and
              conditions:
                - condition: template
                  value_template: >-
                    {% set garage_open = is_state('cover.garage','open') %}
                    {% set lock_on = is_state('input_boolean.er_lou_men_suo_tong_bu_kai_guan','on') %}
                    {{ garage_open or (lock_on and (not batt0)) }}
                - condition: state
                  entity_id: input_boolean.aqara_li_jia
                  state: "on"
          sequence:
            - service: script.notify_dispatch
              data:
                level: "{{ unsafe_level }}"
                line: false
                source: "100B自動離家AI (V4.2.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "{{ notif_title_urgent|default(notif_title_base, true) }}"
                message: |-
                  ⚠️ 系統偵測所有人已離家，但門鎖/車庫有未上鎖或未關狀態。
                  {{ unsafe_detail }}
                  {% if (not aqara_li_jia_on) and is_state('input_boolean.aqara_li_jia','on') %}• 本次已自動切換為離家情境（切換成功）。{% endif %}
            - if:
                - condition: template
                  value_template: "{{ is_state('input_boolean.notify_line_' ~ unsafe_level ~ '_enable', 'on') }}"
              then:
                - service: script.send_line_to_user
                  data:
                    source: "100B自動離家AI (V4.2.0)"
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: >-
                      {% set base = title_fallback_line %}
                      {% set title_raw = states('input_text.notif_title_100b_urgent') %}
                      {% set title_clean = title_raw|regex_replace('100B','')|trim %}
                      {% set title_safe = title_clean if title_clean and title_clean|lower not in ['unknown','unavailable','none'] else base %}
                      {% set batt_txt = states('sensor.batt_line_text') %}
                      {% set batt_safe = (batt_txt|replace('\\n','\n')) if batt_txt|trim and batt_txt|lower not in ['unknown','unavailable','none'] else '' %}
                      {% set scene_raw = states('sensor.aqaradang_qian_qing_jing')|string %}
                      {% set scene = scene_raw|trim %}
                      {% set invalids = ['unknown','unavailable','none','null','', None, 'None'] %}
                      {% set scene_safe = scene if scene|lower not in invalids else aqara_state_label %}
                      {% set messages = [
                        {"type":"text","text": title_safe},
                        {"type":"text","text": ('重要 Important ⚠️' if unsafe_level == 'important' else '緊急 Urgent ‼️')},
                        {"type":"text","text": (
                          '⚠️ 系統偵測所有人已離家，但門鎖/車庫有未上鎖或未關狀態。'
                          ~ "\n" ~ unsafe_detail
                          ~ ("\n• 本次已自動切換為離家情境（切換成功）。" if (not aqara_li_jia_on) and is_state('input_boolean.aqara_li_jia','on') else "")
                          ~ "\n目前情境：" ~ scene_safe
                        )}
                      ] %}
                      {% if batt_safe|trim %}
                        {% set messages = messages + [{"type":"text","text": batt_safe}] %}
                      {% endif %}
                      {% set ob = outdoor_brief | trim %}{% if ob %}{% set messages = messages + [{"type":"text","text": ob}] %}{% endif %}{{ messages | tojson }}

      # V4.1.6：前兩個條件都沒成立（鐵門狀態不明／等不到停下來、網關不是離家情境…）時也要有離家通知，不能整個靜默。
      default:
        # 網關沒切成離家時，前面已經發過緊急通知，不重複發
        - if:
            - condition: state
              entity_id: input_boolean.aqara_li_jia
              state: "on"
          then:
            - service: script.notify_dispatch
              data:
                level: general
                line: true
                source: "100B自動離家AI (V4.2.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "{{ notif_title_general|default(notif_title_base, true) }}"
                message: |-
                  [離家] 系統偵測所有人已離家。
                  • 目前情境：{{ aqara_scene_label_safe }}
                  • 車庫鐵門：{{ states('cover.garage') }}、二樓門鎖同步開關：{{ states('input_boolean.er_lou_men_suo_tong_bu_kai_guan') }}
                  {{ batt_line_text_line }}

                  {{ outdoor_brief }}

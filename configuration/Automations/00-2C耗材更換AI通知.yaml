# ─────────────────────────────────────────────────────────────
# 00-2C耗材更換AI通知 (V3.1.3)
# 相容版本：Helpers V3.19.0（已確認）
# 更新紀錄（統一格式）：
# - V3.1.3：功能版。新增二樓門口電鈴（sensor.0x00158d0002419b84_battery）電量監控，
# - V3.1.2：修補版。客廳 Aqara 魔方電量改接 sensor.living_room_cube_battery，且僅來源數值 1–100% 時更新最低值，0/unknown/unavailable 保留上次有效值。
# - V3.1.1：修補版。耗材電量 state trigger 加入 10 秒防抖；客廳 Aqara 魔方與各裝置測試報告遇 unknown/unavailable 時以上次有效最低電量為準；修正 08b95f06b466/28d1273d78cf/廁所人體感應器顯示名稱，並補齊 LINE user_id 防呆 fallback。
# - V3.1.0：功能版。清理舊 Aqara 魔方電量，新增廁所人體感應器與新客廳 Aqara 魔方監控，並加入一鍵測試健康度報告（Persistent Notification + LINE）。
# - V3.0.3：修補版。修正濾芯壽命重複通知問題（避免 unknown/unavailable 抖動），並在推播中明確標示為「空氣清淨機濾芯壽命」。
# - V3.0.2：同版增補。補上 battery replacement 大幅回升重設（+30%）與 automation_version 變數化標題，降低版本硬編碼維護成本。
# - V3.0.2：同版增補。電量追蹤改為「各裝置最低電量記錄」；未達 90% 以上前不重設，避免 50%→55% 回彈重複通知。
# - V3.0.2：修補版。避免 unknown/浮動回跳造成重複電量通知，並統一 LINE 通知發送方式為 script.send_line_to_user。
# - V3.0.1：修復定期摘要計時基準與上次回報時間寫回；電量提醒改為區間門檻避免跳點漏報。
# - V3.0：新增濾芯與多裝置電量分級、去重通知與定期摘要。
# ─────────────────────────────────────────────────────────────
- alias: 00-2C耗材更換AI通知 (V3.1.3)
  id: ai_00_2c_supply_battery_notify
  mode: queued
  triggers:
    - trigger: numeric_state
      id: prep_filter_10
      entity_id: sensor.kong_qi_qing_jing_ji_filter_life_remaining
      below: 10
    - trigger: numeric_state
      id: prep_filter_5
      entity_id: sensor.kong_qi_qing_jing_ji_filter_life_remaining
      below: 5
    - trigger: numeric_state
      id: urgent_filter_0
      entity_id: sensor.kong_qi_qing_jing_ji_filter_life_remaining
      below: 1
    - trigger: state
      id: battery_change
      entity_id:
        - sensor.garage_battery
        - sensor.ke_ting_men_suo_dian_liang_guo_lu
        - sensor.shu_fang_gan_ying_kai_guan_battery
        - sensor.living_room_cube_battery
        - sensor.e406bf25caa1_battery
        - sensor.08b95f06b466_battery
        - sensor.28d1273d78cf_battery
        - sensor.0x00158d0002419b84_battery    # 二樓門口電鈴
      for: "00:00:10"
    - trigger: time
      id: periodic_report
      at: input_datetime.supply_battery_report_time
    - trigger: state
      id: test_report
      entity_id: input_button.battery_system_test_trigger
  conditions: []
  variables:
    automation_version: "V3.1.3"
    invalid_texts: ["unknown", "unavailable", "none", "None", ""]
    line_bot_target_user_id: "{{ states('sensor.line_bot_target_user_id') }}"
    line_user_valid: "{{ line_bot_target_user_id|string|trim|lower not in ['unknown','unavailable','none',''] }}"
    line_title_general: "【耗材更換系統AI ({{ automation_version }})】\n一般 General 🪧"
  actions:
    - choose:
        - conditions:
            - "{{ trigger.id in ['prep_filter_10','prep_filter_5','urgent_filter_0'] }}"
            - "{{ trigger.from_state is not none }}"
            - "{{ trigger.from_state.state | float(-1) > trigger.to_state.state | float(-1) }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: 耗材更換提醒
                message: "空氣清淨機濾芯壽命：{{ states('sensor.kong_qi_qing_jing_ji_filter_life_remaining') }}%。"
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_general_enable
                  state: "on"
                - condition: state
                  entity_id: input_boolean.notify_supply_extra_line_enable
                  state: "on"
                - condition: template
                  value_template: "{{ line_user_valid }}"
              then:
                - service: script.send_line_to_user
                  data:
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: "{{ [{'type':'text','text':line_title_general},{'type':'text','text':'🧰 耗材提醒\\n空氣清淨機濾芯壽命：' ~ states('sensor.kong_qi_qing_jing_ji_filter_life_remaining') ~ '%'}] | tojson }}"
              else:
                - service: persistent_notification.create
                  data:
                    title: "耗材濾芯 LINE 未發送"
                    message: "未發送原因：LINE 分級/耗材開關關閉或 user_id 無效。"
        - conditions: "{{ trigger.id == 'battery_change' }}"
          sequence:
            - variables:
                device_name: >-
                  {{
                    {
                      'sensor.garage_battery':'車庫感測器',
                      'sensor.ke_ting_men_suo_dian_liang_guo_lu':'客廳門鎖',
                      'sensor.shu_fang_gan_ying_kai_guan_battery':'書房感應開關',
                      'sensor.living_room_cube_battery':'客廳 Aqara 魔方',
                      'sensor.e406bf25caa1_battery':'二樓廁所人體感應器',
                      'sensor.08b95f06b466_battery':'廚房小米人體傳感器',
                      'sensor.28d1273d78cf_battery':'廁所夜燈',
                      'sensor.0x00158d0002419b84_battery':'二樓門口電鈴'
                    }.get(trigger.entity_id, trigger.to_state.name)
                  }}
                v: "{{ trigger.to_state.state|int(-1) }}"
                lowest_helper: >-
                  {{
                    {
                      'sensor.garage_battery':'input_number.supply_batt_lowest_garage',
                      'sensor.ke_ting_men_suo_dian_liang_guo_lu':'input_number.supply_batt_lowest_doorlock',
                      'sensor.shu_fang_gan_ying_kai_guan_battery':'input_number.supply_batt_lowest_study_switch',
                      'sensor.living_room_cube_battery':'input_number.supply_batt_lowest_living_room_cube_new',
                      'sensor.e406bf25caa1_battery':'input_number.supply_batt_lowest_toilet_motion',
                      'sensor.08b95f06b466_battery':'input_number.supply_batt_lowest_08b95f06b466',
                      'sensor.28d1273d78cf_battery':'input_number.supply_batt_lowest_28d1273d78cf',
                      'sensor.0x00158d0002419b84_battery':'input_number.supply_batt_lowest_doorbell_2f'
                    }.get(trigger.entity_id, '')
                  }}
                lowest_saved: "{{ states(lowest_helper)|int(101) if lowest_helper|trim else 101 }}"
            - if:
                - condition: template
                  value_template: "{{ v > 0 and v <= 100 and lowest_helper|trim }}"
              then:
                - choose:
                    - conditions: "{{ v >= 90 or v > (lowest_saved + 30) }}"
                      sequence:
                        - service: input_number.set_value
                          target:
                            entity_id: "{{ lowest_helper }}"
                          data:
                            value: "{{ v }}"
                    - conditions: "{{ lowest_saved > 100 }}"
                      sequence:
                        - service: input_number.set_value
                          target:
                            entity_id: "{{ lowest_helper }}"
                          data:
                            value: "{{ v }}"
                    - conditions: "{{ v < lowest_saved }}"
                      sequence:
                        - service: input_number.set_value
                          target:
                            entity_id: "{{ lowest_helper }}"
                          data:
                            value: "{{ v }}"
                        - if:
                            - condition: template
                              value_template: "{{ v <= 20 }}"
                          then:
                            - service: persistent_notification.create
                              data:
                                title: 裝置電量提醒
                                message: "{{ device_name }} 電量 {{ v }}%。"
                            - if:
                                - condition: state
                                  entity_id: input_boolean.notify_line_general_enable
                                  state: "on"
                                - condition: state
                                  entity_id: input_boolean.notify_supply_extra_line_enable
                                  state: "on"
                                - condition: template
                                  value_template: "{{ line_user_valid }}"
                              then:
                                - service: script.send_line_to_user
                                  data:
                                    user_id: "{{ line_bot_target_user_id }}"
                                    payload: "{{ [{'type':'text','text':line_title_general},{'type':'text','text':'🔋 裝置電量提醒\\n' ~ device_name ~ '：' ~ v ~ '%'}] | tojson }}"
                              else:
                                - service: persistent_notification.create
                                  data:
                                    title: "耗材電量 LINE 未發送"
                                    message: "未發送原因：LINE 分級/耗材開關關閉或 user_id 無效。"
        - conditions: "{{ trigger.id == 'test_report' }}"
          sequence:
            - variables:
                battery_report: >-
                  {% set devices = {
                    '車庫感測器': ['sensor.garage_battery','input_number.supply_batt_lowest_garage'],
                    '客廳門鎖': ['sensor.ke_ting_men_suo_dian_liang_guo_lu','input_number.supply_batt_lowest_doorlock'],
                    '書房感應開關': ['sensor.shu_fang_gan_ying_kai_guan_battery','input_number.supply_batt_lowest_study_switch'],
                    '客廳 Aqara 魔方': ['sensor.living_room_cube_battery','input_number.supply_batt_lowest_living_room_cube_new'],
                    '二樓廁所人體感應器': ['sensor.e406bf25caa1_battery','input_number.supply_batt_lowest_toilet_motion'],
                    '廚房小米人體傳感器': ['sensor.08b95f06b466_battery','input_number.supply_batt_lowest_08b95f06b466'],
                    '廁所夜燈': ['sensor.28d1273d78cf_battery','input_number.supply_batt_lowest_28d1273d78cf'],
                    '二樓門口電鈴': ['sensor.0x00158d0002419b84_battery','input_number.supply_batt_lowest_doorbell_2f']
                  } %}
                  {% set ns = namespace(lines=[]) %}
                  {% for name, pair in devices.items() %}
                    {% set entity = pair[0] %}
                    {% set helper = pair[1] %}
                    {% set raw = states(entity) %}
                    {% set raw_pct = raw | float(-1) | round(0) | int %}
                    {% set saved_pct = states(helper) | float(-1) | round(0) | int %}
                    {% set pct = raw_pct if 0 < raw_pct <= 100 else saved_pct %}
                    {% set shown = (pct ~ '%') if (raw_pct <= 0 or raw_pct > 100) and 0 <= saved_pct <= 100 else (pct ~ '%') %}
                    {% set advice = '請更換電池' if pct >= 0 and pct <= 20 else ('電量偏低，請準備備品' if pct > 20 and pct <= 35 else ('健康' if pct > 35 else '資料異常，請檢查')) %}
                    {% set detail = ('(' ~ advice ~ ')') if advice == '健康' else ('\n  (' ~ advice ~ ')') %}
                    {% set ns.lines = ns.lines + ['-' ~ name ~ ': ' ~ shown ~ detail] %}
                  {% endfor %}
                  {{ ns.lines | join('\n') }}
            - service: persistent_notification.create
              data:
                title: "耗材電量系統一鍵測試"
                message: "{{ battery_report }}"
            - if:
                - condition: state
                  entity_id: input_boolean.notify_line_general_enable
                  state: "on"
                - condition: state
                  entity_id: input_boolean.notify_supply_extra_line_enable
                  state: "on"
                - condition: template
                  value_template: "{{ line_user_valid }}"
              then:
                - service: script.send_line_to_user
                  data:
                    user_id: "{{ line_bot_target_user_id }}"
                    payload: "{{ [{'type':'text','text':line_title_general},{'type':'text','text':'🔋 耗材電量健康度測試報告'},{'type':'text','text':battery_report}] | tojson }}"
              else:
                - service: persistent_notification.create
                  data:
                    title: "耗材電量測試 LINE 未發送"
                    message: "未發送原因：LINE 分級/耗材開關關閉或 user_id 無效。"
        - conditions: "{{ trigger.id == 'periodic_report' and (((as_timestamp(now()) - as_timestamp(states('input_datetime.supply_battery_last_report_time'), 0)) / 86400) >= (states('input_number.supply_battery_report_interval_days')|int(15))) }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: 每月耗材/電量摘要
                message: "定期摘要已執行（每{{ states('input_number.supply_battery_report_interval_days') }}天）。"
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.supply_battery_last_report_time
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

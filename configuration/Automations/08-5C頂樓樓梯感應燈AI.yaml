# ─────────────────────────────────────────────────────────────
# 08-5C頂樓樓梯感應燈AI (V3.4.1)
# 相容版本：Helpers V3.14.1（已確認）
# 更新紀錄（統一格式）：
# - V3.4.1：修補版；精簡輔助關燈條件，移除已被 elapsed >= 2.5 覆蓋的 elapsed > 10 冗餘判斷，行為不變。
# - V3.4.0：功能版；輔助關燈改依主流程來源判斷，書房線/樓梯線直接放行，臥室線/攝影機 2.5 秒內攔截、2.5～10 秒放行，10 秒後一律放行。
# - V3.3.4：修補版；輔助關燈 3 ～180 秒防呆改取主流程與備援舊 ID 的最新 last_triggered，避免舊主流程時間遮蔽近期備援點燈紀錄。
# - V3.3.3：修補版；重新啟用輔助關燈時間差防呆，主流程點燈後 8 秒內禁止書房左側感應器觸發輔助關燈，避免剛出房間關門誤關樓梯燈。
# - V3.3.2：修補版；縮短攝影機冷卻防呆為 10 秒，並將燈具狀態判定防呆縮短為 2 秒。
# - V3.3.1：修補版；補強手動執行時 trigger 未定義防呆，避免模板 UndefinedError。
# - V3.3：功能版；接入 input_select.topfloor_webhook_mode，可切換綜合模式、Webhook模式或原本模式。
# - V3.2：功能版；保留原攝影機人體偵測與自動關燈邏輯，新增三條跨線 Webhook 作為加速補燈選項，特定跨線情境可直接繞過冷卻防呆。
# - V3.0.1：修復主流程防呆時間，將 8 秒調整為 15 秒，降低關燈後延遲偵測造成誤重開機率。
# - V3.0：由 configuration/automations.yaml 拆分為 AI 管理模組，重編標準 ID，
#         並優化左側感應自動關燈邏輯（移除複雜 if/else，改為直接關燈流程），
#         並在主流程加入 8 秒防呆，避免關燈後攝影機延遲訊號立刻重開。
# ─────────────────────────────────────────────────────────────

- id: ai_08_5c_topfloor_stairs_motion_light
  alias: 08-5C頂樓樓梯感應燈AI (V3.4.1)
  description: >
    頂樓樓梯感應燈主流程：五樓攝影機偵測到人時開啟樓梯相關燈具，
    並在 2 分 30 秒後關閉相關燈具；若當時由此流程點亮坎燈，會一併嘗試關閉。
  mode: restart
  variables:
    automation_version: V3.4.1
    webhook_mode: "{{ states('input_select.topfloor_webhook_mode') | default('綜合模式', true) }}"
    webhook_enabled: "{{ webhook_mode in ['綜合模式', 'Webhook模式'] }}"
    original_enabled: "{{ webhook_mode in ['綜合模式', '原本模式'] }}"

  triggers:
    - id: bedroom_line
      platform: webhook
      webhook_id: 5fbedroomline
      local_only: false
    - id: studyroom_line
      platform: webhook
      webhook_id: 5fstudyroomline
      local_only: false
    - id: stairs_line
      platform: webhook
      webhook_id: 5fstairsline
      local_only: false
    - id: camera_person
      trigger: state
      entity_id:
        - binary_sensor.wu_lou_she_ying_ji_person_detected
      to: 'on'

  conditions:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ webhook_enabled and trigger is defined and trigger is not none and trigger.id in ['bedroom_line', 'studyroom_line', 'stairs_line'] }}"
        - condition: and
          conditions:
            - condition: template
              value_template: "{{ original_enabled }}"
            - condition: state
              entity_id: light.yeelink_color5_13b8_light
              state: 'off'
              for:
                seconds: 2
            - condition: template
              value_template: >-
                {{
                  (as_timestamp(now()) -
                  as_timestamp(state_attr('automation.ai_08_5c_topfloor_stairs_motion_light_auto_off', 'last_triggered') | default(0, true)))
                  > 10
                }}

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ webhook_enabled and trigger is defined and trigger is not none and trigger.id in ['bedroom_line', 'studyroom_line', 'stairs_line'] }}"
          sequence:
            - parallel:
                - action: light.turn_on
                  target:
                    entity_id:
                      - light.yeelink_color5_0fb7_light
                      - light.yeelink_color5_13b8_light
                - action: light.turn_on
                  target:
                    entity_id: light.ding_lou_kan_deng
            - delay:
                minutes: 2
                seconds: 30
            - action: light.turn_off
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.yeelink_lamp2_678c_light
                      state: 'off'
                    - condition: state
                      entity_id: light.yeelink_bslamp2_4329_light
                      state: 'off'
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: light.ding_lou_kan_deng
            - stop: Webhook 補燈綠色通道完成，原攝影機防呆流程不需等待。
    - choose:
        - conditions:
            - condition: state
              entity_id: light.ding_lou_kan_deng
              state: 'on'
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
            - delay:
                minutes: 2
                seconds: 30
            - action: light.turn_off
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
      default:
        - parallel:
            - action: light.turn_on
              target:
                entity_id: light.ding_lou_kan_deng
            - action: light.turn_on
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
        - delay:
            minutes: 2
            seconds: 30
        - action: light.turn_off
          target:
            entity_id:
              - light.yeelink_color5_13b8_light
              - light.yeelink_color5_0fb7_light
        - choose:
            - conditions:
                - condition: state
                  entity_id: light.yeelink_lamp2_678c_light
                  state: 'off'
                - condition: state
                  entity_id: light.yeelink_bslamp2_4329_light
                  state: 'off'
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.ding_lou_kan_deng

- id: ai_08_5c_topfloor_stairs_motion_light_auto_off
  alias: 08-5C頂樓樓梯感應燈自動關閉AI (V3.4.1)
  description: >
    書房左側感應觸發後，僅在主流程觸發後 180 秒內執行輔助關燈流程。
    若主流程最近由書房線或樓梯線觸發則直接放行；若由臥室線或攝影機觸發，
    2.5 秒內視為出房轉身關門誤觸並攔截，2.5～10 秒視為走入臥室連續動作並放行，10 秒後一律放行。
  mode: single
  variables:
    automation_version: V3.4.1

  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.shu_fang_gan_ying_kai_guan_motion_left
      to: 'on'

  conditions:
    - condition: template
      value_template: "{{ (states('input_select.topfloor_webhook_mode') | default('綜合模式', true)) in ['綜合模式', '原本模式'] }}"
    - condition: template
      value_template: >-
        {% set trigger_timestamps = [
          as_timestamp(state_attr('automation.ai_08_5c_topfloor_stairs_motion_light','last_triggered'), none),
          as_timestamp(state_attr('automation.a08_5cauto','last_triggered'), none),
          as_timestamp(state_attr('automation.08_5cding_lou_lou_ti_gan_ying_deng','last_triggered'), none)
        ] | select('ne', none) | list %}
        {% if trigger_timestamps | length == 0 %}
          false
        {% else %}
          {% set latest_ts = trigger_timestamps | max %}
          {% set elapsed = as_timestamp(now()) - latest_ts %}
          {% set bedroom_ts = as_timestamp(states('input_datetime.topfloor_bedroom_line_last_triggered'), 0) %}
          {% set study_ts = as_timestamp(states('input_datetime.topfloor_studyroom_line_last_triggered'), 0) %}
          {% set stairs_ts = as_timestamp(states('input_datetime.topfloor_stairs_line_last_triggered'), 0) %}
          {% set tolerance = 3 %}
          {% set is_study_or_stairs_source = (
            (study_ts > 0 and ((latest_ts - study_ts) | abs) <= tolerance and study_ts >= bedroom_ts)
            or
            (stairs_ts > 0 and ((latest_ts - stairs_ts) | abs) <= tolerance and stairs_ts >= bedroom_ts)
          ) %}
          {{
            elapsed < 180 and (
              is_study_or_stairs_source
              or elapsed >= 2.5
            )
          }}
        {% endif %}

  actions:
    - parallel:
        - action: switch.turn_off
          target:
            entity_id: switch.shu_fang_deng
        - action: light.turn_off
          target:
            entity_id:
              - light.yeelink_color5_0fb7_light
              - light.yeelink_color5_13b8_light

    - choose:
        - conditions:
            - condition: state
              entity_id: light.ding_lou_kan_deng
              state: 'on'
            - condition: state
              entity_id: light.yeelink_lamp2_678c_light
              state: 'off'
            - condition: state
              entity_id: light.yeelink_bslamp2_4329_light
              state: 'off'
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.ding_lou_kan_deng

# ─────────────────────────────────────────────────────────────
# 08-5C頂樓樓梯感應燈AI (V3.4.5)
# 相容版本：Helpers V3.14.1（已確認）
# 更新紀錄（統一格式）：
# - V3.4.5：動態置空救援版；徹底解決無線 Webhook 偶發性漏抓痛點。
#           將細緻過濾邏輯由 Conditions 下移至 Actions 執行：
#           A軌跡完好則進門秒關；B軌跡丟包則啟動「22秒攝影機動態監聽超時機制」。
#           依據日誌真實物理數據（回房18s/出房26s清除），將超時切點動態定鎖於 22 秒，
#           外部空置（off）即秒補關燈，外部有人（on）則判定為出室動線並保持亮燈。
# - V3.4.1：修補版；精簡輔助關燈條件，移除已被 elapsed >= 2.5 覆蓋的 elapsed > 10 冗餘判斷，行為不變。
# - V3.4.0：功能版；輔助關燈改依主流程來源判斷，書房線/樓梯線直接放行，臥室線/攝影機 2.5 秒內攔截、2.5～10 秒放行，10 秒後一律放行。
# - V3.3.4：修補版；輔助關燈 3 ～180 秒防呆改取主流程與備援舊 ID 的最新 last_triggered，避免舊主流程時間遮蔽近期備援點燈紀錄。
# - V3.3.3：修補版；重新啟用輔助關燈時間差防呆，主流程點燈後 8 秒內禁止書房左側感應器觸發輔助關燈，避免剛出房間關門誤關樓梯燈。
# - V3.3.2：修補版；縮短攝影機冷卻防呆為 10 秒，並將燈具狀態判定防呆縮短為 2 秒。
# - V3.3.1：修補版；補強手動執行時 trigger 未定義防呆，避免模板 UndefinedError。
# - V3.3：功能版；接入 input_select.topfloor_webhook_mode，可切換綜合模式、Webhook模式或原本模式。
# - V3.2：功能版；保留原攝影機人體偵測與自動關燈邏輯，新增三條跨線 Webhook 作為加速補燈選項，特定跨線情境可直接繞過冷卻防呆。
# - V3.0.1：修復主流程防呆時間，將 8 秒調整為 15 秒，降低關燈後延遲偵測造成誤重開機率。
# - V3.0：由 configuration/automations.yaml 拆分為 AI 管理模組，重編標準 ID，
#         並優化左側感應自動關燈邏輯（移除複雜 if/else，改為直接關燈流程），
#         並在主流程加入 8 秒防呆，避免關燈後攝影機延遲訊號立刻重開。
# ─────────────────────────────────────────────────────────────

- id: ai_08_5c_topfloor_stairs_motion_light
  alias: 08-5C頂樓樓梯感應燈AI (V3.4.5)
  description: >
    頂樓樓梯感應燈主流程：五樓攝影機偵測到人時開啟樓梯相關燈具，
    並在 2 分 30 秒後關閉相關燈具；若當時由此流程點亮坎燈，會一併嘗試關閉。
  mode: restart
  variables:
    automation_version: V3.4.5
    webhook_mode: "{{ states('input_select.topfloor_webhook_mode') | default('綜合模式', true) }}"
    webhook_enabled: "{{ webhook_mode in ['綜合模式', 'Webhook模式'] }}"
    original_enabled: "{{ webhook_mode in ['綜合模式', '原本模式'] }}"
    sleep_silent_start_min: "{{ states('input_number.sleep_silent_start_min') | int(150) }}"
    sleep_silent_end_min: "{{ states('input_number.sleep_silent_end_min') | int(540) }}"
    sleep_silent_active: >-
      {% set s = sleep_silent_start_min | int %}
      {% set e = sleep_silent_end_min | int %}
      {% set n = now().hour * 60 + now().minute %}
      {{ (n >= s and n < e) if s <= e else (n >= s or n < e) }}

  triggers:
    - id: bedroom_line
      platform: webhook
      webhook_id: 5fbedroomline
      local_only: false
    - id: studyroom_line
      platform: webhook
      webhook_id: 5fstudyroomline
      local_only: false
    - id: stairs_line
      platform: webhook
      webhook_id: 5fstairsline
      local_only: false
    - id: camera_person
      trigger: state
      entity_id:
        - binary_sensor.wu_lou_she_ying_ji_person_detected
      to: 'on'

  conditions:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ webhook_enabled and not (sleep_silent_active | bool) and trigger is defined and trigger is not none and trigger.id in ['bedroom_line', 'studyroom_line', 'stairs_line'] }}"
        - condition: and
          conditions:
            - condition: template
              value_template: "{{ original_enabled }}"
            - condition: template
              value_template: "{{ trigger is defined and trigger is not none and trigger.id == 'camera_person' }}"
            - condition: state
              entity_id: light.yeelink_color5_13b8_light
              state: 'off'
              for:
                seconds: 2
            - condition: template
              value_template: >-
                {{
                  (as_timestamp(now()) -
                  as_timestamp(state_attr('automation.ai_08_5c_topfloor_stairs_motion_light_auto_off', 'last_triggered') | default(0, true)))
                  > 10
                }}

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ webhook_enabled and not (sleep_silent_active | bool) and trigger is defined and trigger is not none and trigger.id in ['bedroom_line', 'studyroom_line', 'stairs_line'] }}"
          sequence:
            - parallel:
                - action: light.turn_on
                  target:
                    entity_id:
                      - light.yeelink_color5_0fb7_light
                      - light.yeelink_color5_13b8_light
                - action: light.turn_on
                  target:
                    entity_id: light.ding_lou_kan_deng
            - delay:
                minutes: 2
                seconds: 30
            - action: light.turn_off
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.yeelink_lamp2_678c_light
                      state: 'off'
                    - condition: state
                      entity_id: light.yeelink_bslamp2_4329_light
                      state: 'off'
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: light.ding_lou_kan_deng
            - stop: Webhook 補燈綠色通道完成，原攝影機防呆流程不需等待。
    - choose:
        - conditions:
            - condition: state
              entity_id: light.ding_lou_kan_deng
              state: 'on'
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
            - delay:
                minutes: 2
                seconds: 30
            - action: light.turn_off
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
      default:
        - parallel:
            - action: light.turn_on
              target:
                entity_id: light.ding_lou_kan_deng
            - action: light.turn_on
              target:
                entity_id:
                  - light.yeelink_color5_0fb7_light
                  - light.yeelink_color5_13b8_light
        - delay:
            minutes: 2
            seconds: 30
        - action: light.turn_off
          target:
            entity_id:
              - light.yeelink_color5_13b8_light
              - light.yeelink_color5_0fb7_light
        - choose:
            - conditions:
                - condition: state
                  entity_id: light.yeelink_lamp2_678c_light
                  state: 'off'
                - condition: state
                  entity_id: light.yeelink_bslamp2_4329_light
                  state: 'off'
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.ding_lou_kan_deng

- id: ai_08_5c_topfloor_stairs_motion_light_auto_off
  alias: 08-5C頂樓樓梯感應燈自動關閉AI (V3.4.5)
  description: >
    書房左側感應觸發後，僅在主流程觸發後 180 秒內執行輔助關燈流程。
    Conditions 僅保留模式與 180 秒安全閥；Actions 以 Webhook 軌跡完好秒關，
    或 22 秒攝影機動態清除救援流判別回房/出房，避免臥室線 Webhook 丟包造成回房漏關。
  mode: single
  variables:
    automation_version: V3.4.5

  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.shu_fang_gan_ying_kai_guan_motion_left
      to: 'on'

  conditions:
    - condition: template
      value_template: "{{ (states('input_select.topfloor_webhook_mode') | default('綜合模式', true)) in ['綜合模式', '原本模式'] }}"
    - condition: template
      value_template: >-
        {% set main_last_triggered = as_timestamp(state_attr('automation.ai_08_5c_topfloor_stairs_motion_light', 'last_triggered'), none) %}
        {{ main_last_triggered is not none and (as_timestamp(now()) - main_last_triggered) < 180 }}

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set bedroom_ts = as_timestamp(states('input_datetime.topfloor_bedroom_line_last_triggered'), 0) %}
                {{ bedroom_ts > 0 and (as_timestamp(now()) - bedroom_ts) <= 5 }}
            - condition: template
              value_template: >-
                {% set from_state = trigger.from_state if trigger is defined and trigger is not none else none %}
                {{ from_state is not none and from_state.state == 'off' and (as_timestamp(now()) - as_timestamp(from_state.last_changed)) >= 10 }}
          sequence:
            - parallel:
                - action: switch.turn_off
                  target:
                    entity_id: switch.shu_fang_deng
                - action: light.turn_off
                  target:
                    entity_id:
                      - light.yeelink_color5_0fb7_light
                      - light.yeelink_color5_13b8_light
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.ding_lou_kan_deng
                      state: 'on'
                    - condition: state
                      entity_id: light.yeelink_lamp2_678c_light
                      state: 'off'
                    - condition: state
                      entity_id: light.yeelink_bslamp2_4329_light
                      state: 'off'
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: light.ding_lou_kan_deng
            - stop: Webhook 軌跡完好，已執行秒級關燈。
      default:
        - choose:
            - conditions:
                - condition: state
                  entity_id: binary_sensor.wu_lou_she_ying_ji_person_detected
                  state: 'off'
              sequence:
                - parallel:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.shu_fang_deng
                    - action: light.turn_off
                      target:
                        entity_id:
                          - light.yeelink_color5_0fb7_light
                          - light.yeelink_color5_13b8_light
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: light.ding_lou_kan_deng
                          state: 'on'
                        - condition: state
                          entity_id: light.yeelink_lamp2_678c_light
                          state: 'off'
                        - condition: state
                          entity_id: light.yeelink_bslamp2_4329_light
                          state: 'off'
                      sequence:
                        - action: light.turn_off
                          target:
                            entity_id: light.ding_lou_kan_deng
                - stop: 攝影機已為未偵測狀態，立即補刀救援關燈。
        - wait_for_trigger:
            - platform: state
              entity_id: binary_sensor.wu_lou_she_ying_ji_person_detected
              to: 'off'
          timeout: "00:00:22"
          continue_on_timeout: true
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ wait.completed }}"
              sequence:
                - parallel:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.shu_fang_deng
                    - action: light.turn_off
                      target:
                        entity_id:
                          - light.yeelink_color5_0fb7_light
                          - light.yeelink_color5_13b8_light
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: light.ding_lou_kan_deng
                          state: 'on'
                        - condition: state
                          entity_id: light.yeelink_lamp2_678c_light
                          state: 'off'
                        - condition: state
                          entity_id: light.yeelink_bslamp2_4329_light
                          state: 'off'
                      sequence:
                        - action: light.turn_off
                          target:
                            entity_id: light.ding_lou_kan_deng
                - stop: 22秒內攝影機動態清除，已補刀救援關燈。
        - stop: 22秒攝影機仍維持有人，判定出室動線並保持主流程照明。

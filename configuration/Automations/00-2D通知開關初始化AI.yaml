# ─────────────────────────────────────────────────────────────
# 00-2D通知開關初始化AI (V4.0.0)
# 相容版本：Helpers V4.0.0（已確認）
# 更新紀錄（統一格式）：
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；本檔為 V4.0 新增/重構（通知分級、統一廣播、情境、氣氛燈相關）。
# - V1.0.0：首次建立 HA 通知分級開關後，一次性全部開啟（旗標 input_text.notify_ha_switch_init = done）；
#           之後重開機不再覆蓋使用者的設定。
# ─────────────────────────────────────────────────────────────
- alias: 00-2D通知開關初始化AI (V4.0.0)
  id: ai_00_2d_notify_ha_switch_init
  description: 首次啟動時一次性開啟 HA 通知分級開關，之後完全由使用者調整
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    - condition: template
      value_template: "{{ states('input_text.notify_ha_switch_init') != 'done' }}"
  action:
    - delay: "00:00:20"
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.notify_ha_info_enable
          - input_boolean.notify_ha_general_enable
          - input_boolean.notify_ha_important_enable
    - action: input_text.set_value
      target:
        entity_id: input_text.notify_ha_switch_init
      data:
        value: done

- alias: 00-2D氣氛燈開關初始化AI (V4.0.0)
  id: ai_00_2d_mood_alert_switch_init
  description: 首次啟動時一次性開啟氣氛燈提醒開關，之後完全由使用者調整
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    - condition: template
      value_template: "{{ states('input_text.mood_alert_switch_init') != 'done' }}"
  action:

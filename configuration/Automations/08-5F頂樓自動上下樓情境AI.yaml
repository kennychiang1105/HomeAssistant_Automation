# [V4.0-beta1] 通知分級：HA 通知改用 script.notify_dispatch（資訊/一般/重要/緊急，含標題與版本號）；廣播（若有）改用 script.announce。
# ─────────────────────────────────────────────────────────────
# 08-5F頂樓自動上下樓情境AI (V4.0.0)
# 相容版本：Helpers V3.15（已確認）
# 更新紀錄（統一格式）：
# - V4.0.4（2026-10-10）：手機所在 AP 改讀 sensor.kenny_phone_ap_mac（person.kenny 的 source），不再自己從 input_text.iphone_tracker_entity_kenny 解析；其餘邏輯不變。
# - V4.0.3（2026-10-10）：熟睡判定統一只看熟睡鎖（sleep_silent_active），移除 02:30→09:30／10:30 時間窗與寫死的 570／630；移除本檔 7 處自行關閉熟睡鎖（解鎖統一由 08-5H 熟睡鎖管理：起床情境、動態解鎖時間）。
# - V4.0.2：修補版；依照使用者需求，週末睡眠靜默窗結束時間調整為 10:30（630 分鐘），配合熟睡鎖保護晨間起夜。
# - V4.0.1：修補版；修正週末睡眠靜默窗結束時間，週末（週六/週日）自動延長至 10:00（600 分鐘），避免週末晨間誤判上樓開燈。
# - V4.0.0：頂樓感應優化 P1：書房線不再寫入「最後進入書房」（避免 08-5G 誤判書房有人而不關燈）；「Webhook 上樓」需攝影機 60 秒內有人或 iPhone 在 5F AP 佐證。
# - V4.0.0：AI 4.0 版號統一（V4.0-beta1）；通知改用 script.notify_dispatch（分級 HA 通知）、廣播改用 script.announce，LINE 發送帶入來源名稱。
# - V3.4.0：功能版；新增 input_boolean.sleep_silent_active 手動熟睡鎖，上樓判定全面納入熟睡中拒絕，且所有自動下樓/離家複檢成立時自動復歸熟睡鎖。
# - V3.3.2：修補版；將睡眠靜默窗納入 Webhook 跨線前置條件，深夜完全忽略 Webhook 訊號並保留原本 AP/攝影機流程。
# - V3.3.1：修補版；補強手動執行時 trigger 未定義防呆，並修正 3 分鐘保護窗後 AP 複檢使用即時狀態。
# - V3.3：功能版；接入 input_select.topfloor_webhook_mode，可切換綜合模式、Webhook模式或原本模式。
# - V3.2：功能版；完整保留原攝影機、AP、光源、保護窗與 Debug 判定流程，新增三條跨線 Webhook 作為秒級方向推理加速選項。
# - V3.1：移除 Apple Watch 偵測，改以 iPhone AP 單一判定；新增 AI 離家事件後複檢，若已離家或不在頂樓即同步下樓情境。
# - V3.0：統一命名規範、欄位標準化與通知標題版本同步。
# ─────────────────────────────────────────────────────────────
- alias: 08-5F頂樓自動上下樓情境AI (V4.0.4)
  id: ai_topfloor_stairs_scene
  description: >
    V2.0 版頂樓上下樓情境：整合上樓/下樓判定、保護窗、雙黏著鎖與除錯快照輸出。
    依攝影機、AP 與光源狀態做多條件決策，避免誤判並提升情境切換穩定性。
  mode: restart
  max: 10
  triggers:
    - id: t_leave_ai_confirmed
      event_type: ai_leave_confirmed
      event_data:
        who: kenny
      trigger: event
    - id: t_bedroom_line
      platform: webhook
      webhook_id: 5fbedroomline
      local_only: true
    - id: t_studyroom_line
      platform: webhook
      webhook_id: 5fstudyroomline
      local_only: true
    - id: t_stairs_line
      platform: webhook
      webhook_id: 5fstairsline
      local_only: true
    - id: t_cam
      entity_id: binary_sensor.wu_lou_she_ying_ji_person_detected
      to: "on"
      trigger: state
    - id: t_ap_immediate_up
      value_template: >
        {% set s1 = states('input_text.iphone_tracker_entity_kenny') %} {% set iphone_ent =
        'device_tracker.iphone_17_pro_max_kenny' if s1 in
        ['unknown','unavailable',''] else s1 %} {% set iphone_ap  =
        states('sensor.kenny_phone_ap_mac') %} {% set ap_raw     =
        states('input_text.topfloor_ap_macs_5f') %} {% set ap_list_raw =
        '70:a7:41:e4:54:1f,70:a7:41:e4:5a:bf,d0:21:f9:f2:fc:4c' if ap_raw in
        ['unknown','unavailable',''] else ap_raw %} {% set ap_list =
        (ap_list_raw|lower|replace('
        ','')|replace(';',',')|regex_findall('[^,]+')) %} {{ iphone_ap in ap_list }}
      trigger: template
    - id: t_ap_left_phone
      value_template: >
        {% set s1 = states('input_text.iphone_tracker_entity_kenny') %} {% set
        iphone_ent = 'device_tracker.iphone_17_pro_max_kenny' if s1 in
        ['unknown','unavailable',''] else s1 %} {% set iphone_ap  =
        states('sensor.kenny_phone_ap_mac') %} {% set ap_raw     =
        states('input_text.topfloor_ap_macs_5f') %} {% set ap_list_raw =
        '70:a7:41:e4:54:1f,70:a7:41:e4:5a:bf,d0:21:f9:f2:fc:4c' if ap_raw in
        ['unknown','unavailable',''] else ap_raw %} {% set ap_list =
        (ap_list_raw|lower|replace('
        ','')|replace(';',',')|regex_findall('[^,]+')) %} {{ iphone_ap not in
        ap_list }}
      trigger: template
  conditions:
    - condition: template
      value_template: >-
        {% set mode = states('input_select.topfloor_webhook_mode') | default('綜合模式', true) %}
        {% set tid = trigger.id if trigger is defined and trigger is not none and trigger.id is defined else 'unknown' %}
        {% set webhook_trigger = tid in ['t_bedroom_line', 't_studyroom_line', 't_stairs_line'] %}
        {% set sleep_silent = is_state('input_boolean.sleep_silent_active', 'on') %}
        {{ tid == 't_leave_ai_confirmed' or
           (mode in ['綜合模式', 'Webhook模式'] and webhook_trigger and not sleep_silent) or
           (mode in ['綜合模式', '原本模式'] and is_state('device_tracker.iphone_17_pro_max_kenny', 'home')) }}
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ (states('input_select.topfloor_webhook_mode') | default('綜合模式', true)) in ['綜合模式', 'Webhook模式'] and trigger is defined and trigger is not none and trigger.id is defined and trigger.id in ['t_bedroom_line', 't_studyroom_line'] }}"
          sequence:
            - variables:
                now_ts_fast: "{{ as_timestamp(now()) }}"
                last_stairs_ts_fast: "{{ as_timestamp(states('input_datetime.topfloor_stairs_line_last_triggered'), 0) }}"
                recent_stairs_before_room_fast: "{{ (now_ts_fast | float - last_stairs_ts_fast | float) <= 15 }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ trigger is defined and trigger is not none and trigger.id is defined and trigger.id == 't_bedroom_line' }}"
                  sequence:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.topfloor_bedroom_line_last_triggered
                      data:
                        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                - conditions:
                    - condition: template
                      value_template: "{{ trigger is defined and trigger is not none and trigger.id is defined and trigger.id == 't_studyroom_line' }}"
                  sequence:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id:
                          - input_datetime.topfloor_studyroom_line_last_triggered
                      data:
                        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ recent_stairs_before_room_fast }}"
                    - condition: template
                      value_template: "{{ not (sleep_silent_active | bool) }}"
                    - condition: template
                      value_template: >-
                        {{ not (is_state('binary_sensor.wu_lou_she_ying_ji_person_detected', 'on')
                                or (now() - states.binary_sensor.wu_lou_she_ying_ji_person_detected.last_changed).total_seconds() <= 60
                                or (upstairs_phone_raw | bool)) }}
                  sequence:
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: Webhook 上樓未佐證（攝影機 60 秒內無人且 iPhone 不在 5F AP），略過
                    - stop: Webhook 上樓未佐證，略過；保留原 AP/攝影機流程。
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ recent_stairs_before_room_fast }}"
                    - condition: template
                      value_template: "{{ not (sleep_silent_active | bool) }}"
                  sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_lock_after_up
                      data:
                        duration: 90
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: Webhook 上樓成立（樓梯線→房門/書房線 15 秒內）
                    - stop: Webhook 加速上樓成立，原 AP/攝影機流程保留但本次不需等待。
            - stop: Webhook 房門/書房線已記錄，等待下一條跨線補足方向。
        - conditions:
            - condition: template
              value_template: "{{ (states('input_select.topfloor_webhook_mode') | default('綜合模式', true)) in ['綜合模式', 'Webhook模式'] and trigger is defined and trigger is not none and trigger.id is defined and trigger.id == 't_stairs_line' }}"
          sequence:
            - variables:
                now_ts_fast: "{{ as_timestamp(now()) }}"
                last_bedroom_ts_fast: "{{ as_timestamp(states('input_datetime.topfloor_bedroom_line_last_triggered'), 0) }}"
                last_study_ts_fast: "{{ as_timestamp(states('input_datetime.topfloor_studyroom_line_last_triggered'), 0) }}"
                recent_room_before_stairs_fast: "{{ (now_ts_fast | float - [last_bedroom_ts_fast | float, last_study_ts_fast | float] | max) <= 10 }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.topfloor_stairs_line_last_triggered
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ recent_room_before_stairs_fast }}"
                  sequence:
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_down_intent_guard
                      data:
                        duration: "00:03:00"
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: Webhook 下樓軌跡成立，啟動 3 分鐘返回保護窗
                    - delay: "00:03:00"
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >-
                                {% set live_iphone_ap = states('sensor.kenny_phone_ap_mac') %}
                                {{ live_iphone_ap not in ap_list }}
                          sequence:
                            - action: input_boolean.turn_on
                              target:
                                entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                            - action: timer.start
                              target:
                                entity_id: timer.topfloor_lock_after_down
                              data:
                                duration: 90
                            - action: input_text.set_value
                              target:
                                entity_id: input_text.topfloor_debug_last_decision
                              data:
                                value: Webhook 下樓成立（3 分鐘未返回且 iPhone 不在 5F AP）
                            - stop: Webhook 加速下樓成立。
                    - stop: Webhook 下樓保護窗結束，AP 複檢仍在五樓或已被返回訊號重啟。
            - stop: Webhook 樓梯線已記錄，等待房門/書房線補足方向。
    - variables:
        _trig: "{{ trigger.id if trigger is defined and trigger is not none and trigger.id is defined else 'unknown' }}"
        _iphone_ap_s: "{{ (iphone_ap | default('none')) | string }}"
        _snap_json: |
          {{
            {
              "ts": now().isoformat(),
              "trigger": _trig,
              "iphone_ap": _iphone_ap_s,
              "iphone_ap_valid": (iphone_ap_valid | bool),
              "up_phone_raw": (upstairs_phone_raw | bool),
              "up_for_up": (upstairs_present_up | bool),
              "up_for_down": (upstairs_present_down | bool),
              "l1": (lamp1_on | bool),
              "l2": (lamp2_on | bool),
              "l2_bri": (lamp2_bri | int),
              "all_dark": (lights_all_off | bool),
              "off_or_dim": (lights_off_or_dim | bool),
              "recent_light_off": (recent_light_off | bool),
              "dark_15s": (dark_15s | bool),
              "sleep_silent": (sleep_silent_active | bool),
              "guard_active": (guard_active | bool),
              "lock_up_active": (lock_up_active | bool),
              "lock_down_active": (lock_down_active | bool)
            } | tojson
          }}
    - variables:
        _pretty: >
          {% set Y = '✅' %}{% set N = '❌' %} 🕒 {{ now().strftime('%Y-%m-%d
          %H:%M:%S') }} 🔔 Trigger: {{ _trig }} ───────────────────────────── 📶
          AP 狀態 • iPhone AP: {{ _iphone_ap_s }}（有效? {{ Y if iphone_ap_valid else N
          }}）→ 5F? {{ Y if upstairs_phone_raw else N }} • 上樓用(iPhone): {{ Y if
          upstairs_present_up else N }}　下樓用(Phone-保守): {{ Y if
          upstairs_present_down else N }} ───────────────────────────── 💡 燈光 •
          L1: {{ 'ON' if lamp1_on else 'off' }}　L2: {{ 'ON' if lamp2_on else 'off'
          }}　L2亮度: {{ lamp2_bri }} • 全黑(all off): {{ Y if lights_all_off else N
          }}　極暗/全暗(off_or_dim): {{ Y if lights_off_or_dim else N }} • 連續黑≥15s: {{
          Y if dark_15s else N }}　燈剛關({{ light_off_cooldown_sec }}s內): {{ Y if
          recent_light_off else N }} ───────────────────────────── 💤 睡眠靜默 • 熟睡鎖
          啟用? {{ Y if sleep_silent_active else N }}（解鎖由 08-5H 鎖管理決定）
          ───────────────────────────── 🛡️ 保護窗 / 黏著鎖 • guard_active: {{ Y if
          guard_active else N }} • lock_up_active(上樓鎖): {{ Y if lock_up_active
          else N }} • lock_down_active(下樓鎖): {{ Y if lock_down_active else N }}
    - action: input_text.set_value
      target:
        entity_id: input_text.topfloor_debug_last_json
      data:
        value: "{{ (_snap_json | string)[:250] }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ debug_on }}"
          sequence:
            - action: script.notify_dispatch
              data:
                level: info
                line: false
                source: "08-5F頂樓自動上下樓情境AI (V4.0.1)"
                version: "{{ automation_version | default('', true) }}"
                title: "[DEBUG] 頂樓偵測（可讀版）"
                message: "{{ _pretty }}"
            - action: script.notify_dispatch
              data:
                level: info
                line: false
                source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                version: "{{ automation_version | default('', true) }}"
                title: "[DEBUG] 頂樓偵測快照（JSON）"
                message: "{{ _snap_json }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger is defined and trigger is not none and trigger.id is defined and trigger.id in ['t_cam'] and lamp_was_on_recently }}"
          sequence:
            - action: timer.start
              target:
                entity_id: timer.topfloor_down_intent_guard
              data:
                duration: >-
                  {{
                  states('input_number.topfloor_cam_ambiguous_sec_kenny')|int(45)
                  }}
    - choose:
        - conditions:
            condition: trigger
            id: t_leave_ai_confirmed
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ (not upstairs_present_down) or is_state(iphone_entity, 'not_home') }}
                  sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_lock_after_down
                      data:
                        duration: 90
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: AI離家後複檢→下樓（已離家或不在頂樓）
                - conditions:
                    - condition: template
                      value_template: "{{ upstairs_present_down and is_state(iphone_entity, 'home') }}"
                  sequence:
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: AI離家後複檢未下樓（仍在頂樓）
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ debug_on }}"
                  sequence:
                    - action: script.notify_dispatch
                      data:
                        level: info
                        line: false
                        source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                        version: "{{ automation_version | default('', true) }}"
                        title: "[DEBUG] 決策"
                        message: "{{ states('input_text.topfloor_debug_last_decision') }}"
            - stop: AI離家後複檢完成
        - conditions:
            - condition: state
              entity_id: timer.topfloor_lock_after_down
              state: idle
            - condition: or
              conditions:
                - condition: trigger
                  id: t_ap_immediate_up
                - condition: template
                  value_template: "{{ upstairs_present_up }}"
            - condition: template
              value_template: "{{ (not recent_light_off) or (dark_15s) }}"
            - condition: template
              value_template: "{{ not guard_active }}"
            - condition: template
              value_template: "{{ lights_all_off }}"
            - condition: template
              value_template: "{{ not (sleep_silent_active | bool) }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ding_lou_shang_lou_qing_jing
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ding_lou_xia_lou_qing_jing
            - action: timer.start
              target:
                entity_id: timer.topfloor_lock_after_up
              data:
                duration: 90
            - action: input_text.set_value
              target:
                entity_id: input_text.topfloor_debug_last_decision
              data:
                value: 上樓成立（AP即時/OR，全黑 + 非睡眠窗，黑≥15s 或非剛關燈）
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ debug_on }}"
                  sequence:
                    - action: script.notify_dispatch
                      data:
                        level: info
                        line: false
                        source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                        version: "{{ automation_version | default('', true) }}"
                        title: "[DEBUG] 決策"
                        message: 上樓成立（AP即時/OR，全黑 + 非睡眠窗，黑≥15s 或非剛關燈）
            - stop: 上樓成立（即時/OR）
        - conditions:
            - condition: state
              entity_id: timer.topfloor_lock_after_up
              state: idle
            - condition: or
              conditions:
                - condition: trigger
                  id: t_ap_left_phone
                - condition: template
                  value_template: >-
                    {{ (down_no_light_grace_sec|int) > 0 and (not
                    upstairs_present_down) }}
          sequence:
            - variables:
                __start: "{{ as_timestamp(now()) }}"
            - repeat:
                until:
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: |
                          {{ (not upstairs_present_down) and
                             ((as_timestamp(now()) - __start) >= (down_no_light_grace_sec | int)) }}
                      - condition: template
                        value_template: "{{ upstairs_present_down }}"
                sequence:
                  - delay: "00:00:05"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ upstairs_present_down }}"
                        sequence:
                          - variables:
                              __start: "{{ as_timestamp(now()) }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: |
                        {{ (not upstairs_present_down) and
                           ((as_timestamp(now()) - __start) >= (down_no_light_grace_sec | int)) }}
                  sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_lock_after_down
                      data:
                        duration: 90
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: 下樓成立（iPhone 連續 {{ down_no_light_hms }} 不在頂樓 AP）
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_on }}"
                          sequence:
                            - action: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "[DEBUG] 決策"
                                message: 下樓成立（iPhone 連續 {{ down_no_light_hms }} 不在頂樓 AP）
                    - stop: 下樓成立（iPhone 連續不在頂樓 AP）
        - conditions:
            - condition: state
              entity_id: timer.topfloor_lock_after_up
              state: idle
            - condition: trigger
              id: t_cam
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ lamp_was_on_recently }}"
                  sequence:
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_down_intent_guard
                      data:
                        duration: >-
                          {{
                          states('input_number.topfloor_cam_ambiguous_sec_kenny')|int(45)
                          }}
            - variables:
                __assist_end: "{{ as_timestamp(now()) + (down_assist_wait_sec | int) }}"
                __start: "{{ as_timestamp(now()) }}"
            - repeat:
                until:
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: |
                          {{ (not upstairs_present_down) and
                             ((as_timestamp(now()) - __start) >= (down_no_light_grace_sec | int)) }}
                      - condition: template
                        value_template: "{{ as_timestamp(now()) >= (__assist_end | float) }}"
                sequence:
                  - delay: "00:00:05"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ upstairs_present_down }}"
                        sequence:
                          - variables:
                              __start: "{{ as_timestamp(now()) }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: |
                        {{ (not upstairs_present_down) and
                           ((as_timestamp(now()) - __start) >= (down_no_light_grace_sec | int)) }}
                  sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_lock_after_down
                      data:
                        duration: 90
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.topfloor_debug_last_decision
                      data:
                        value: 下樓成立（Assist：iPhone 連續 {{ down_no_light_hms }} 不在頂樓）
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_on }}"
                          sequence:
                            - action: script.notify_dispatch
                              data:
                                level: info
                                line: false
                                source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                                version: "{{ automation_version | default('', true) }}"
                                title: "[DEBUG] 決策"
                                message: >-
                                  下樓成立（Assist：iPhone 連續 {{ down_no_light_hms }}
                                  不在頂樓）
                    - stop: 下樓成立（Assist 視窗）
        - conditions:
            condition: trigger
            id: t_cam
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ lamp_was_on_recently }}"
                  sequence:
                    - action: timer.start
                      target:
                        entity_id: timer.topfloor_down_intent_guard
                      data:
                        duration: >-
                          {{
                          states('input_number.topfloor_cam_ambiguous_sec_kenny')|int(45)
                          }}
            - variables:
                start_ts: "{{ as_timestamp(now()) }}"
            - repeat:
                until:
                  - condition: template
                    value_template: >
                      {{ (as_timestamp(now()) - start_ts) >
                      (monitor_window_sec|int) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: timer.topfloor_lock_after_down
                            state: idle
                          - condition: template
                            value_template: >
                              {{ upstairs_present_up and ((not recent_light_off)
                              or dark_15s) and (not guard_active) }}
                          - condition: template
                            value_template: "{{ lights_all_off }}"
                          - condition: template
                            value_template: "{{ not (sleep_silent_active | bool) }}"
                        sequence:
                          - action: input_boolean.turn_on
                            target:
                              entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                          - action: input_boolean.turn_off
                            target:
                              entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                          - action: timer.start
                            target:
                              entity_id: timer.topfloor_lock_after_up
                            data:
                              duration: 90
                          - action: input_text.set_value
                            target:
                              entity_id: input_text.topfloor_debug_last_decision
                            data:
                              value: 上樓成立（視窗內立即，全黑 + 非睡眠窗，黑≥15s 或非剛關燈）
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ debug_on }}"
                                sequence:
                                  - action: script.notify_dispatch
                                    data:
                                      level: info
                                      line: false
                                      source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                                      version: "{{ automation_version | default('', true) }}"
                                      title: "[DEBUG] 決策"
                                      message: 上樓成立（視窗內立即，全黑 + 非睡眠窗，黑≥15s 或非剛關燈）
                          - stop: 上樓成立（視窗內立即）
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: timer.topfloor_lock_after_up
                            state: idle
                          - condition: template
                            value_template: >-
                              {{ (not upstairs_present_down) and lights_off_or_dim
                              }}
                          - condition: template
                            value_template: "{{ not upstairs_present_up }}"
                        sequence:
                          - variables:
                              __start_cam_dn: "{{ as_timestamp(now()) }}"
                          - repeat:
                              until:
                                - condition: or
                                  conditions:
                                    - condition: template
                                      value_template: >
                                        {{ (not upstairs_present_down) and
                                        lights_off_or_dim and
                                           ((as_timestamp(now()) - __start_cam_dn) >= 20) }}
                                    - condition: template
                                      value_template: >
                                        {{ upstairs_present_down or (not
                                        lights_off_or_dim) }}
                              sequence:
                                - delay: "00:00:05"
                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: >
                                            {{ upstairs_present_down or (not
                                            lights_off_or_dim) }}
                                      sequence:
                                        - variables:
                                            __start_cam_dn: "{{ as_timestamp(now()) }}"
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >
                                      {{ (not upstairs_present_down) and
                                      lights_off_or_dim and
                                         ((as_timestamp(now()) - __start_cam_dn) >= 20) }}
                                sequence:
                                  - action: input_boolean.turn_on
                                    target:
                                      entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                                  - action: input_boolean.turn_off
                                    target:
                                      entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                                  - action: timer.start
                                    target:
                                      entity_id: timer.topfloor_lock_after_down
                                    data:
                                      duration: 90
                                  - action: input_text.set_value
                                    target:
                                      entity_id: input_text.topfloor_debug_last_decision
                                    data:
                                      value: 下樓成立（視窗內 20s 連續燈關/極暗）
                                  - choose:
                                      - conditions:
                                          - condition: template
                                            value_template: "{{ debug_on }}"
                                        sequence:
                                          - action: script.notify_dispatch
                                            data:
                                              level: info
                                              line: false
                                              source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                                              version: "{{ automation_version | default('', true) }}"
                                              title: "[DEBUG] 決策"
                                              message: 下樓成立（視窗內 20s 連續燈關/極暗）
                                  - stop: 下樓成立（視窗內）
                  - delay: "00:00:10"
            - choose:
                - conditions:
                    - condition: state
                      entity_id: timer.topfloor_lock_after_down
                      state: idle
                    - condition: template
                      value_template: "{{ tail_grace_up_sec|int > 0 }}"
                    - condition: template
                      value_template: "{{ lights_all_off }}"
                    - condition: template
                      value_template: "{{ not (sleep_silent_active | bool) }}"
                  sequence:
                    - wait_template: >
                        {{ upstairs_present_up and ((not recent_light_off) or
                        dark_15s) and
                           (not guard_active) and lights_all_off and (not (sleep_silent_active | bool)) }}
                      timeout: >
                        {{ '%02d:%02d:%02d'|format((tail_grace_up_sec//3600),
                        ((tail_grace_up_sec%3600)//60), (tail_grace_up_sec%60)) }}
                      continue_on_timeout: true
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ wait.completed }}"
                          sequence:
                            - action: input_boolean.turn_on
                              target:
                                entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                            - action: timer.start
                              target:
                                entity_id: timer.topfloor_lock_after_up
                              data:
                                duration: 90
                            - action: input_text.set_value
                              target:
                                entity_id: input_text.topfloor_debug_last_decision
                              data:
                                value: 上樓成立（尾隨寬限，全黑 + 非睡眠窗，黑≥15s 或非剛關燈）
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ debug_on }}"
                                  sequence:
                                    - action: script.notify_dispatch
                                      data:
                                        level: info
                                        line: false
                                        source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                                        version: "{{ automation_version | default('', true) }}"
                                        title: "[DEBUG] 決策"
                                        message: 上樓成立（尾隨寬限，全黑 + 非睡眠窗，黑≥15s 或非剛關燈）
                            - stop: 上樓成立（尾隨寬限）
            - choose:
                - conditions:
                    - condition: state
                      entity_id: timer.topfloor_lock_after_up
                      state: idle
                    - condition: template
                      value_template: "{{ tail_grace_down_sec|int > 0 }}"
                  sequence:
                    - wait_template: "{{ (not upstairs_present_down) and lights_off_or_dim }}"
                      timeout: >
                        {{ '%02d:%02d:%02d'|format((tail_grace_down_sec//3600),
                        ((tail_grace_down_sec%3600)//60),
                        (tail_grace_down_sec%60)) }}
                      continue_on_timeout: true
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ wait.completed }}"
                          sequence:
                            - action: input_boolean.turn_on
                              target:
                                entity_id: input_boolean.ding_lou_xia_lou_qing_jing
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.ding_lou_shang_lou_qing_jing
                            - action: timer.start
                              target:
                                entity_id: timer.topfloor_lock_after_down
                              data:
                                duration: 90
                            - action: input_text.set_value
                              target:
                                entity_id: input_text.topfloor_debug_last_decision
                              data:
                                value: 下樓成立（尾隨寬限）
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ debug_on }}"
                                  sequence:
                                    - action: script.notify_dispatch
                                      data:
                                        level: info
                                        line: false
                                        source: "08-5F頂樓自動上下樓情境AI (V4.0.0)"
                                        version: "{{ automation_version | default('', true) }}"
                                        title: "[DEBUG] 決策"
                                        message: 下樓成立（尾隨寬限）
                            - stop: 下樓成立（尾隨寬限）
  variables:
    automation_version: "V4.0.4"
    iphone_entity: >
      {% set s = states('input_text.iphone_tracker_entity_kenny') %} {{
      'device_tracker.iphone_17_pro_max_kenny' if s in
      ['unknown','unavailable',''] else s }}
    ap_list_raw: >
      {% set s = states('input_text.topfloor_ap_macs_5f') %} {{
      '70:a7:41:e4:54:1f,70:a7:41:e4:5a:bf,d0:21:f9:f2:fc:4c' if s in
      ['unknown','unavailable',''] else s }}
    ap_list: >
      {{ ap_list_raw | lower | replace(' ','') | replace(';',',') |
      regex_findall('[^,]+') }}
    iphone_ap: "{{ states('sensor.kenny_phone_ap_mac') }}"
    upstairs_phone_raw: "{{ iphone_ap in ap_list }}"
    iphone_ap_valid: "{{ iphone_ap not in ['', 'unknown', 'unavailable', none] }}"
    upstairs_present_up: "{{ upstairs_phone_raw }}"
    upstairs_present_down: |
      {% if iphone_ap_valid %}
        {{ upstairs_phone_raw }}
      {% else %}
        true
      {% endif %}
    lamp1_on: "{{ is_state('light.yeelink_lamp2_678c_light', 'on') }}"
    lamp2_on: "{{ is_state('light.yeelink_bslamp2_4329_light', 'on') }}"
    lamp2_bri: >-
      {{ (state_attr('light.yeelink_bslamp2_4329_light', 'brightness') | int(0))
      }}
    lights_all_off: "{{ (not lamp1_on) and (not lamp2_on) }}"
    lights_off_or_dim: "{{ (not lamp1_on) and (not lamp2_on or lamp2_bri <= 3) }}"
    light_off_cooldown_sec: "{{ states('input_number.topfloor_light_off_cooldown_sec_kenny')|int(30) }}"
    recent_light_off: >
      {% set now_ts = as_timestamp(now()) %} {% set l1 =
      states.light.yeelink_lamp2_678c_light %} {% set l2 =
      states.light.yeelink_bslamp2_4329_light %} {% set off1 = (l1.state == 'off')
      and ((now_ts - as_timestamp(l1.last_changed)) <
      (light_off_cooldown_sec|int)) %} {% set off2 = (l2.state == 'off') and
      ((now_ts - as_timestamp(l2.last_changed)) < (light_off_cooldown_sec|int)) %}
      {{ off1 or off2 }}
    dark_15s: >
      {% set now_ts = as_timestamp(now()) %} {% set l1 =
      states.light.yeelink_lamp2_678c_light %} {% set l2 =
      states.light.yeelink_bslamp2_4329_light %} {% set l1_ok = (l1.state ==
      'off') and ((now_ts - as_timestamp(l1.last_changed)) >= 15) %} {% set l2_ok
      = ((l2.state == 'off') or
      ((state_attr('light.yeelink_bslamp2_4329_light','brightness')|int(0)) <= 3))
      and ((now_ts - as_timestamp(l2.last_changed)) >= 15) %} {{ l1_ok and l2_ok
      }}
    monitor_window_sec: "{{ (states('input_number.topfloor_cam_window_min_kenny')|int(6)) * 60 }}"
    tail_grace_up_sec: "{{ (states('input_number.topfloor_tail_grace_up_min_kenny')|int(3)) * 60 }}"
    tail_grace_down_sec: >-
      {{ (states('input_number.topfloor_tail_grace_down_min_kenny')|int(3)) * 60
      }}
    up_stable_hms: "00:00:15"
    down_stable_hms: "00:00:20"
    down_no_light_grace_sec: "{{ states('input_number.topfloor_down_no_light_grace_sec_kenny')|int(120) }}"
    down_no_light_hms: >
      {{ '%02d:%02d:%02d'|format((down_no_light_grace_sec//3600),
      ((down_no_light_grace_sec%3600)//60), (down_no_light_grace_sec%60)) }}
    down_assist_wait_sec: "{{ states('input_number.topfloor_down_assist_wait_sec_kenny')|int(180) }}"
    down_assist_hms: >
      {{ '%02d:%02d:%02d'|format((down_assist_wait_sec//3600),
      ((down_assist_wait_sec%3600)//60), (down_assist_wait_sec%60)) }}
    lamp_was_on_recently: >
      {% set now_ts = as_timestamp(now()) %} {% set l1 =
      states.light.yeelink_lamp2_678c_light %} {% set l2 =
      states.light.yeelink_bslamp2_4329_light %} {% set on1 = (l1.state == 'on')
      or ((now_ts - as_timestamp(l1.last_changed)) < 60 and l1.state == 'off') %}
      {% set on2 = (l2.state == 'on') or ((now_ts - as_timestamp(l2.last_changed))
      < 60 and l2.state == 'off') %} {{ on1 or on2 }}
    sleep_silent_active: "{{ is_state('input_boolean.sleep_silent_active', 'on') }}"
    guard_active: "{{ not is_state('timer.topfloor_down_intent_guard','idle') }}"
    lock_up_active: "{{ not is_state('timer.topfloor_lock_after_up','idle') }}"
    lock_down_active: "{{ not is_state('timer.topfloor_lock_after_down','idle') }}"
    debug_on: "{{ is_state('input_boolean.debug_topfloor_kenny', 'on') }}"

- alias: 08-5F頂樓下樓補判AI (V4.0.1)
  id: ai_topfloor_down_assist_v4
  description: >
    補主流程的漏洞：上樓後 90 秒鎖內就下樓時，主流程在鎖內看到「iPhone 離開頂樓 AP」被略過，之後不再重判。
    此補判：iPhone 連續 2 分鐘不在頂樓 AP（且 AP 有效）、下樓鎖已過 → 設定下樓情境（同主流程）。
  mode: single
  triggers:
    - trigger: template
      for: "00:02:00"
      value_template: >-
        {% set s1 = states('input_text.iphone_tracker_entity_kenny') %}
        {% set ent = 'device_tracker.iphone_17_pro_max_kenny' if s1 in ['unknown','unavailable',''] else s1 %}
        {% set ap = states('sensor.kenny_phone_ap_mac') %}
        {% set raw = states('input_text.topfloor_ap_macs_5f') %}
        {% set lst = ('70:a7:41:e4:54:1f,70:a7:41:e4:5a:bf,d0:21:f9:f2:fc:4c' if raw in ['unknown','unavailable',''] else raw) | lower | replace(' ','') | replace(';',',') | regex_findall('[^,]+') %}
        {{ ap not in ['', 'unknown', 'unavailable'] and ap not in lst and is_state('device_tracker.iphone_17_pro_max_kenny', 'home') }}
  conditions:
    - condition: state
      entity_id: input_boolean.ding_lou_xia_lou_qing_jing
      state: "off"
    - condition: state
      entity_id: timer.topfloor_lock_after_up
      state: idle
    - condition: state
      entity_id: timer.topfloor_lock_after_down
      state: idle
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ding_lou_xia_lou_qing_jing
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ding_lou_shang_lou_qing_jing
    - action: timer.start
      target:
        entity_id: timer.topfloor_lock_after_down
      data:
        duration: 90
    - action: input_text.set_value
      target:
        entity_id: input_text.topfloor_debug_last_decision
      data:
        value: 下樓補判成立（iPhone 連續 2 分鐘不在頂樓 AP）

# ─────────────────────────────────────────────────────────────
# 08-5L頂樓情境廣播AI (V4.3.0)
# 相容版本：Helpers V4.0.0（已確認）
# 更新紀錄（統一格式）：
# - V4.3.0（2026-10-26）：隨 AI 4.3.0 發布統一版號（異動內容見下方 V4.2.x 條目）。
# - V4.2.5：每次下樓情境都記時間（topfloor_last_down_any），上樓廣播腳本用它判斷短暫下樓再上樓不重播。
# - V4.2.4：新增。頂樓上樓／下樓／夜燈情境開關打開時，啟動 script.topfloor_scene_announce 在頂樓 HomePod 播報
#           （人在不在頂樓、早上才播、夜燈接續音樂等判斷都在腳本內）。這支只負責轉交，不阻塞原本的情境動作。
# ─────────────────────────────────────────────────────────────
- alias: 08-5L頂樓情境廣播AI (V4.3.0)
  id: ai_08_5l_topfloor_scene_announce
  description: 上樓／下樓／夜燈情境開啟時，交給頂樓情境廣播腳本播報（溫度、天氣、風扇說明，夜燈後接續音樂）。
  mode: queued
  max: 6
  variables:
    automation_version: "V4.3.0"
  triggers:
    - trigger: state
      entity_id: input_boolean.ding_lou_shang_lou_qing_jing
      to: "on"
      id: up
    - trigger: state
      entity_id: input_boolean.ding_lou_xia_lou_qing_jing
      to: "on"
      id: down
    - trigger: state
      entity_id: input_boolean.ding_lou_ye_deng_qing_jing
      to: "on"
      id: night
  actions:
    # 不論有沒有播報，都記下「最近一次下樓情境」時間；腳本用它判斷「短暫下樓上廁所再上樓」不重播
    - if: "{{ trigger.id == 'down' }}"
      then:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.topfloor_last_down_any
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: script.turn_on
      target:
        entity_id: script.topfloor_scene_announce
      data:
        variables:
          scene: "{{ trigger.id }}"

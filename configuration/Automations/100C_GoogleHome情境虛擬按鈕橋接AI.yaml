# 相容版本：Helpers V4.0.0（已確認）
# 更新紀錄：
# - V4.2.2（2026-10-23）：依 SOP-20 新增 HA 重啟接手（ha_start）：重啟 15 秒後重置所有虛擬按鈕旗標為關閉，避免重啟卡住開關導致後續語音失效。
- id: ai_100c_googlehome_scene_virtual_button_bridge
  alias: 100C GoogleHome情境虛擬按鈕橋接AI (V4.2.2)
  description: Google Home 透過 helper 虛擬按鈕觸發情境自動化，避免 automation 僅被視為啟用開關。
  variables:
    automation_version: 'V4.2.2'
    reset_delay_seconds: 1
  triggers:
    - trigger: homeassistant
      event: start
      id: ha_start
    - trigger: state
      entity_id: input_boolean.google_scene_zao_an_trigger
      to: 'on'
      id: zao_an
    - trigger: state
      entity_id: input_boolean.google_scene_wan_an_trigger
      to: 'on'
      id: wan_an
    - trigger: state
      entity_id: input_boolean.google_scene_dao_jia_trigger
      to: 'on'
      id: dao_jia
    - trigger: state
      entity_id: input_boolean.google_scene_chu_men_trigger
      to: 'on'
      id: chu_men
  conditions: []
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('') == 'ha_start' }}"
      then:
        - delay: "00:00:15"
        - action: input_boolean.turn_off
          target:
            entity_id:
              - input_boolean.google_scene_zao_an_trigger
              - input_boolean.google_scene_wan_an_trigger
              - input_boolean.google_scene_dao_jia_trigger
              - input_boolean.google_scene_chu_men_trigger
        - stop: "HA 重啟重置 GoogleHome 虛擬按鈕完成"
    - choose:
        - conditions:
            - condition: trigger
              id: zao_an
          sequence:
            - action: automation.trigger
              target:
                entity_id: automation.101zao_an_qing_jing
              data:
                skip_condition: true
        - conditions:
            - condition: trigger
              id: wan_an
          sequence:
            - action: automation.trigger
              target:
                entity_id: automation.wan_an_qing_jing
              data:
                skip_condition: true
        - conditions:
            - condition: trigger
              id: dao_jia
          sequence:
            - action: automation.trigger
              target:
                entity_id: automation.103dao_jia_qing_jing
              data:
                skip_condition: true
        - conditions:
            - condition: trigger
              id: chu_men
          sequence:
            - action: automation.trigger
              target:
                entity_id: automation.101li_jia_qing_jing
              data:
                skip_condition: true
    - delay:
        seconds: "{{ reset_delay_seconds }}"
    - if:
        - condition: template
          value_template: "{{ trigger.entity_id is defined }}"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: "{{ trigger.entity_id }}"
  mode: queued
  max: 10

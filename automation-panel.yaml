          - entity: input_number.line_bot_sticky
            name: "主用 Bot（Auto 沿用）"
          - entity: input_boolean.line_bot_test_mode
            name: "測試模式"
          - entity: input_boolean.line_bot_custom_user_enable
            name: "自訂目標 ID 啟用"
          - entity: input_text.line_bot_custom_user_id
            name: "自訂目標 ID"
        card_mod: &cm
          style:
            .: |
              ha-card { overflow: hidden !important; border-radius: 18px !important; border: none !important; box-shadow: 0 1px 2px rgba(0,0,0,.18) !important; padding: 2px 0 !important; --switch-checked-color: #34C759; --switch-checked-button-color: #ffffff; --switch-checked-track-color: #34C759; --switch-unchecked-button-color: #ffffff; --switch-unchecked-track-color: rgba(120,120,128,.32); --mdc-theme-primary: #0A84FF; --primary-color: #0A84FF; --mdc-text-field-fill-color: rgba(120,120,128,.14); --mdc-text-field-idle-line-color: transparent; --mdc-text-field-hover-line-color: transparent; --mdc-text-field-disabled-line-color: transparent; --mdc-shape-small: 10px; --mdc-select-fill-color: rgba(120,120,128,.14); --mdc-select-idle-line-color: transparent; --mdc-select-hover-line-color: transparent; --mdc-text-field-label-ink-color: var(--secondary-text-color); } #states { padding: 4px 16px !important; } #states > * { margin: 0 !important; padding: 9px 0 !important; } #states > * + * { border-top: 0.5px solid rgba(128,128,128,.28); }
            hui-toggle-entity-row:
              $:
                hui-generic-entity-row:
                  $: |
                    .info, .info > * { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 1.35; font-size: 15px; } state-badge { width: 32px; height: 32px; min-width: 32px; border-radius: 9px; margin-right: 4px; background: rgba(10,132,255,.14); color: #0A84FF; --mdc-icon-size: 19px; display: flex; align-items: center; justify-content: center; } mwc-button, ha-button { --mdc-theme-primary: #0A84FF; font-weight: 600; }
            hui-input-number-entity-row:
              $:
                hui-generic-entity-row:
                  $: |
                    .info, .info > * { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 1.35; font-size: 15px; } state-badge { width: 32px; height: 32px; min-width: 32px; border-radius: 9px; margin-right: 4px; background: rgba(10,132,255,.14); color: #0A84FF; --mdc-icon-size: 19px; display: flex; align-items: center; justify-content: center; } mwc-button, ha-button { --mdc-theme-primary: #0A84FF; font-weight: 600; }
            hui-input-select-entity-row:
              $:
                hui-generic-entity-row:
                  $: |
                    .info, .info > * { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 1.35; font-size: 15px; } state-badge { width: 32px; height: 32px; min-width: 32px; border-radius: 9px; margin-right: 4px; background: rgba(10,132,255,.14); color: #0A84FF; --mdc-icon-size: 19px; display: flex; align-items: center; justify-content: center; } mwc-button, ha-button { --mdc-theme-primary: #0A84FF; font-weight: 600; }
            hui-input-text-entity-row:
              $:
                hui-generic-entity-row:
                  $: |
                    .info, .info > * { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 1.35; font-size: 15px; } state-badge { width: 32px; height: 32px; min-width: 32px; border-radius: 9px; margin-right: 4px; background: rgba(10,132,255,.14); color: #0A84FF; --mdc-icon-size: 19px; display: flex; align-items: center; justify-content: center; } mwc-button, ha-button { --mdc-theme-primary: #0A84FF; font-weight: 600; }
            hui-input-datetime-entity-row:
              $:

        content: "{% set P = [('kenny','Kenny'),('iris','Iris'),('jerry','Jerry'),('elay','Elay')] %}| 家人 | person 狀態 | person 目前參考的裝置 | 該裝置狀態 |\n|---|---|---|---|\n{% for k, n in P %}{% set sn = 'sensor.person_' ~ k ~ '_source_device' %}| **{{ n }}** | {{ '在家' if is_state('person.' ~ k, 'home') else ('離家' if is_state('person.' ~ k, 'not_home') else states('person.' ~ k)) }} | {{ states(sn) }}<br><sub>{{ state_attr(sn, 'source_entity') }}</sub> | {{ '在家' if state_attr(sn, 'source_state') == 'home' else ('離家' if state_attr(sn, 'source_state') == 'not_home' else state_attr(sn, 'source_state')) }} |\n{% endfor %}\n<sub>person.* 是 YAML 定義，在不在家都由它參考的裝置決定。在下面選「主要裝置」會改寫 persons.yaml 並重新載入 person；為避免切換後在家狀態突然改變而誤觸發離家／到家情境，選的裝置目前的在家狀態必須和該家人目前一致，否則會退回原選項並發 HA 通知。清單沒有的裝置：選「其他」，並在自訂裝置欄位輸入 device_tracker.xxx（小寫英數底線，裝置名稱可到 設定 > 裝置與服務 > 實體 搜尋 device_tracker）。</sub>"

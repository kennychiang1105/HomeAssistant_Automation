        - type: custom:button-card
          entity: sensor.battery_forecast
          show_name: false
          show_icon: false
          show_state: false
          styles:
            card:
              - border-radius: 18px
              - border: none
              - box-shadow: 0 1px 2px rgba(0,0,0,.18)

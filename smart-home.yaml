# 智慧家庭（橫向＋直向合併版，UI4.1）：「家」頁依螢幕方向切換（橫向＝左側選單＋3D 地圖；直向＝直向地圖＋人員＋按鈕），
# 其餘頁面兩種方向內容相同。由 scripts/merge_dashboards.py 依 new-ui.yaml 與 new-ui-portrait.yaml 產生；之後調整仍可分別改原檔再重新產生。
button_card_templates: !include 'floorplan_v4/ios_templates.yaml'
title: 智慧家庭
views:
- title: 家
  path: home
  icon: mdi:cube-scan
  type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1fr)
    grid-gap: 0px
    margin: 0 auto
  cards:
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - condition: screen
        media_query: '(orientation: landscape)'
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 290px minmax(0, 1fr)
          grid-template-areas: '"nav map"'
          grid-gap: 12px
          margin: 0 auto
          mediaquery:
            '(max-width: 1280px)':
              grid-template-columns: 255px minmax(0, 1fr)
              grid-gap: 10px
            '(min-width: 1500px)':
              grid-template-columns: 350px minmax(0, 1fr)
            '(min-width: 1800px)':
              grid-template-columns: 420px minmax(0, 1fr)
            '(min-width: 2200px)':
              grid-template-columns: 470px minmax(0, 1fr)
        cards:
        - type: vertical-stack
          view_layout:
            grid-area: nav
          cards:
          - type: custom:floorplan-v4-sidebar
        - type: vertical-stack
          view_layout:
            grid-area: map
          cards:
          - !include 'floorplan_v4/map3d_landscape.yaml'
    - type: conditional
      conditions:
      - condition: screen
        media_query: '(orientation: portrait)'
      card:
        type: vertical-stack
        cards:
        - !include 'floorplan_v4/map3d_portrait.yaml'
        - type: custom:floorplan-v4-people
        - type: custom:floorplan-v4-sidebar
          compact: true
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            template: ios_alarm_card
            entity: alarm_control_panel.54ef44cf58f9_alarm
            name: 保全系統
            icon: mdi:shield-home
          - type: custom:button-card
            template: ios_lock_card
            entity: lock.er_lou_men_suo
            name: 二樓門鎖
            icon: mdi:lock
          - type: custom:button-card
            template: ios_cover_card
            entity: cover.garage
            name: 車庫鐵門
            icon: mdi:garage-variant
          - type: custom:button-card
            template: ios_device_card
            entity: input_boolean.5f_security_temp_disable
            name: 五樓保全暫解
            icon: mdi:shield-off
        - !include 'floorplan_v4/controls_card.yaml'

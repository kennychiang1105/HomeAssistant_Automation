- title: 自動化管理
  path: automation-link
  icon: mdi:cog-outline
  type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1fr)
    grid-gap: 8px
    margin: 0 auto
  cards:
  - type: custom:button-card
    name: 前往自動化管理
    icon: mdi:cog-outline
    show_state: false
    # 點這個分頁會自動跳到「自動化管理」面板的第一頁（總覽）；沒有跳轉時點這張卡片
    tap_action:
      action: navigate
      navigation_path: /lovelace-automation/overview
    custom_fields:
      go: |
        [[[
          if (!window.__goPanel || Date.now() - window.__goPanel > 1500) {
            window.__goPanel = Date.now();
            setTimeout(() => { history.pushState(null, '', '/lovelace-automation/overview'); window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false } })); }, 0);
          }
          return '<div style="padding:6px 0;color:var(--secondary-text-color)">正在前往自動化管理…</div>';
        ]]]

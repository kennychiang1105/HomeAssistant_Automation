# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V4.0.0)
# 更新重點（V4.0.0）：扁平卡片標題色塊自動配主題圖示（門鈴/鐵門/門鎖/電量/保全/天氣/地震…）；標題含緊急/重要且與鐵門或車庫有關的純文字 LINE，自動附車庫截圖、即時影像與家庭 App 按鈕；Bot 額度「即將切換」與「額度已用盡」管理者通知改為扁平卡片（重要橘／緊急紅）；send_line_to_user 的扁平卡片轉換擴大涵蓋：標題內含等級字樣、完全沒有等級、只有單一泡泡的純文字 LINE，一律轉成扁平卡片（無法判斷等級者視為「一般」藍色）；非純文字（Flex/災防等）原樣送出。
# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V1.14)
# 更新重點（V1.14）：舊格式合併卡片偵測到網址時，底部加「開啟連結」按鈕（可點擊）。
# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V1.13)
# 更新重點（V1.13）：重要/緊急的舊格式 LINE 送出後呼叫 script.mood_alert（氣氛燈提醒）。
# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V1.12)
# 更新重點（V1.12）：
# 0) 新增 source 欄位：卡片底部顯示來源自動化名稱（各自動化呼叫時帶入）；版本號可由來源名稱補齊。
# 0) 修正：payload 若被 HA 自動解析成 list 也能處理（V1.12 初版僅處理字串，會導致舊格式訊息變成空陣列而 400）。
# 1) send_line_to_user 自動將「標題 + 等級 + 內文」多泡泡純文字轉為 1 則扁平 Flex 卡片（依緊急/重要/一般配色，附版本號與時間）；
#    同時減少訊息則數以節省額度。非此格式（災防、Flex、單泡泡）原樣送出。
# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V1.11)
# 相容版本：Helpers V4.0.0（已確認）
# 更新重點（V4.0.0 補）：「LINE Bot 即將切換」預告改成同一個 Bot 只發一次（原本剩餘則數一變就又發一則）。
# 更新重點（V1.11）：
# 1) Auto 模式改為「沿用主用 Bot」：以 input_number.line_bot_sticky 記住目前主用 Bot（1~3），
#    用量達 196 才依 主用→下一個(1→2→3 循環) 切換；Bot0 仍為最後備援。每月額度重置後不再回到 Bot1，減少切換次數。
# 2) 修正「X 次後將切換 Bot」提醒：改以切換門檻 196（而非 200）計算剩餘則數，並顯示下一個 Bot；
#    僅 Bot1~3 在距離切換剩 1~12 個額度時預告（剩餘額度低於 5 即切換，因群組訊息一次可能耗約 5 額度），且同一 Bot 只預告一次（每月用量重置後 Bot 編號與剩餘則數回到安全範圍時，鍵會被清掉）（input_text.line_bot_last_notice_key）。
# 3) line_bot_rotation_target 新增屬性 next_bot / sticky_bot。已切換通知改由 00-2B 偵測切換事件發送。
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V1.10)
# 更新重點（V1.10）：
# 1) 額度計算門檻調整：switch_limit 改為 195，剩餘額度低於 5 則視為完全用盡（r < 5）。
# 2) 配額用盡告警去重：新增 input_boolean.line_bot_quota_exhausted_notified 狀態鎖，用盡時僅推播一次告警，不再重複騷擾。
# ─────────────────────────────────────────────────────────────
# LINE Bot 套件 (V1.9)
# 更新重點（V1.9）：
# 1) 配額提醒/最終告警開關改為統一使用通知分級：重要/緊急。
# 2) 保留 V1.8 功能：Auto 模式下，先挑選未達 196 則的可用 Bot；若僅有未知用量的 Bot，依序嘗試 1→2→3→0；完全不可用時才回報額度用盡，不再誤回退到耗盡的 Bot。
# 3) 保留 V1.7 功能：感測器全數暫時無效時回退主力 Bot1，避免顯示額度 0。
# 4) 保留 V1.6 功能：修正 Bot3 顯示名稱缺字，與其他 Bot 命名保持一致。
# 5) 保留 V1.5 功能：集中計算測試模式/自訂 ID/預設 ID，供自動化共用，Manual Bot0 標註緊急 Bot。
# ─────────────────────────────────────────────────────────────

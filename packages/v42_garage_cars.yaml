# ─────────────────────────────────────────────────────────────
# 車庫車輛位置與準備出門偵測（車輛動態辨識系統AI，V4.3.0-beta 1 測試中，正式版預計 V4.3.5）
# 更新紀錄（統一格式）：
# - V4.3.0-beta 6：新增 script.garage_close_safety_check（關門前淨空確認：模型人物偵測＋車燈／煞車燈＋位移＋攝影機人員／動作＋手機位置）；104-2、104-3 自動關門與本檔的誤判關門都先過這關。
# - V4.3.0-beta 7：開關類 helper（出門偵測總開關、左方向燈偵測、自動開鐵門、左方向燈可直接開門、出門通知）拿掉 initial，HA 重啟後保留使用者設定（SOP-20）。原本 initial: false 讓 10/28 HAOS 重開機後自動開鐵門與左轉燈開門被歸零，左轉燈出門時鐵門沒開。
# - V4.2.5：新增。UniFi 攝影機不會把「停很久的車要出門」當成新車輛，所以改用定時畫面分析（scripts/garage_car_watch.py，Pillow＋numpy）：
#   每個車位（front＝前位／靠鐵門＝3D 車位1，back＝後位／內側＝3D 車位2）判斷有沒有車、是哪輛（Luxgen N7／Tesla Model 3）、車燈是否亮起、車身是否位移。
#   - 車位實體：input_select.garage_slot_front／back（empty／unknown／luxgen_n7（EAK8030）／tesla_model3（EBH8030）／其他車輛 sedan 房車、suv 休旅車、motorcycle 機車）；車輛實體：sensor.garage_car_luxgen_n7／tesla_model3
#     （parked_front／parked_back／departing／away／unknown），供 3D 平面圖與 104-2 使用。
#   - 出去可能性：sensor.garage_depart_likelihood（0–100），用離家情境、車庫人員、家人手機連到車庫 AP、車庫燈、充電槍拔除、晚安狀態等現有訊號計算。
#   - 判斷「準備出門」：同一車位連續 2 次有車燈亮起或位移，且可能性達門檻、車輛身分確定。預設只記錄；通知與自動開鐵門各有開關（預設關）。
#   - 自動開鐵門不需要離家情境，改用嚴謹條件（見 script.garage_car_watch_run）；開門後 3 分鐘車位仍沒變空會自動關門（先確認無人）。
# ─────────────────────────────────────────────────────────────
input_boolean:
  garage_turn_signal_enable:
    name: 車庫出門偵測｜左方向燈偵測（絕對出門訊號）
    icon: mdi:car-arrow-left
  garage_turn_signal_open_enable:
    name: 車庫出門偵測｜左方向燈可直接自動開門（需同時開自動開鐵門）
    icon: mdi:garage-open-variant
  garage_turn_detected:
    name: 車庫出門偵測｜剛偵測到左方向燈（內部）
    icon: mdi:car-arrow-left
  garage_vehicle_confirmed:
    name: 充電車輛已由電流確認（內部）
    icon: mdi:check-decagram
  garage_depart_watch_enable:
    name: 車庫出門偵測｜總開關
    icon: mdi:car-clock
  garage_depart_notify_enable:
    name: 車庫出門偵測｜偵測到時通知
    icon: mdi:bell-ring-outline
  garage_depart_auto_open_enable:
    name: 車庫出門偵測｜自動開鐵門
    icon: mdi:garage-open
  garage_depart_candidate:
    name: 車庫出門偵測｜準備出門中（內部）
    icon: mdi:car-arrow-right

input_text:
  garage_depart_last:
    name: 車庫出門偵測｜最近一次
    max: 255
  garage_depart_car:
    name: 車庫出門偵測｜準備出門的車（內部）
    max: 30
  garage_charge_log:
    name: 車庫充電紀錄（最近一次變化）
    max: 255
  garage_id_fix_log:
    name: 車庫車輛身分校正紀錄（最近一次）
    max: 255
  garage_plate_seen:
    name: 車庫攝影機讀到的車牌（影像文字辨識，最近一次）
    max: 255

input_select:
  # 充電車輛鎖定（整段充電維持同一輛，尾端降載電流掉到中間值也不改判）；由 107C 維護
  garage_vehicle_latch:
    name: 充電車輛（鎖定，內部）
    options: [none, luxgen_n7, tesla_model3]
    icon: mdi:ev-station
  garage_vehicle_last:
    name: 最近一次充電的車（內部）
    options: [none, luxgen_n7, tesla_model3]
    icon: mdi:ev-station
  garage_slot_front:
    name: 車庫前位（靠鐵門）
    options: [unknown, empty, luxgen_n7, tesla_model3, sedan, suv, motorcycle]
    icon: mdi:car-back
  garage_slot_back:
    name: 車庫後位（內側）
    options: [unknown, empty, luxgen_n7, tesla_model3, sedan, suv, motorcycle]
    icon: mdi:car-back
  # 車頭朝向：door＝車頭朝鐵門（直接開出去）、inside＝車頭朝內（倒車入庫，出門要倒車）
  garage_facing_front:
    name: 車庫前位車頭朝向
    options: [unknown, door, inside]
    icon: mdi:arrow-left-right
  garage_facing_back:
    name: 車庫後位車頭朝向
    options: [unknown, door, inside]
    icon: mdi:arrow-left-right
  # 充電樁判斷：誰在充電、停在哪個車位（功率比例＋充電線）
  garage_charging_car:
    name: 車庫現在充電的車
    options: [none, unknown, luxgen_n7, tesla_model3]
    icon: mdi:ev-station
  garage_charging_slot:
    name: 車庫現在充電的車位
    options: [none, unknown, front, back]
    icon: mdi:ev-plug-tesla
  # 樣板學習（面板上選好再按「學習」）：把「現在這張畫面」的指定車位學成某輛車／空位
  garage_learn_slot:
    name: 學習｜車位
    options: [front, back]
    icon: mdi:car-select
  garage_learn_car:
    name: 學習｜這個車位現在是
    options: [luxgen_n7, tesla_model3, sedan, suv, motorcycle, empty]
    icon: mdi:car-info
  garage_learn_facing:
    name: 學習｜車頭朝向
    options: [door, inside]
    icon: mdi:arrow-left-right

input_button:
  garage_learn_do:
    name: 學習｜用現在的畫面學習
    icon: mdi:school

input_number:
  lpr_close_buffer_sec:
    name: LPR關門前安全緩衝（秒）
    min: 15
    max: 180
    step: 5
    initial: 45
    unit_of_measurement: s
    mode: slider
    icon: mdi:timer-sand
  garage_depart_likelihood_min:
    name: 車庫出門偵測｜可能性門檻
    min: 0
    max: 100
    step: 5
    initial: 70
    mode: slider
  garage_ev_front:
    name: 車庫前位｜連續有車燈／位移次數（內部）
    min: 0
    max: 20
    step: 1
    mode: box
  garage_ev_back:
    name: 車庫後位｜連續有車燈／位移次數（內部）
    min: 0
    max: 20
    step: 1
    mode: box

input_datetime:
  tesla_charger_connected_at:
    name: 充電槍插上時間（內部，107B）
    has_date: true
    has_time: true
    initial: "2000-01-01 00:00:00"
  garage_gate_run_last:
    name: 車庫鐵門評估｜上次開始（內部，104-2 去重）
    has_date: true
    has_time: true
    initial: "2000-01-01 00:00:00"
  garage_turn_last:
    name: 車庫左方向燈偵測｜上次檢查（內部，30 秒冷卻）
    has_date: true
    has_time: true
    initial: "2000-01-01 00:00:00"
  garage_id_fix_last:
    name: 車庫車輛身分校正｜上次重學樣板（內部）
    has_date: true
    has_time: true
    initial: "2000-01-01 00:00:00"
  garage_cable_learn_last:
    name: 車庫充電線樣板｜上次學習（內部）
    has_date: true
    has_time: true
    initial: "2000-01-01 00:00:00"
  garage_depart_last_open:
    name: 車庫出門偵測｜上次自動開門
    has_date: true
    has_time: true
    initial: "2000-01-01 00:00:00"

shell_command:
  garage_turn_signal: 'python3 /config/scripts/garage_turn_signal.py --clip /config/www/snap/turn_clip.mp4 --slot {{ slot }} --vision http://local-garage-vision:8099 --delete'
  garage_car_watch: 'env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 /config/scripts/garage_car_watch.py --snapshot /config/www/snap/snap_gcur_52cd9975e2259496944fc869.jpg --vision http://local-garage-vision:8099 --csv {{ gate }} {{ nolearn }}'
  garage_car_learn: 'env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python3 /config/scripts/garage_car_watch.py --snapshot /config/www/snap/snap_gcur_52cd9975e2259496944fc869.jpg --vision http://local-garage-vision:8099 {{ arg }}'

template:
  # 現在是哪輛車在充電：由 107C 依「充電樁狀態＋車輛電流」鎖定（Tesla ≈24.7 A、Luxgen ≈31.3 A，26～28 A 沒有重疊；
  # ≥28 A 確定是 Luxgen，確定後尾端降載電流掉到中間值也不改判）。HomeKit 充電 helper、107 充電通知都吃這一個。
  - sensor:
      - name: garage_charging_vehicle
        unique_id: garage_charging_vehicle
        icon: mdi:ev-station
        state: "{{ states('input_select.garage_vehicle_latch') }}"
        attributes:
          current_a: "{{ states('sensor.che_ku_tesla_wall_connector_vehicle_current') }}"
          status: "{{ states('sensor.tesla_wall_connector_status') }}"
          confirmed: "{{ states('input_boolean.garage_vehicle_confirmed') }}"
          last: "{{ states('input_select.garage_vehicle_last') }}"
  - sensor:
      - name: garage_car_luxgen_n7
        unique_id: garage_car_luxgen_n7
        icon: mdi:car-electric
        state: >-
          {% set f = states('input_select.garage_slot_front') %}{% set b = states('input_select.garage_slot_back') %}
          {% set dep = is_state('input_boolean.garage_depart_candidate', 'on') and is_state('input_text.garage_depart_car', 'luxgen_n7') %}
          {% if f == 'luxgen_n7' or b == 'luxgen_n7' %}{{ 'departing' if dep else ('parked_front' if f == 'luxgen_n7' else 'parked_back') }}
          {% elif 'unknown' in [f, b] %}unknown{% else %}away{% endif %}
        attributes:
          label: Luxgen N7
          plate: EAK8030
          vehicle_type: suv
          vehicle_type_name: 休旅車
          slot: >-
            {{ 'front' if is_state('input_select.garage_slot_front', 'luxgen_n7') else ('back' if is_state('input_select.garage_slot_back', 'luxgen_n7') else 'none') }}
          facing: >-
            {{ states('input_select.garage_facing_front') if is_state('input_select.garage_slot_front', 'luxgen_n7') else (states('input_select.garage_facing_back') if is_state('input_select.garage_slot_back', 'luxgen_n7') else 'unknown') }}
      - name: garage_car_tesla_model3
        unique_id: garage_car_tesla_model3
        icon: mdi:car-electric
        state: >-
          {% set f = states('input_select.garage_slot_front') %}{% set b = states('input_select.garage_slot_back') %}
          {% set dep = is_state('input_boolean.garage_depart_candidate', 'on') and is_state('input_text.garage_depart_car', 'tesla_model3') %}
          {% if f == 'tesla_model3' or b == 'tesla_model3' %}{{ 'departing' if dep else ('parked_front' if f == 'tesla_model3' else 'parked_back') }}
          {% elif 'unknown' in [f, b] %}unknown{% else %}away{% endif %}
        attributes:
          label: Tesla Model 3
          plate: EBH8030
          vehicle_type: sedan
          vehicle_type_name: 房車
          slot: >-
            {{ 'front' if is_state('input_select.garage_slot_front', 'tesla_model3') else ('back' if is_state('input_select.garage_slot_back', 'tesla_model3') else 'none') }}
          facing: >-
            {{ states('input_select.garage_facing_front') if is_state('input_select.garage_slot_front', 'tesla_model3') else (states('input_select.garage_facing_back') if is_state('input_select.garage_slot_back', 'tesla_model3') else 'unknown') }}
      # 出去可能性（0–100）：用現有訊號估計「現在有人要開車出門」的程度（V1，權重可再依實測調整）
      - name: garage_depart_likelihood
        unique_id: garage_depart_likelihood
        icon: mdi:chart-bell-curve
        unit_of_measurement: "%"
        state: "{{ [0, [100, this.attributes.get('raw', 0) | int(0)] | min] | max }}"
        availability: "{{ true }}"
        attributes:
          reasons: >-
            {% set r = [] %}
            {% set locs = [states('sensor.at_home_kenny_location'), states('sensor.at_home_iris_location'), states('sensor.at_home_jerry_location'), states('sensor.at_home_elay_location')] %}
            {% if is_state('input_boolean.google_scene_chu_men_trigger', 'on') or is_state('input_boolean.aqara_li_jia', 'on') %}{% set r = r + ['離家情境:+35'] %}{% endif %}
            {% if is_state('binary_sensor.che_ku_she_ying_ji_person_detected', 'on') %}{% set r = r + ['車庫有人:+20'] %}{% endif %}
            {% if '車庫' in locs %}{% set r = r + ['家人手機連到車庫AP:+25'] %}{% endif %}
            {% if is_state('switch.che_ku_zhu_deng', 'on') %}{% set r = r + ['車庫燈亮:+10'] %}{% endif %}
            {% if is_state('binary_sensor.tesla_wall_connector_vehicle_connected', 'off') and (now() - states.binary_sensor.tesla_wall_connector_vehicle_connected.last_changed).total_seconds() < 900 %}{% set r = r + ['充電槍剛拔除:+25'] %}{% endif %}
            {% set wd = states('sensor.tw_day_type_today') %}{% set h = now().hour %}
            {% if (wd == 'workday' and 6 <= h <= 9) or (wd != 'workday' and 8 <= h <= 11) %}{% set r = r + ['常見出門時段:+10'] %}{% endif %}
            {% if is_state('input_boolean.aqara_wan_an', 'on') or is_state('input_boolean.sleep_silent_active', 'on') %}{% set r = r + ['晚安/熟睡中:-40'] %}{% endif %}
            {{ r }}
          raw: >-
            {% set locs = [states('sensor.at_home_kenny_location'), states('sensor.at_home_iris_location'), states('sensor.at_home_jerry_location'), states('sensor.at_home_elay_location')] %}
            {% set wd = states('sensor.tw_day_type_today') %}{% set h = now().hour %}
            {{ (35 if (is_state('input_boolean.google_scene_chu_men_trigger', 'on') or is_state('input_boolean.aqara_li_jia', 'on')) else 0)
               + (20 if is_state('binary_sensor.che_ku_she_ying_ji_person_detected', 'on') else 0)
               + (25 if '車庫' in locs else 0)
               + (10 if is_state('switch.che_ku_zhu_deng', 'on') else 0)
               + (25 if (is_state('binary_sensor.tesla_wall_connector_vehicle_connected', 'off') and (now() - states.binary_sensor.tesla_wall_connector_vehicle_connected.last_changed).total_seconds() < 900) else 0)
               + (10 if ((wd == 'workday' and 6 <= h <= 9) or (wd != 'workday' and 8 <= h <= 11)) else 0)
               - (40 if (is_state('input_boolean.aqara_wan_an', 'on') or is_state('input_boolean.sleep_silent_active', 'on')) else 0) }}

script:
  garage_close_safety_check:
    alias: 車庫關門前淨空確認AI (V4.3.0-beta 6)
    description: 自動關鐵門前呼叫：用車庫畫面模型（人物偵測＋車燈／煞車燈＋車身位移）加攝影機人員偵測、動作偵測、家人手機位置，確認沒人且車輛沒有要動。回傳 safe 與原因；模型無法使用時改用感測器判斷。
    mode: queued
    max: 3
    sequence:
      - action: camera.snapshot
        target:
          entity_id: camera.g6_instant_high_resolution_channel
        data:
          filename: /config/www/snap/snap_gcur_52cd9975e2259496944fc869.jpg
        continue_on_error: true
      - delay: "00:00:00.5"
      - action: shell_command.garage_car_watch
        data:
          gate: "--gate-recent"
          nolearn: "--no-learn --safety"
        response_variable: r
        continue_on_error: true
      - variables:
          res: "{{ (r.stdout | from_json({})) if (r is defined and r is mapping and r.get('stdout')) else {} }}"
          vis: "{{ res.get('vision') if (res is mapping and res.get('vision') is mapping) else {} }}"
          model_ok: "{{ res is mapping and res.get('slots') is mapping and vis.get('persons') is not none and vis.get('persons') is iterable and not vis.get('error') }}"
          n_person: "{{ (vis.get('persons') | length) if model_ok else 0 }}"
          lit: >-
            {% set ns = namespace(l=[]) %}{% if model_ok %}{% for k, s in res.slots.items() %}{% if s.present and s.lights_on %}{% set ns.l = ns.l + [({'front': '前位', 'back': '後位'}.get(k, k))] %}{% endif %}{% endfor %}{% endif %}{{ ns.l | join('、') }}
          mov: >-
            {% set ns = namespace(l=[]) %}{% if model_ok %}{% for k, s in res.slots.items() %}{% if s.present and s.moved %}{% set ns.l = ns.l + [({'front': '前位', 'back': '後位'}.get(k, k))] %}{% endif %}{% endfor %}{% endif %}{{ ns.l | join('、') }}
          cam_person: "{{ is_state('binary_sensor.che_ku_she_ying_ji_person_detected', 'on') }}"
          cam_motion: "{{ is_state('binary_sensor.g6_instant_motion', 'on') }}"
          phone_in: "{{ '車庫' in [states('sensor.at_home_kenny_location'), states('sensor.at_home_iris_location'), states('sensor.at_home_jerry_location'), states('sensor.at_home_elay_location')] }}"
          # 車位在最近 3 分鐘內「變成有車」（車子在車庫內挪位置、剛倒車進來／換位置）＝車上可能還有人，車庫攝影機人員偵測看不到車裡的人
          moved_in: >-
            {% set ns = namespace(l=[]) %}{% for e, n in [('input_select.garage_slot_front', '前位'), ('input_select.garage_slot_back', '後位')] %}{% if not is_state(e, 'empty') and (as_timestamp(now()) - as_timestamp(states[e].last_changed)) < 180 %}{% set ns.l = ns.l + [n] %}{% endif %}{% endfor %}{{ ns.l | join('、') }}
          reasons: >-
            {% set r = [] %}
            {% if n_person | int(0) > 0 %}{% set r = r + ['畫面辨識到有人（' ~ n_person ~ ' 人）'] %}{% endif %}
            {% if lit | trim != '' %}{% set r = r + [lit ~ '車輛車燈／煞車燈亮著'] %}{% endif %}
            {% if mov | trim != '' %}{% set r = r + [mov ~ '車輛在移動'] %}{% endif %}
            {% if cam_person %}{% set r = r + ['攝影機偵測到人員'] %}{% endif %}
            {% if cam_motion %}{% set r = r + ['攝影機偵測到動作'] %}{% endif %}
            {% if phone_in %}{% set r = r + ['家人手機連在車庫 AP'] %}{% endif %}
            {% if moved_in | trim != '' %}{% set r = r + [moved_in ~ '剛有車輛挪動／進入（3 分鐘內），車上可能還有人'] %}{% endif %}
            {{ r | to_json }}
          rs: "{{ reasons | from_json([]) }}"
          result: "{{ {'safe': (rs | length) == 0, 'reasons': rs, 'model': model_ok} }}"
      - stop: 淨空確認完成
        response_variable: result

  garage_gate_close_retry:
    alias: 鐵門未關重試關門AI (V4.3.1)
    description: 104-3 取消自動關門（有人車活動、AP 有人、淨空確認未通過）後接手：每 10 分鐘重判一次，最多 12 次（約 2 小時）；條件都安靜且淨空確認通過就關門，鐵門自己關上就結束，最後仍沒關成功發一則重要通知，並一律廣播（客廳 HomePod＋車庫攝影機喇叭），請自己關門。
    mode: single
    sequence:
      - repeat:
          count: 12
          sequence:
            - wait_for_trigger:
                - trigger: state
                  entity_id: cover.garage
                  to: "closed"
              timeout:
                minutes: 10
              continue_on_timeout: true
            - if: "{{ wait.trigger is not none or not is_state('cover.garage', 'open') }}"
              then:
                - stop: "鐵門已關閉，結束重試"
            - if: >-
                {{ is_state('binary_sensor.che_ku_she_ying_ji_person_detected', 'off')
                   and is_state('binary_sensor.che_ku_she_ying_ji_vehicle_detected', 'off')
                   and is_state('binary_sensor.che_ku_wa_fi_gan_ying_zong_he_pan_duan', 'off')
                   and (as_timestamp(now()) - as_timestamp(states.binary_sensor.che_ku_she_ying_ji_person_detected.last_changed)) > 180
                   and (as_timestamp(now()) - as_timestamp(states.binary_sensor.che_ku_she_ying_ji_vehicle_detected.last_changed)) > 180 }}
              then:
                - action: script.garage_close_safety_check
                  response_variable: sf
                - if: "{{ sf is mapping and sf.get('safe') == true and is_state('cover.garage', 'open') }}"
                  then:
                    - action: automation.trigger
                      target:
                        entity_id: automation.tie_men_kai_guan
                    - action: script.notify_dispatch
                      data:
                        level: important
                        line: false
                        source: "鐵門未關重試關門AI (V4.3.1)"
                        version: V4.3.1
                        title: "鐵門已自動關閉（重試）"
                        message: |-
                          第 {{ repeat.index }} 次重試：人車安靜、車庫 AP 無人，模型淨空確認通過，已下達關門。
                    - stop: "重試成功"
      - if: "{{ is_state('cover.garage', 'open') }}"
        then:
          - action: script.notify_dispatch
            data:
              level: important
              source: "鐵門未關重試關門AI (V4.3.1)"
              version: V4.3.1
              title: "鐵門開超過 2 小時仍無法自動關閉"
              user_id: "{{ states('sensor.line_bot_target_user_id') }}"
              message: |-
                鐵門仍開啟，已重試 12 次（約 2 小時）仍不符合自動關門條件（有人車活動、車庫 AP 有人，或模型淨空確認未通過）。
                系統不會再自動關門，請自己關門（若是刻意開著工作，忽略即可）。
          # 同時廣播：客廳 HomePod ＋ 車庫攝影機喇叭（一律廣播，不看熟睡／晚安）
          - action: script.announce
            data:
              level: important
              message: 鐵門已經開超過兩小時，系統不會再自動關門，請自己關門。
              player:
                - media_player.ke_ting_homepod
                - media_player.che_ku_she_ying_ji_speaker

  garage_car_watch_run:
    alias: 車庫車輛畫面分析AI (V4.3.0-beta 6)
    description: 車庫快照 → 畫面分析 → 更新前／後位車輛、判斷準備出門（預設只記錄；通知與自動開門各有開關）。test＝只分析，不更新、不通知、不開門。
    mode: single
    max_exceeded: silent
    fields:
      test:
        description: true＝只分析（不更新車位、不通知、不開門、不更新滾動基準）
        required: false
    variables:
      is_test: "{{ test | default(false) in [true, 'true', 'True'] }}"
      gate_recent: "{{ (not is_state('cover.garage', 'closed')) or ((as_timestamp(now()) - as_timestamp(states('input_datetime.garage_gate_opened_at'), 0)) < 600) }}"
      names: {luxgen_n7: Luxgen N7, tesla_model3: Tesla Model 3, sedan: 房車, suv: 休旅車, motorcycle: 機車}
      pos: {front: 前位, back: 後位}
    sequence:
      - action: camera.snapshot
        target:
          entity_id: camera.g6_instant_high_resolution_channel
        data:
          filename: /config/www/snap/snap_gcur_52cd9975e2259496944fc869.jpg
        continue_on_error: true
      - delay: "00:00:00.5"
      - action: shell_command.garage_car_watch
        data:
          gate: "{{ '--gate-recent' if gate_recent else '' }}"
          nolearn: "{{ '--no-learn' if is_test else '' }}"
        response_variable: r
        continue_on_error: true
      - variables:
          res: "{{ (r.stdout | from_json({})) if (r is defined and r is mapping and r.get('stdout')) else {} }}"
          ok: "{{ res is mapping and res.get('slots') is mapping }}"
      - if: "{{ (not ok) or is_test }}"
        then:
          - stop: "略過（分析失敗或測試模式）"
      # 0) UniFi Protect 動作偵測：車身「位移」需要攝影機同時看到動作（3 分鐘內），人走動遮擋或光線造成的位移假訊號不算；車燈亮起不受限（煞車燈可能沒有畫面動作）
      - variables:
          protect_recent: "{{ is_state('binary_sensor.g6_instant_motion', 'on') or ((as_timestamp(now()) - as_timestamp(states('sensor.g6_instant_last_motion_detected'), 0)) < 180) }}"
          # 影像把兩個車位判成同一輛（夜間紅外線、剛換位置常見）：不要用這個結果覆蓋車位，交給 1A 仲裁
          dup_res: "{{ res.slots.front.identity in ['luxgen_n7', 'tesla_model3'] and res.slots.front.identity == res.slots.back.identity and res.slots.front.identity_src | default('') != 'plate' and res.slots.back.identity_src | default('') != 'plate' }}"
      # 1) 更新前／後位車輛與連續證據次數
      - repeat:
          for_each: [front, back]
          sequence:
            - variables:
                s: "{{ res.slots[repeat.item] }}"
                ent: "input_select.garage_slot_{{ repeat.item }}"
                cur: "{{ states('input_select.garage_slot_' ~ repeat.item) }}"
                new: >-
                  {% if not s.present %}empty{% elif s.identity_src | default('') == 'foreign_plate' %}{{ s.vehicle_type if s.vehicle_type in ['sedan', 'suv', 'motorcycle'] else 'sedan' }}{% elif dup_res and cur in ['luxgen_n7', 'tesla_model3'] %}{{ cur }}{% elif s.identity != 'unknown' %}{{ s.identity }}{% elif s.vehicle_type != 'unknown' and cur in ['empty', 'unknown', 'sedan', 'suv', 'motorcycle'] %}{{ s.vehicle_type }}{% elif cur in ['empty', 'unknown'] %}unknown{% else %}{{ cur }}{% endif %}
                ev: "{{ s.present and (s.lights_on or (s.moved and protect_recent)) and not res.exposure_changed }}"
                n_prev: "{{ states('input_number.garage_ev_' ~ repeat.item) | int(0) }}"
            - if: "{{ new | trim != cur }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: "{{ ent }}"
                  data:
                    option: "{{ new | trim }}"
            - variables:
                face_new: "{{ s.facing if (s.present and s.facing != 'unknown') else ('unknown' if not s.present else states('input_select.garage_facing_' ~ repeat.item)) }}"
            - if: "{{ face_new != states('input_select.garage_facing_' ~ repeat.item) }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: "input_select.garage_facing_{{ repeat.item }}"
                  data:
                    option: "{{ face_new }}"
            - action: input_number.set_value
              target:
                entity_id: "input_number.garage_ev_{{ repeat.item }}"
              data:
                value: "{{ [n_prev + 1, 20] | min if ev else 0 }}"
      # 1A) 身分仲裁（車牌＋排除法）：夜間紅外線／換位置後影像樣板可能把兩個車位判成同一輛或認不出。
      #     ①兩位判成同一輛 → 樣板距離較差的那位改成另一輛；②一位是已知車、另一位有車但認不出 → 另一位是「另一輛」（車牌近 15 分鐘看到該車，或車型相符：Luxgen＝休旅車、Tesla＝房車）。
      #     校正由車牌近 15 分鐘證實時，順便用目前畫面重學該車位樣板（每 10 分鐘最多一次），以後同樣光線不再判錯。
      - variables:
          sf: "{{ states('input_select.garage_slot_front') }}"
          sb: "{{ states('input_select.garage_slot_back') }}"
          lpr_txt: "{{ states('input_text.lpr_last_event') }}"
          plate_car: >-
            {% if '來源:LPR' in lpr_txt %}{% if 'EAK8030' in lpr_txt %}luxgen_n7{% elif 'EBH8030' in lpr_txt %}tesla_model3{% else %}none{% endif %}{% else %}none{% endif %}
          plate_age: "{{ (as_timestamp(now()) - as_timestamp(states.input_text.lpr_last_event.last_updated)) | int(99999) if plate_car != 'none' else 99999 }}"
          pf_ok: "{{ res.slots.front.present and not res.exposure_changed }}"
          pb_ok: "{{ res.slots.back.present and not res.exposure_changed }}"
          fix: >-
            {% set cars = ['luxgen_n7', 'tesla_model3'] %}
            {% set other = {'luxgen_n7': 'tesla_model3', 'tesla_model3': 'luxgen_n7'} %}
            {% set typ = {'luxgen_n7': 'suv', 'tesla_model3': 'sedan'} %}
            {% set weak = ['unknown', 'sedan', 'suv', 'motorcycle'] %}
            {% set plate_new = plate_age <= 900 %}
            {% set foreign_f = (res.slots.front.identity_src | default('')) == 'foreign_plate' %}
            {% set foreign_b = (res.slots.back.identity_src | default('')) == 'foreign_plate' %}
            {% set pa_f = res.slots.front.identity if (res.slots.front.identity_src | default('')) == 'plate' else '' %}
            {% set pa_b = res.slots.back.identity if (res.slots.back.identity_src | default('')) == 'plate' else '' %}
            {% if foreign_f or foreign_b %}{}
            {% elif pa_f in cars and sf != pa_f %}
              {{ {'slot': 'front', 'car': pa_f, 'why': 'ocr', 'plate': true} | to_json }}
            {% elif pa_b in cars and sb != pa_b %}
              {{ {'slot': 'back', 'car': pa_b, 'why': 'ocr', 'plate': true} | to_json }}
            {% elif pa_f in cars and pb_ok and not pa_b and sb != other[pa_f] %}
              {{ {'slot': 'back', 'car': other[pa_f], 'why': 'ocr_excl', 'plate': true} | to_json }}
            {% elif pa_b in cars and pf_ok and not pa_f and sf != other[pa_b] %}
              {{ {'slot': 'front', 'car': other[pa_b], 'why': 'ocr_excl', 'plate': true} | to_json }}
            {% elif sf in cars and sf == sb and pf_ok and pb_ok %}
              {% set slot = 'front' if (res.slots.front.identity_dist | float(9)) > (res.slots.back.identity_dist | float(9)) else 'back' %}
              {% set moving = res.slots.front.moved or res.slots.back.moved %}
              {{ {'slot': slot, 'car': ('empty' if (moving and not (plate_new and plate_car == other[sf])) else other[sf]), 'why': ('dup_move' if (moving and not (plate_new and plate_car == other[sf])) else 'dup'), 'plate': plate_new and plate_car == other[sf]} | to_json }}
            {% elif sf in cars and sb in weak and pb_ok %}
              {% if (plate_new and plate_car == other[sf]) or res.slots.back.vehicle_type == typ[other[sf]] or sb == typ[other[sf]] %}
                {{ {'slot': 'back', 'car': other[sf], 'why': 'excl', 'plate': plate_new and plate_car == other[sf]} | to_json }}
              {% else %}{}{% endif %}
            {% elif sb in cars and sf in weak and pf_ok %}
              {% if (plate_new and plate_car == other[sb]) or res.slots.front.vehicle_type == typ[other[sb]] or sf == typ[other[sb]] %}
                {{ {'slot': 'front', 'car': other[sb], 'why': 'excl', 'plate': plate_new and plate_car == other[sb]} | to_json }}
              {% else %}{}{% endif %}
            {% else %}{}{% endif %}
          fixd: "{{ fix | from_json({}) }}"
      - if: "{{ fixd is mapping and fixd.get('slot') }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: "input_select.garage_slot_{{ fixd.slot }}"
            data:
              option: "{{ fixd.car }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.garage_id_fix_log
            data:
              value: "{{ (now().strftime('%m-%d %H:%M') ~ ' ' ~ pos[fixd.slot] ~ ' 校正為 ' ~ names.get(fixd.car, '空位') ~ '｜' ~ ({'dup': '兩位判成同一輛', 'dup_move': '同一輛車移動中，另一位改回空位', 'ocr': '影像讀到車牌', 'ocr_excl': '另一位讀到車牌，排除法'}.get(fixd.why, '排除法')) ~ ('｜車牌證實' if fixd.plate else '｜未見車牌'))[:255] }}"
          - if: "{{ fixd.plate and (as_timestamp(now()) - as_timestamp(states('input_datetime.garage_id_fix_last'), 0)) > 600 }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.garage_id_fix_last
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: shell_command.garage_car_learn
                data:
                  arg: "--learn-sig {{ fixd.slot }}={{ fixd.car }}{{ ':inside' if is_state('input_select.garage_facing_' ~ fixd.slot, 'inside') else '' }}"
                continue_on_error: true
      # 1A-2) 影像文字辨識讀到的車牌（add-on RapidOCR）：記錄最近一次，含不是家裡的車牌（經過的車）
      - variables:
          seen: >-
            {% set ns = namespace(l=[]) %}{% for p in (res.get('vision', {}).get('plates', []) if res.get('vision') is mapping else []) %}{% set ns.l = ns.l + [p.text ~ '(' ~ p.conf ~ ')'] %}{% endfor %}{{ ns.l | join('、') }}
      - if: "{{ seen | trim != '' and not states('input_text.garage_plate_seen').endswith(seen | trim) }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.garage_plate_seen
            data:
              value: "{{ (now().strftime('%m-%d %H:%M') ~ ' ' ~ (seen | trim))[:255] }}"
      # 1B) 充電訊號 ＋ 充電線：判斷「現在是哪輛車在充電、它停在哪個車位」，補強車輛身分
      #     充電樁狀態是「機率」不是電流大小：正常充電（charging）＝100% Tesla；降壓（charging_reduced）＝80% Luxgen、20% Tesla。
      #     再用影像證據調整：Luxgen 常停後面、車頭朝外就在充電（朝內也可能），所以朝向只當輕微證據；主要看充電線樣板指向的車位是不是 Luxgen 所在的車位。
      #     充電線：拍到線接到畫面前景那台（to_near，我的『後位』）→ 充電的是前景車；線被擋住拍不到（hidden）→ 充電的是後方那台（遠端靠鐵門，我的『前位』，通常是 Luxgen）
      - variables:
          chg_status: "{{ states('sensor.tesla_wall_connector_status') }}"
          charging: "{{ chg_status in ['charging', 'charging_reduced'] }}"
          cable: "{{ res.cable.state if (res.get('cable') is mapping) else 'unknown' }}"
          slot_f: "{{ states('input_select.garage_slot_front') }}"
          slot_b: "{{ states('input_select.garage_slot_back') }}"
          lux_slot: "{{ 'front' if slot_f == 'luxgen_n7' else ('back' if slot_b == 'luxgen_n7' else 'none') }}"
          lux_face: "{{ states('input_select.garage_facing_' ~ lux_slot) if lux_slot != 'none' else 'unknown' }}"
          # 車頭朝向只當輕微證據（Luxgen 朝外或朝內都可能在充電，不能因為朝外就扣分）；充電線則比對「充電的是哪個車位」
          cable_slot: >-
            {% if cable == 'to_near' %}back{% elif cable == 'hidden' %}front{% elif cable == 'to_luxgen_in' %}{{ lux_slot if lux_slot != 'none' else 'unknown' }}{% else %}unknown{% endif %}
          face_factor: "{{ 1.5 if lux_face == 'inside' else 1.0 }}"
          # 畫面上看到充電線接到哪台車（to_near＝畫面前景那台、to_luxgen_in）＝直接證據：該車位的車就是在充電的車，權重最高；線被前景車擋住拍不到（hidden）是推論＝接到後方（遠端、靠鐵門）那台
          cable_seen: "{{ cable in ['to_near', 'to_luxgen_in'] and cable_slot != 'unknown' }}"
          direct_car: "{{ states('input_select.garage_slot_' ~ cable_slot) if cable_seen else 'none' }}"
          cable_factor: "{{ ((20.0 if lux_slot == cable_slot else 0.05) if cable_seen else (3.0 if lux_slot == cable_slot else 0.5)) if (cable_slot != 'unknown' and lux_slot != 'none') else 1.0 }}"
          # 車輛充電電流是最可靠的指紋（45 天歷史：Tesla ≈24.7 A、Luxgen ≈31.3 A，26～28 A 之間沒有重疊）
          chg_a: "{{ states('sensor.che_ku_tesla_wall_connector_vehicle_current') | float(0) }}"
          a_factor: "{{ 50.0 if chg_a >= 28 else (0.02 if 1 <= chg_a <= 26 else 1.0) }}"
          # 降壓時先驗賠率 80:20＝4，乘上影像證據與電流；正常充電＝Tesla 100%
          odds_lux: "{{ 4.0 * face_factor * cable_factor * a_factor }}"
          p_lux: "{{ 0.0 if chg_status == 'charging' else (odds_lux / (1 + odds_lux) if chg_status == 'charging_reduced' else 0.0) }}"
          power_car: >-
            {% if not charging %}none{% elif direct_car in ['luxgen_n7', 'tesla_model3'] %}{{ direct_car }}{% elif p_lux >= 0.5 %}luxgen_n7{% else %}tesla_model3{% endif %}
          power_conf: "{{ 0.97 if (charging and direct_car in ['luxgen_n7', 'tesla_model3']) else ((p_lux if p_lux >= 0.5 else 1 - p_lux) if charging else 0) }}"
          # 充電線拍不到不一定是後方車輛：Luxgen 充電時車頭朝內，線會被前面的車擋住（to_luxgen_in）；Tesla 拍不到（unseen）才是後方車輛
          image_slot: >-
            {% if power_car in ['luxgen_n7', 'tesla_model3'] %}{% if slot_f == power_car %}front{% elif slot_b == power_car %}back{% else %}unknown{% endif %}{% else %}unknown{% endif %}
          charge_slot: >-
            {% if not charging %}none{% elif cable_seen %}{{ cable_slot }}{% elif power_car == 'luxgen_n7' and image_slot != 'unknown' %}{{ image_slot }}{% elif cable_slot != 'unknown' %}{{ cable_slot }}{% else %}{{ image_slot }}{% endif %}
          conflict: "{{ charging and power_car == 'tesla_model3' and cable_slot != 'unknown' and image_slot != 'unknown' and cable_slot != image_slot }}"
          prev_car: "{{ states('input_select.garage_charging_car') }}"
          prev_slot: "{{ states('input_select.garage_charging_slot') }}"
          new_car: "{{ power_car if charging else 'none' }}"
      - if: "{{ new_car != prev_car or charge_slot != prev_slot }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.garage_charging_car
            data:
              option: "{{ new_car }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.garage_charging_slot
            data:
              option: "{{ charge_slot }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.garage_charge_log
            data:
              value: >-
                {{ (now().strftime('%m-%d %H:%M') ~ ' ' ~ ('停止充電' if new_car == 'none' else (names.get(new_car, '車輛') ~ ' 充電中｜' ~ ({'front': '前位', 'back': '後位'}.get(charge_slot, '車位不明')) ~ '｜' ~ (power_conf * 100) | round(0) | int ~ '%｜線:' ~ cable ~ ('｜⚠與畫面辨識不一致' if conflict else ''))))[:255] }}
      # 充電訊號補強身分：車位原本認不出來（unknown）時，用「誰在充電、線接到哪」填入；另一個車位也不確定時填另一輛
      - if: "{{ charging and power_car in ['luxgen_n7', 'tesla_model3'] and cable_slot != 'unknown' and states('input_select.garage_slot_' ~ cable_slot) in ['unknown'] }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: "input_select.garage_slot_{{ cable_slot }}"
            data:
              option: "{{ power_car }}"
      # 自動學充電線樣板：用「畫面已確認身分」的車位當標籤（拉向前位＝to_front、拍不到＝unseen），沒接車超過 5 分鐘＝hanging；每 30 分鐘最多學一次
      - variables:
          cable_label: >-
            {% if charging and power_car in ['luxgen_n7', 'tesla_model3'] and power_conf >= 0.8 and image_slot != 'unknown' %}{% if power_car == 'luxgen_n7' and lux_face == 'inside' %}to_luxgen_in{% else %}{{ 'to_near' if image_slot == 'back' else 'hidden' }}{% endif %}
            {% elif is_state('binary_sensor.tesla_wall_connector_vehicle_connected', 'off') and (as_timestamp(now()) - as_timestamp(states.binary_sensor.tesla_wall_connector_vehicle_connected.last_changed)) > 300 %}hanging
            {% else %}none{% endif %}
      - if: "{{ cable_label | trim != 'none' and (as_timestamp(now()) - as_timestamp(states('input_datetime.garage_cable_learn_last'), 0)) > 1800 and not conflict }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.garage_cable_learn_last
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: shell_command.garage_car_learn
            data:
              arg: "--learn-cable {{ cable_label | trim }}"
            continue_on_error: true
      # 2) 判斷準備出門
      - if: "{{ is_state('input_boolean.garage_depart_watch_enable', 'on') and is_state('cover.garage', 'closed') and is_state('input_boolean.garage_depart_candidate', 'off') }}"
        then:
          - repeat:
              for_each: [front, back]
              sequence:
                # 左方向燈（絕對出門訊號）：車頭朝鐵門的已知車輛亮煞車燈時，錄 3 秒影片檢查車尾左後角橘色是否一亮一滅（至少 3 次）；每 30 秒最多檢查一次
                - if: >-
                    {{ is_state('input_boolean.garage_turn_signal_enable', 'on') and res.slots[repeat.item].present and res.slots[repeat.item].lights_on
                       and states('input_select.garage_slot_' ~ repeat.item) in ['luxgen_n7', 'tesla_model3']
                       and is_state('input_select.garage_facing_' ~ repeat.item, 'door')
                       and (as_timestamp(now()) - as_timestamp(states('input_datetime.garage_turn_last'), 0)) > 30 }}
                  then:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.garage_turn_last
                      data:
                        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                    - action: camera.record
                      target:
                        entity_id: camera.g6_instant_high_resolution_channel
                      data:
                        filename: /config/www/snap/turn_clip.mp4
                        duration: 3
                        lookback: 0
                      continue_on_error: true
                    - action: shell_command.garage_turn_signal
                      data:
                        slot: "{{ repeat.item }}"
                      response_variable: tr
                      continue_on_error: true
                    - variables:
                        tres: "{{ (tr.stdout | from_json({})) if (tr is defined and tr is mapping and tr.get('stdout')) else {} }}"
                    - if: "{{ tres is mapping and tres.get('blink') == true }}"
                      then:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.garage_turn_detected
                - variables:
                    s: "{{ res.slots[repeat.item] }}"
                    car: "{{ states('input_select.garage_slot_' ~ repeat.item) }}"
                    n: "{{ states('input_number.garage_ev_' ~ repeat.item) | int(0) + (1 if (s.present and (s.lights_on or s.moved)) else 0) }}"
                    lk: "{{ states('sensor.garage_depart_likelihood') | float(0) }}"
                    lk_min: "{{ states('input_number.garage_depart_likelihood_min') | float(70) }}"
                    turn: "{{ is_state('input_boolean.garage_turn_detected', 'on') and s.present and car in ['luxgen_n7', 'tesla_model3'] }}"
                    cand: "{{ turn or (s.present and car in ['luxgen_n7', 'tesla_model3'] and n >= 2 and lk >= lk_min and not res.exposure_changed) }}"
                    strong: "{{ (s.lights_on and s.moved) or n >= 3 }}"
                    who_in_garage: >-
                      {{ is_state('binary_sensor.che_ku_she_ying_ji_person_detected', 'on')
                         or ((as_timestamp(now()) - as_timestamp(states.binary_sensor.che_ku_she_ying_ji_person_detected.last_changed)) < 120)
                         or ('車庫' in [states('sensor.at_home_kenny_location'), states('sensor.at_home_iris_location'), states('sensor.at_home_jerry_location'), states('sensor.at_home_elay_location')]) }}
                    do_open: >-
                      {{ is_state('input_boolean.garage_depart_auto_open_enable', 'on')
                         and ((strong and who_in_garage and is_state('input_boolean.sleep_silent_active', 'off') and is_state('input_boolean.aqara_wan_an', 'off')) or (turn and is_state('input_boolean.garage_turn_signal_open_enable', 'on')))
                         and ((as_timestamp(now()) - as_timestamp(states('input_datetime.garage_depart_last_open'), 0)) > 300) }}
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.garage_turn_detected
                - if: "{{ cand }}"
                  then:
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.garage_depart_car
                      data:
                        value: "{{ car }}"
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.garage_depart_candidate
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.garage_depart_last
                      data:
                        value: >-
                          {{ (now().strftime('%m-%d %H:%M:%S') ~ ' ' ~ names.get(car, car) ~ '｜' ~ pos[repeat.item] ~ '｜車燈' ~ ('亮' if s.lights_on else '無') ~ '/位移' ~ s.shift_px ~ 'px/可能性' ~ (lk | int) ~ '%' ~ ('｜左方向燈（絕對出門訊號）' if turn else '') ~ ('｜自動開門' if do_open else ''))[:255] }}
                    - if: "{{ is_state('input_boolean.garage_depart_notify_enable', 'on') }}"
                      then:
                        - action: script.notify_dispatch
                          data:
                            level: info
                            line: false
                            source: 車庫車輛畫面分析AI
                            version: V4.3.0-beta 6
                            title: "{{ names.get(car, car) }} 準備出門"
                            message: >-
                              {{ pos[repeat.item] }}的 {{ names.get(car, car) }}：車燈{{ '已亮起' if s.lights_on else '未亮' }}、位移 {{ s.shift_px }}px，出去可能性 {{ lk | int }}%。
                              {{ state_attr('sensor.garage_depart_likelihood', 'reasons') | join('、') }}
                              {{ '→ 已自動開啟車庫鐵門。' if do_open else '' }}
                    - if: "{{ do_open }}"
                      then:
                        - action: input_datetime.set_datetime
                          target:
                            entity_id: input_datetime.garage_depart_last_open
                          data:
                            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                        - action: cover.open_cover
                          target:
                            entity_id: cover.garage
                        # 開門後 3 分鐘該車位沒變空 → 判定誤判，關門（先確認車庫沒有人），並通知
                        - wait_template: "{{ is_state('input_select.garage_slot_' ~ repeat.item, 'empty') }}"
                          timeout: "00:03:00"
                          continue_on_timeout: true
                        - if: "{{ not is_state('input_select.garage_slot_' ~ repeat.item, 'empty') }}"
                          then:
                            - action: script.garage_close_safety_check
                              response_variable: sf
                            - if: "{{ sf is mapping and sf.get('safe') == true }}"
                              then:
                                - action: cover.close_cover
                                  target:
                                    entity_id: cover.garage
                            - action: script.notify_dispatch
                              data:
                                level: important
                                line: false
                                source: 車庫車輛畫面分析AI
                                version: V4.3.0-beta 6
                                title: 車庫自動開門後車輛沒有出去
                                message: "{{ names.get(car, car) }} 判斷為準備出門而自動開了鐵門，但 3 分鐘內車位沒有變空，已嘗試關門（車庫無人時）。請確認。"
                    - stop: "已判斷準備出門"

  garage_car_learn_apply:
    alias: 車庫車輛樣板學習AI (V4.3.0-beta 1)
    description: 面板上選好「車位／這個車位現在是什麼／車頭朝向」後按「學習」：拍一張現在的畫面，把指定車位學成該車（含朝向）或空位。
    mode: single
    sequence:
      - variables:
          slot: "{{ states('input_select.garage_learn_slot') }}"
          car: "{{ states('input_select.garage_learn_car') }}"
          face: "{{ states('input_select.garage_learn_facing') }}"
          arg: >-
            {% if car == 'empty' %}--learn-empty {{ slot }}{% else %}--learn-sig {{ slot }}={{ car }}{{ ':inside' if face == 'inside' else '' }}{% endif %}
      - action: camera.snapshot
        target:
          entity_id: camera.g6_instant_high_resolution_channel
        data:
          filename: /config/www/snap/snap_gcur_52cd9975e2259496944fc869.jpg
      - delay: "00:00:00.5"
      - action: shell_command.garage_car_learn
        data:
          arg: "{{ arg }}"
        response_variable: r
      - variables:
          ok: "{{ r is mapping and r.get('returncode', 1) == 0 and 'learned' in (r.get('stdout') or '') }}"
      - if: "{{ ok }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: "input_select.garage_slot_{{ slot }}"
            data:
              option: "{{ car if car != 'empty' else 'empty' }}"
          - action: input_select.select_option
            target:
              entity_id: "input_select.garage_facing_{{ slot }}"
            data:
              option: "{{ face if car != 'empty' else 'unknown' }}"
      - action: script.notify_dispatch
        data:
          level: info
          line: false
          source: 車庫車輛樣板學習AI
          version: V4.3.0-beta 1
          title: "車庫樣板學習{{ '完成' if ok else '失敗' }}"
          message: >-
            {{ {'front': '前位', 'back': '後位'}[slot] }}：{{ '空位' if car == 'empty' else ({'luxgen_n7': 'Luxgen N7', 'tesla_model3': 'Tesla Model 3', 'sedan': '房車', 'suv': '休旅車', 'motorcycle': '機車'}[car] ~ '（車頭' ~ ('朝內' if face == 'inside' else '朝鐵門') ~ '）') }}
            {{ '' if ok else (r.get('stderr') or r.get('stdout') or '') if r is mapping else '' }}

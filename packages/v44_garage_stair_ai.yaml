# ─────────────────────────────────────────────────────────────
# 車庫樓梯口人流記錄 (V1.0.0，只記錄不控制)
# 更新紀錄（統一格式）：
# - V1.0.0（2026-10-31）：新增。車庫樓梯人體感應器或車庫攝影機有人時，每秒一張快照送 Garage Vision add-on（人體姿態模型），
#   scripts/garage_stair_track.py 把多人各自串成軌跡，判斷每個人從樓梯口出來（down）、走進樓梯口（up）或只經過（pass），
#   寫到 /config/garage_stair/log.jsonl，最近一筆放在 input_text.garage_stair_ai_last。不控制任何燈或門。
#   開關 input_boolean.garage_stair_ai_enable（關閉＝完全不跑）。快照保留在 /config/learn_collect/garage_stair/（14 天）供驗證。
# ─────────────────────────────────────────────────────────────
input_boolean:
  garage_stair_ai_enable:
    name: 車庫樓梯口人流記錄｜總開關
    icon: mdi:stairs

input_text:
  garage_stair_ai_last:
    name: 車庫樓梯口人流記錄｜最近一筆（內部）
    max: 255

shell_command:
  garage_stair_track_frame: "env OMP_NUM_THREADS=1 python3 /config/scripts/garage_stair_track.py --frame {{ frame }} --t {{ ts }} {{ reset }}"
  garage_stair_presence: "env OMP_NUM_THREADS=1 python3 /config/scripts/garage_stair_track.py --presence --frame {{ frame }}"
  garage_stair_track_final: "env OMP_NUM_THREADS=1 python3 /config/scripts/garage_stair_track.py --finalize"

script:
  garage_presence_confirm_empty:
    alias: 車庫關燈前｜用人體模型確認沒人 (V1.0.0)
    description: >
      關車庫燈前呼叫：每 30 秒抓一張車庫攝影機快照，用 Garage Vision 人體姿態模型看畫面有沒有人，最多確認 12 次（約 6 分鐘）。
      畫面沒人就回傳 empty＝true；12 次都還有人回傳 empty＝false（呼叫端不關燈）；模型連不上（persons＝-1）視為無法判斷，沿用原本的感應器判斷（empty＝true、unknown＝true）。
    mode: parallel
    max: 3
    sequence:
      - repeat:
          count: 12
          sequence:
            - action: camera.snapshot
              target:
                entity_id: camera.che_ku_she_ying_ji_medium_resolution_channel
              data:
                filename: /config/www/snap/gs_chk.jpg
              continue_on_error: true
            - action: shell_command.garage_stair_presence
              data:
                frame: /config/www/snap/gs_chk.jpg
              response_variable: pr
              continue_on_error: true
            - variables:
                n: "{{ ((pr.stdout | from_json({})).get('persons', -1)) if (pr is defined and pr is mapping and pr.get('stdout')) else -1 }}"
            - if: "{{ n | int(-1) <= 0 }}"
              then:
                - variables:
                    result: "{{ {'empty': true, 'unknown': n | int(-1) < 0} }}"
                - stop: "畫面沒有人（或模型無法判斷）"
                  response_variable: result
            - delay: "00:00:30"
      - variables:
          result: "{{ {'empty': false, 'unknown': false} }}"
      - stop: "模型持續看到人"
        response_variable: result

  garage_stair_ai_note:
    alias: 車庫樓梯口人流記錄｜記下結算結果 (V1.0.0)
    mode: queued
    max: 10
    sequence:
      - repeat:
          for_each: "{{ closed }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.garage_stair_ai_last
              data:
                value: "{{ (now().strftime('%H:%M:%S') ~ ' ' ~ repeat.item.dir ~ '（' ~ repeat.item.reason ~ '，' ~ repeat.item.det ~ ' 幀）')[:255] }}"
              continue_on_error: true

  garage_stair_ai_loop:
    alias: 車庫樓梯口人流記錄 (V1.0.0)
    description: 樓梯感應器或車庫攝影機有人期間，每秒一張快照 → 人體姿態偵測 → 多人軌跡 → 記錄上下樓。只記錄不控制。
    mode: single
    max_exceeded: silent
    sequence:
      - repeat:
          while:
            - condition: template
              value_template: >-
                {% set a = states.binary_sensor.e406bf25cfea_motion %}
                {% set b = states.binary_sensor.che_ku_she_ying_ji_person_detected %}
                {{ repeat.index < 90
                   and (a.state == 'on' or b.state == 'on'
                        or (as_timestamp(now()) - as_timestamp(a.last_changed)) < 6
                        or (as_timestamp(now()) - as_timestamp(b.last_changed)) < 6) }}
          sequence:
            # 管線化：拍下一張與分析上一張同時進行（做法同頂樓攝影機）
            - variables:
                cur_file: "/config/www/snap/gs_n{{ repeat.index % 2 }}.jpg"
                prev_file: "/config/www/snap/gs_n{{ (repeat.index + 1) % 2 }}.jpg"
            - parallel:
                - action: camera.snapshot
                  target:
                    entity_id: camera.che_ku_she_ying_ji_medium_resolution_channel
                  data:
                    filename: "{{ cur_file }}"
                  continue_on_error: true
                - sequence:
                    - condition: template
                      value_template: "{{ repeat.index > 1 }}"
                    - action: shell_command.garage_stair_track_frame
                      data:
                        frame: "{{ prev_file }}"
                        ts: "{{ now().timestamp() - 0.5 }}"
                        reset: "{{ '--reset' if repeat.index == 2 else '' }}"
                      response_variable: r
                      continue_on_error: true
                    - variables:
                        res: "{{ (r.stdout | from_json({})) if (r is defined and r is mapping and r.get('stdout')) else {} }}"
                    - if: "{{ res is mapping and (res.get('closed') or []) | count > 0 }}"
                      then:
                        - action: script.garage_stair_ai_note
                          data:
                            closed: "{{ res.closed }}"
                          continue_on_error: true
      # 有人的期間結束：結算還沒結束的軌跡
      - action: shell_command.garage_stair_track_final
        response_variable: fr
        continue_on_error: true
      - variables:
          fin: "{{ (fr.stdout | from_json({})) if (fr is defined and fr is mapping and fr.get('stdout')) else {} }}"
      - if: "{{ fin is mapping and (fin.get('closed') or []) | count > 0 }}"
        then:
          - action: script.garage_stair_ai_note
            data:
              closed: "{{ fin.closed }}"
            continue_on_error: true

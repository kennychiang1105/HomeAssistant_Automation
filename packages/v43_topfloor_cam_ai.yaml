# ─────────────────────────────────────────────────────────────
# 頂樓攝影機模型判斷 (V4.3.12)
# 更新紀錄（統一格式）：
# - V4.3.12（2026-11-12）：topfloor_cam_ai_loop 與 topfloor_stairs_wait_clear 當模型確認畫面有人（persons > 0）且任一盞樓梯燈未亮時，
#   發出 topfloor_cam_person 事件供 08-5C 直接忽略剛進房防呆進行開燈。
# - V4.3.10（2026-11-07）：新增 script.topfloor_stairs_wait_clear：08-5C 自動關樓梯燈前先抓一張快照用人物模型確認，畫面還有人就每 2 秒再看，等人消失才關（最多等 5 分鐘）；
#   模型只看到人、攝影機 60 秒內沒有任何動作／人員偵測＝視為靜物誤判。開關 input_boolean.topfloor_stairs_off_cam_hold_enable。
# - V4.3.4-beta 3（2026-10-28，測試中）：新增「最後去向」判斷：人消失超過 2.5 秒就依消失位置＋走動方向判斷去向（下樓梯／進書房／回臥室），發事件 topfloor_cam_exit 給 08-5J，
#   由 08-5J 等實體訊號對照後才補發動線。獨立開關 input_boolean.topfloor_cam_ai_exit_enable；統計 input_number.topfloor_ai_exit／_agree／_disagree／_published。
# - V4.3.4-beta 1（2026-10-28，測試中）：新增。頂樓攝影機有動靜（motion 或 person_detected）期間，每秒抓一張快照送 Garage Vision add-on（persons_only，只跑人物偵測），
#   scripts/topfloor_track.py 累積軌跡並「提早決定」方向（上樓 up／下樓 down），一決定就發事件 topfloor_cam_ai，由 08-5J頂樓動線推理AI 當證據（補漏、提速）；
#   動靜結束後再多看 6 秒收尾（沒人＝降雜訊計數）。單次上限 60 秒。總開關 input_boolean.topfloor_cam_ai_enable（關閉＝完全回到原本行為）。
#   流程與回放學習見 PROJECT_RULES.md SOP-26。
# ─────────────────────────────────────────────────────────────
input_boolean:
  topfloor_cam_ai_enable:
    name: 頂樓攝影機模型判斷｜總開關
    icon: mdi:robot-outline
  topfloor_cam_ai_exit_enable:
    name: 頂樓攝影機模型判斷｜最後去向開關
    icon: mdi:door-open
  topfloor_stairs_off_cam_hold_enable:
    name: 頂樓樓梯燈｜自動關燈前畫面有人就等人消失
    icon: mdi:account-eye

input_text:
  topfloor_cam_ai_last:
    name: 頂樓攝影機模型判斷｜最近一次（內部）
    max: 255
  topfloor_cam_ai_exit_last:
    name: 頂樓攝影機模型判斷｜最近一次去向（內部）
    max: 255

input_datetime:
  topfloor_cam_ai_up_last:
    name: 頂樓攝影機模型判斷｜最近一次判上樓（內部）
    has_date: true
    has_time: true
  topfloor_cam_ai_down_last:
    name: 頂樓攝影機模型判斷｜最近一次判下樓（內部）
    has_date: true
    has_time: true

input_number:
  topfloor_ai_fired:
    name: 頂樓模型｜提早判斷次數
    min: 0
    max: 100000
    step: 1
    mode: box
  topfloor_ai_published:
    name: 頂樓模型｜實際發出動線事件次數
    min: 0
    max: 100000
    step: 1
    mode: box
  topfloor_ai_ghost:
    name: 頂樓模型｜有動靜但畫面沒人次數
    min: 0
    max: 100000
    step: 1
    mode: box
  topfloor_ai_exit:
    name: 頂樓模型｜去向判斷次數
    min: 0
    max: 100000
    step: 1
    mode: box
  topfloor_ai_exit_agree:
    name: 頂樓模型｜去向與實體訊號一致次數
    min: 0
    max: 100000
    step: 1
    mode: box
  topfloor_ai_exit_disagree:
    name: 頂樓模型｜去向與實體訊號不一致次數
    min: 0
    max: 100000
    step: 1
    mode: box
  topfloor_ai_exit_published:
    name: 頂樓模型｜去向補發動線次數
    min: 0
    max: 100000
    step: 1
    mode: box

shell_command:
  topfloor_track_frame: "env OMP_NUM_THREADS=1 python3 /config/scripts/topfloor_track.py --frame {{ frame | default('/config/www/snap/tf_cur.jpg') }} --t {{ ts }} {{ reset }}"
  topfloor_track_final: "env OMP_NUM_THREADS=1 python3 /config/scripts/topfloor_track.py --finalize"
  topfloor_presence: "env OMP_NUM_THREADS=1 python3 /config/scripts/topfloor_track.py --presence --frame {{ frame }}"

script:
  topfloor_stairs_wait_clear:
    alias: 頂樓樓梯燈關燈前｜攝影機畫面確認沒人 (V4.3.12)
    description: >
      08-5C 自動關樓梯燈前呼叫：抓一張頂樓攝影機快照，用人物模型（信心 ≥ 0.5）看畫面有沒有人；有人就每 2 秒再看一次，人消失才回傳 clear＝true（呼叫端接著關燈），
      最多等 max_s 秒（預設 300）仍有人回傳 clear＝false（呼叫端不關，交給保底計時）。模型看到人、但攝影機 60 秒內完全沒有動作／人員偵測＝視為靜物誤判，不算有人；
      模型連不上時改看攝影機人員偵測。need_cam_off＝true 時另外要等攝影機人員偵測也恢復無人（保底關燈用，維持原本「攝影機有人就續」）。
      開關 input_boolean.topfloor_stairs_off_cam_hold_enable 關閉時直接回傳 clear＝true。
    mode: parallel
    max: 6
    max_exceeded: silent
    fields:
      max_s:
        description: 最多等幾秒（預設 300）
        example: 300
      need_cam_off:
        description: 是否也要等攝影機人員偵測恢復無人
        example: false
    sequence:
      - variables:
          t0: "{{ now().timestamp() }}"
          lim: "{{ max_s | default(300) | int(300) }}"
          need_cam: "{{ need_cam_off | default(false) | bool(false) }}"
      # 開關關閉：回到原本行為（保底關燈時攝影機有人＝不關，其餘直接關）
      - if: "{{ is_state('input_boolean.topfloor_stairs_off_cam_hold_enable', 'off') }}"
        then:
          - variables:
              result: "{{ {'clear': not (need_cam and is_state('binary_sensor.wu_lou_she_ying_ji_person_detected', 'on')), 'waited': 0, 'skipped': true} }}"
          - stop: 未啟用
            response_variable: result
      - repeat:
          while:
            - condition: template
              value_template: "{{ now().timestamp() - t0 < lim }}"
          sequence:
            - action: camera.snapshot
              target:
                entity_id: camera.wu_lou_she_ying_ji_medium
              data:
                filename: /config/www/snap/tf_off_chk.jpg
              continue_on_error: true
            - action: shell_command.topfloor_presence
              data:
                frame: /config/www/snap/tf_off_chk.jpg
              response_variable: pr
              continue_on_error: true
            - variables:
                n: "{{ ((pr.stdout | from_json({})).get('persons', -1)) if (pr is defined and pr is mapping and pr.get('stdout')) else -1 }}"
                cam_p: "{{ is_state('binary_sensor.wu_lou_she_ying_ji_person_detected', 'on') }}"
                active: >-
                  {% set a = states.binary_sensor.wu_lou_she_ying_ji_motion %}
                  {% set b = states.binary_sensor.wu_lou_she_ying_ji_person_detected %}
                  {{ (a is not none and (a.state == 'on' or (now().timestamp() - as_timestamp(a.last_changed)) < 60))
                     or (b is not none and (b.state == 'on' or (now().timestamp() - as_timestamp(b.last_changed)) < 60)) }}
                busy: "{{ (n | int(-1) > 0 and active) or (n | int(-1) < 0 and cam_p) or (need_cam and cam_p) }}"
            - if: "{{ not busy }}"
              then:
                - variables:
                    result: "{{ {'clear': true, 'waited': (now().timestamp() - t0) | round(0) | int, 'persons': n | int(-1)} }}"
                - stop: 畫面沒有人
                  response_variable: result
            - if: >-
                {{ (n | int(-1)) > 0 and active
                   and (is_state('light.yeelink_color5_13b8_light', 'off') or is_state('light.yeelink_color5_0fb7_light', 'off'))
                   and is_state('input_boolean.topfloor_stairs_keep_on', 'off') }}
              then:
                - event: topfloor_cam_person
                  event_data:
                    persons: "{{ n | int(1) }}"
                    source: "wait_clear"
            - delay: "00:00:02"
      - variables:
          result: "{{ {'clear': false, 'waited': (now().timestamp() - t0) | round(0) | int} }}"
      - stop: 等太久仍有人
        response_variable: result

  topfloor_cam_ai_exit:
    alias: 頂樓攝影機模型｜記錄最後去向 (V4.3.4-beta 3)
    description: 記錄模型判斷的最後去向（下樓梯／進書房／回臥室）並發事件 topfloor_cam_exit。由 topfloor_cam_ai_loop 呼叫，傳入 ex（topfloor_track.py 的 exit 結果）。
    mode: queued
    max: 5
    sequence:
      - action: input_number.increment
        target:
          entity_id: input_number.topfloor_ai_exit
        continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.topfloor_cam_ai_exit_last
        data:
          value: "{{ (now().strftime('%H:%M:%S') ~ ' ' ~ (ex.get('dest') or '看不出') ~ '（' ~ ex.get('reason', '') ~ '）')[:255] }}"
        continue_on_error: true
      - if: "{{ ex.get('dest') in ['stairs', 'study', 'bedroom'] and is_state('input_boolean.topfloor_cam_ai_enable', 'on') and is_state('input_boolean.topfloor_cam_ai_exit_enable', 'on') }}"
        then:
          - event: topfloor_cam_exit
            event_data:
              dest: "{{ ex.dest }}"
              zone: "{{ ex.get('zone', '') }}"
              dx: "{{ ex.get('dx', 0) }}"
              x: "{{ ex.get('x', 0) }}"
              reason: "{{ ex.get('reason', '') }}"

  topfloor_cam_ai_loop:
    alias: 頂樓攝影機模型判斷AI (V4.3.12)
    description: 動靜期間每秒一張快照 → 人物偵測 → 累積軌跡提早判斷上樓／下樓，動靜結束後再多看 6 秒；一決定就發事件 topfloor_cam_ai。
    mode: single
    max_exceeded: silent
    sequence:
      - repeat:
          while:
            - condition: template
              value_template: >-
                {% set a = states.binary_sensor.wu_lou_she_ying_ji_motion %}
                {% set b = states.binary_sensor.wu_lou_she_ying_ji_person_detected %}
                {{ repeat.index < 60
                   and (a.state == 'on' or b.state == 'on'
                        or (as_timestamp(now()) - as_timestamp(a.last_changed)) < 6
                        or (as_timestamp(now()) - as_timestamp(b.last_changed)) < 6) }}
          sequence:
            # V4.3.7 加速：拍下一張與分析上一張同時進行（管線化），改用中解析度串流快照（較快），取消每輪 0.3 秒等待；
            #   每輪約 0.45 秒（原本約 1.1～1.2 秒）。第一輪只拍照；分析結果在同一個分支內處理（平行分支的變數不會傳出來）。
            - variables:
                cur_file: "/config/www/snap/tf_n{{ repeat.index % 2 }}.jpg"
                prev_file: "/config/www/snap/tf_n{{ (repeat.index + 1) % 2 }}.jpg"
            - parallel:
                - action: camera.snapshot
                  target:
                    entity_id: camera.wu_lou_she_ying_ji_medium
                  data:
                    filename: "{{ cur_file }}"
                  continue_on_error: true
                - sequence:
                    - condition: template
                      value_template: "{{ repeat.index > 1 }}"
                    - action: shell_command.topfloor_track_frame
                      data:
                        frame: "{{ prev_file }}"
                        ts: "{{ now().timestamp() - 0.45 }}"
                        reset: "{{ '--reset' if repeat.index == 2 else '' }}"
                      response_variable: r
                      continue_on_error: true
                    - variables:
                        res: "{{ (r.stdout if r.stdout is mapping else (r.stdout | from_json({}))) if (r is defined and r is mapping and r.get('stdout')) else {} }}"
                    # V4.3.12：模型確認畫面有人且樓梯燈未全亮 → 發出 topfloor_cam_person 讓 08-5C 直接忽略防呆開燈
                    - if: >-
                        {{ res is mapping and (res.get('persons', 0) | int(0)) > 0
                           and (is_state('light.yeelink_color5_13b8_light', 'off') or is_state('light.yeelink_color5_0fb7_light', 'off'))
                           and is_state('input_boolean.topfloor_stairs_keep_on', 'off') }}
                      then:
                        - event: topfloor_cam_person
                          event_data:
                            persons: "{{ res.get('persons', 1) | int(1) }}"
                            frames: "{{ res.get('frames', 0) | int(0) }}"
                            source: "cam_ai_loop"
                    - if: "{{ res is mapping and res.get('fire') in ['up', 'down'] }}"
                      then:
                        - action: input_number.increment
                          target:
                            entity_id: input_number.topfloor_ai_fired
                        - action: input_datetime.set_datetime
                          target:
                            entity_id: "input_datetime.topfloor_cam_ai_{{ res.fire }}_last"
                          data:
                            timestamp: "{{ now().timestamp() }}"
                        - action: input_text.set_value
                          target:
                            entity_id: input_text.topfloor_cam_ai_last
                          data:
                            value: "{{ (now().strftime('%H:%M:%S') ~ ' ' ~ res.fire ~ '（' ~ res.reason ~ '，信心 ' ~ res.conf ~ '，第 ' ~ res.frames ~ ' 幀）')[:255] }}"
                        - if: "{{ is_state('input_boolean.topfloor_cam_ai_enable', 'on') }}"
                          then:
                            - event: topfloor_cam_ai
                              event_data:
                                dir: "{{ res.fire }}"
                                conf: "{{ res.conf }}"
                                reason: "{{ res.reason }}"
                                frames: "{{ res.frames }}"
                    - if: "{{ res is mapping and res.get('exit') is mapping }}"
                      then:
                        - action: script.topfloor_cam_ai_exit
                          data:
                            ex: "{{ res.exit }}"
                          continue_on_error: true
      # 動靜結束：最後分類；整段都沒人＝有動靜但畫面沒人（降雜訊統計）
      - action: shell_command.topfloor_track_final
        response_variable: fr
        continue_on_error: true
      - variables:
          fin: "{{ (fr.stdout | from_json({})) if (fr is defined and fr is mapping and fr.get('stdout')) else {} }}"
      - if: "{{ fin is mapping and fin.get('exit') is mapping }}"
        then:
          - action: script.topfloor_cam_ai_exit
            data:
              ex: "{{ fin.exit }}"
            continue_on_error: true
      - if: "{{ fin is mapping and fin.get('dir') == 'none' }}"
        then:
          - action: input_number.increment
            target:
              entity_id: input_number.topfloor_ai_ghost
      - action: input_text.set_value
        target:
          entity_id: input_text.topfloor_cam_ai_last
        data:
          value: "{{ (now().strftime('%H:%M:%S') ~ ' 收尾：' ~ fin.get('dir', '?') ~ '（' ~ fin.get('reason', '') ~ '；已提早判斷：' ~ (fin.get('already_fired', []) | join(',')) ~ '）')[:255] }}"

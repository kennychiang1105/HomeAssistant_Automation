# ─────────────────────────────────────────────────────────────
# 網關同步鎖 (V4.2.3)
# 更新紀錄（統一格式）：
# - V4.2.3：新增。按「解除網關警報」(106C) 時，Aqara 虛擬情境開關會被好幾方同時改：106C 本身、106（開關→網關）、106D（網關→開關）、
#           Apple 家庭自己的自動化（會把 HA 的開關狀態又回送一輪指令），結果網關連續「解除→警戒→解除→警戒」多次、每次都會響，
#           警戒瞬間變成解除還會觸發 100A 到家情境（2026-10-25 22:51 事件）。
#   作法：106C 一開始把 gateway_sync_lock_until 設成「現在 + 60 秒」，期間 106、106D、00-2J、100A 都略過（HA 啟動的觸發不受影響），
#   106C 收尾時等 15 秒讓 Apple 家庭回送完，再一次把開關整理成「在家開、其餘關」、網關確認在家警戒，最後把鎖延到「現在 + 20 秒」。
# ─────────────────────────────────────────────────────────────
input_datetime:
  gateway_sync_lock_until:
    name: 網關同步鎖｜鎖到（內部）
    has_date: true
    has_time: true
    icon: mdi:lock-clock

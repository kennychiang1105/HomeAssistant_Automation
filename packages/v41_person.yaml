# 手機追蹤 person 化（V4.1.0，2026-10-10；A／項目 2）
# sensor.kenny_phone_tracker：person.kenny 目前使用中的手機追蹤實體（person 的 source）。
# sensor.kenny_phone_ap_mac：該手機所在 AP MAC（小寫；沒有則空字串）。供 08-5F／5G／5J 共用（08-5F／5G／5J 已改用）。
# V4.1.5（2026-10-11）：切換完成，已移除舊判斷 input_text.iphone_tracker_entity_kenny、比對用 binary_sensor.v41_phone_ap_match 與 00-4手機追蹤比對AI。
template:
  - sensor:
      - name: Kenny 手機追蹤實體
        unique_id: v41_kenny_phone_tracker
        default_entity_id: sensor.kenny_phone_tracker
        icon: mdi:cellphone-marker
        state: "{{ state_attr('person.kenny', 'source') or '' }}"
      - name: Kenny 手機 AP MAC
        unique_id: v41_kenny_phone_ap_mac
        default_entity_id: sensor.kenny_phone_ap_mac
        icon: mdi:wifi-marker
        state: >-
          {% set src = state_attr('person.kenny', 'source') %}
          {% set ap = state_attr(src, 'ap_mac') if src else none %}
          {{ (ap | string | lower) if ap else '' }}

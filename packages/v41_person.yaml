# 手機追蹤 person 化（V4.1.0，2026-10-10；A／項目 2）
# sensor.kenny_phone_tracker：person.kenny 目前使用中的手機追蹤實體（person 的 source）。
# sensor.kenny_phone_ap_mac：該手機所在 AP MAC（小寫；沒有則空字串）。供 08-5F／5G／5J 共用（尚未切換，等使用者說「切換」）。
# binary_sensor.v41_phone_ap_match：新判斷（person）與舊判斷（input_text.iphone_tracker_entity_kenny）是否一致，供 00-4手機追蹤比對AI 驗證。
input_number:
  v41_phone_match_ok:
    name: 手機追蹤比對一致次數
    min: 0
    max: 1000000
    step: 1
    initial: 0
    mode: box
  v41_phone_match_bad:
    name: 手機追蹤比對不一致次數
    min: 0
    max: 1000000
    step: 1
    initial: 0
    mode: box
template:
  - sensor:
      - name: Kenny 手機追蹤實體
        unique_id: v41_kenny_phone_tracker
        default_entity_id: sensor.kenny_phone_tracker
        icon: mdi:cellphone-marker
        state: "{{ state_attr('person.kenny', 'source') or '' }}"
      - name: Kenny 手機 AP MAC
        unique_id: v41_kenny_phone_ap_mac
        default_entity_id: sensor.kenny_phone_ap_mac
        icon: mdi:wifi-marker
        state: >-
          {% set src = state_attr('person.kenny', 'source') %}
          {% set ap = state_attr(src, 'ap_mac') if src else none %}
          {{ (ap | string | lower) if ap else '' }}
  - binary_sensor:
      - name: 手機追蹤新舊一致
        unique_id: v41_phone_ap_match
        default_entity_id: binary_sensor.v41_phone_ap_match
        state: >-
          {% set s = states('input_text.iphone_tracker_entity_kenny') %}
          {% set ent = 'device_tracker.iphone_17_pro_max_kenny' if s in ['unknown', 'unavailable', ''] else s %}
          {% set old = (state_attr(ent, 'ap_mac') | default('', true)) | string | lower %}
          {{ old == states('sensor.kenny_phone_ap_mac') }}
        attributes:
          new: "{{ states('sensor.kenny_phone_ap_mac') }}"
          old: >-
            {% set s = states('input_text.iphone_tracker_entity_kenny') %}
            {% set ent = 'device_tracker.iphone_17_pro_max_kenny' if s in ['unknown', 'unavailable', ''] else s %}
            {{ (state_attr(ent, 'ap_mac') | default('', true)) | string | lower }}
